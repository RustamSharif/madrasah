<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Фикх аль-Ибада (Мухтасар аль-Кудури)</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="../style.css?v=20261126">
    <script src="../auth.js?v=20261126"></script>
    <script>
        if (typeof protectCoursePage === "function") {
            protectCoursePage("fiqh", "Фикх аль-Ибада");
        }
    </script>
    <style>
        .chapter-list { display: flex; flex-direction: column; gap: 12px; }
        .chapter-row {
            background: var(--card-inner, #DCE5DD);
            border: 1px solid var(--border, #8FA695);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .chapter-info { flex: 1; min-width: 210px; }
        .chapter-num {
            display: inline-block;
            background: var(--primary, #1F523F);
            color: #F4F7F4;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 7px;
            margin-bottom: 5px;
        }
        .chapter-score-badge {
            display: inline-block;
            background: #C7DFC9;
            color: #16301B;
            border: 1px solid #6B9474;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 2px 9px;
            border-radius: 7px;
            margin-left: 6px;
        }
        .chapter-title { font-size: 1.04rem; font-weight: 700; color: var(--text, #1A281F); margin: 0; }
        .chapter-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-action {
            padding: 9px 14px;
            border-radius: 10px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }
        .btn-cheat {
            background: #D3DFD5;
            color: #1A281F;
            border: 1px solid #8FA695;
        }
        .btn-test {
            background: #1F523F;
            color: #F4F7F4;
        }
        .btn-final {
            width: 100%;
            justify-content: center;
            padding: 14px;
            font-size: 1rem;
            background: #1F523F;
            color: #F4F7F4;
            margin-top: 12px;
            border-radius: 12px;
            border: 1px solid #48735E;
            font-weight: 700;
            cursor: pointer;
        }
        .quiz-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border, #8FA695);
        }
        .progress-text { font-weight: 700; font-size: 0.92rem; color: var(--primary, #1F523F); }
        .progress-track {
            width: 100%;
            height: 8px;
            background: #C8D4CA;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 14px;
        }
        .progress-fill {
            height: 100%;
            background: #1F523F;
            width: 0%;
            transition: width 0.25s ease;
        }
        .topic-badge {
            display: inline-block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #3C5042;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .question-text { font-size: 1.12rem; font-weight: 700; margin-bottom: 16px; line-height: 1.45; color: #1A281F; }
        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .option-btn {
            padding: 13px 15px;
            font-size: 0.98rem;
            text-align: left;
            background: #DCE5DD;
            color: #1A281F;
            border: 1px solid #9BB0A0;
            border-radius: 12px;
            cursor: pointer;
            line-height: 1.42;
            font-family: inherit;
        }
        .option-btn:hover:not(:disabled) { border-color: #1F523F; background: #D0DDD2; }
        .option-btn:disabled { cursor: default; }
        .option-btn.correct {
            background: #C7DFC9 !important;
            border: 2px solid #4D7C55 !important;
            color: #16301B !important;
            font-weight: 700;
        }
        .option-btn.wrong {
            background: #E8CECA !important;
            border: 2px solid #A85B52 !important;
            color: #421814 !important;
        }
        .explanation-box {
            display: none;
            margin-top: 16px;
            padding: 14px 16px;
            background: #D6E1D8;
            border-left: 4px solid #1F523F;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #1A281F;
            line-height: 1.5;
        }
        .source-tag { display: block; font-size: 0.84rem; color: #435749; margin-top: 7px; font-style: italic; }
        .quiz-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 10px; }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(14, 22, 17, 0.72);
            z-index: 1000;
            padding: 14px;
            overflow-y: auto;
            align-items: flex-start;
            justify-content: center;
        }
        .modal-card {
            background: #E5ECE6;
            color: #1A281F;
            max-width: 720px;
            width: 100%;
            border-radius: 16px;
            padding: 20px;
            margin: 16px auto;
            border: 1px solid #8FA695;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #8FA695;
            padding-bottom: 10px;
            margin-bottom: 14px;
            gap: 10px;
        }
        .modal-body h3 { margin-top: 0; color: #1F523F; font-size: 1.1rem; }
        .modal-body ul, .modal-body ol { padding-left: 20px; }
        .modal-body li { margin-bottom: 8px; }
        .result-box { text-align: center; padding: 10px 0; }
        .result-percent { font-size: 2.3rem; font-weight: 800; color: #1F523F; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <a href="../index.html" id="back-catalog-btn" class="back-btn">Назад</a>
    </div>

    <div class="header">
        <h1>Фикх аль-Ибада</h1>
        <p>Интерактивный курс и конспекты по «Мухтасар аль-Кудури» (Ханафитский мазхаб)</p>
        <div class="stats-bar">
            <span class="stat-pill">📚 16 глав</span>
            <span class="stat-pill" id="total-q-pill">📝 240 вопросов</span>
            <span class="stat-pill">📖 16 шпаргалок</span>
        </div>
    </div>

    <!-- Главное меню глав -->
    <div id="menu-screen" class="card">
        <div class="chapter-list" id="chapter-list"></div>
        <button class="btn-final" onclick="startFinalExam()">🎓 Итоговый зачёт (40 случайных вопросов по всему курсу)</button>
    </div>

    <!-- Экран прохождения теста -->
    <div id="quiz-screen" class="card" style="display: none;">
        <div class="quiz-top">
            <span class="progress-text" id="progress-text">Вопрос 1 из 15</span>
            <div style="display:flex; gap:8px;">
                <button class="btn-action btn-cheat" id="in-quiz-cheat-btn" onclick="openCurrentCheat()">📖 Шпаргалка</button>
                <button class="btn-action btn-cheat" onclick="returnToMenu()">В меню</button>
            </div>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="topic-badge" id="q-topic"></div>
        <div class="question-text" id="q-text"></div>
        <div class="options-list" id="q-options"></div>
        <div class="explanation-box" id="q-explanation">
            <div id="q-exp-text"></div>
            <span class="source-tag" id="q-source"></span>
        </div>
        <div class="quiz-footer">
            <span style="font-weight:700; font-size:0.95rem; color:#1F523F;" id="score-live">Верно: 0</span>
            <button class="btn-action btn-test" id="next-btn" style="display:none;" onclick="nextQuestion()">Следующий вопрос</button>
        </div>
    </div>

    <!-- Экран результатов -->
    <div id="result-screen" class="card" style="display: none;">
        <div class="result-box">
            <h2 id="res-title" style="margin-top:0; color:#1F523F;">Тест завершён!</h2>
            <div class="result-percent" id="res-percent">0%</div>
            <p id="res-details" style="font-size:1.05rem; font-weight:700;"></p>
            <p id="res-msg" style="color:#435749; margin-bottom:20px;"></p>
            <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
                <button class="btn-action btn-test" onclick="restartCurrentQuiz()">Пройти ещё раз</button>
                <button class="btn-action btn-cheat" onclick="returnToMenu()">К списку глав</button>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно шпаргалки -->
<div class="modal-overlay" id="cheat-modal" onclick="if(event.target===this) closeCheat()">
    <div class="modal-card">
        <div class="modal-header">
            <strong style="font-size:1.05rem; color:#1F523F;">📖 Конспект-шпаргалка</strong>
            <button class="btn-action btn-cheat" onclick="closeCheat()">Закрыть</button>
        </div>
        <div class="modal-body" id="cheat-body"></div>
    </div>
</div>

<script>
    window.FIQH_DATA = { cheatsheets: {}, questions: [] };
</script>
<script src="fiqh_part1.js?v=20261126"></script>
<script src="fiqh_cheats_1_4.js?v=20261126"></script>
<script src="fiqh_part2.js?v=20261126"></script>
<script src="fiqh_part3a.js?v=20261126"></script>
<script src="fiqh_part3b.js?v=20261126"></script>
<script src="fiqh_part4a.js?v=20261126"></script>
<script src="fiqh_part4b.js?v=20261126"></script>

<script>
    // Защита от двойного перемешивания со стороны общих скриптов: сохраняем эталонные пары (текст + флаг верности)
    if (window.FIQH_DATA && Array.isArray(window.FIQH_DATA.questions)) {
        window.FIQH_DATA.questions.forEach(q => {
            q._shuffled = true;
            if (!q._baseOptions && Array.isArray(q.options)) {
                const corrIdx = typeof q.correct === "number" ? q.correct : 0;
                q._baseOptions = q.options.map((text, idx) => ({
                    text: text,
                    isCorrect: idx === corrIdx
                }));
            }
        });
    }

    const CHAPTERS = [
        { id: "Тахарат", title: "1. Тахарат (Чистота и виды вод)" },
        { id: "Вуду", title: "2. Вуду (Малое омовение и масх)" },
        { id: "Гусль", title: "3. Гусль (Полное омовение)" },
        { id: "Тайаммум", title: "4. Тайаммум (Очищение чистой землёй)" },
        { id: "Намаз (Основы)", title: "5. Намаз: условия, времена и арканы" },
        { id: "Намаз (Сунны)", title: "6. Намаз: сунны, адабы и макрухи" },
        { id: "Намаз (Нарушения и Сахв)", title: "7. Нарушения намаза и Суджуд Сахв" },
        { id: "Джамаат", title: "8. Джамаат (Коллективный намаз)" },
        { id: "Мусафир", title: "9. Мусафир (Намаз путника)" },
        { id: "Джума и Ид", title: "10. Джума и Ид (Пятничный и праздничный намазы)" },
        { id: "Джаназа", title: "11. Джаназа (Заупокойная молитва)" },
        { id: "Пост", title: "12. Пост (Саум в Рамадан и каффара)" },
        { id: "Закят", title: "13. Закят (Нисаб, виды имущества и Фитр)" },
        { id: "Хадж", title: "14. Хадж (Ихрам, Арафат, Таваф и Са'й)" },
        { id: "Азан", title: "15. Азан и Икамат" },
        { id: "Удхия", title: "16. Жертвоприношение (Удхия / Курбан)" }
    ];

    let currentChapter = null;
    let isFinalExam = false;
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let currentPairs = [];
    let slotCounter = 0;

    function initApp() {
        const uid = (typeof getCurrentUserId === "function") ? getCurrentUserId() : (new URLSearchParams(window.location.search).get("uid") || "guest");
        const backBtn = document.getElementById("back-catalog-btn");
        if (backBtn && uid && uid !== "guest") {
            backBtn.href = "../index.html?uid=" + encodeURIComponent(uid);
        }
        const totalQ = (window.FIQH_DATA && window.FIQH_DATA.questions) ? window.FIQH_DATA.questions.length : 0;
        if (totalQ > 0) {
            document.getElementById("total-q-pill").textContent = `📝 ${totalQ} вопросов`;
        }
        renderMenu();
    }

    function getSavedProgress() {
        try {
            return JSON.parse(localStorage.getItem("fiqh_progress") || "{}");
        } catch (e) { return {}; }
    }

    function saveChapterProgress(chapterId, pct) {
        const prog = getSavedProgress();
        if (!prog[chapterId] || pct > prog[chapterId]) {
            prog[chapterId] = pct;
            localStorage.setItem("fiqh_progress", JSON.stringify(prog));
        }
    }

    function renderMenu() {
        const list = document.getElementById("chapter-list");
        const prog = getSavedProgress();
        const allQ = window.FIQH_DATA.questions || [];
        const cheats = window.FIQH_DATA.cheatsheets || {};

        list.innerHTML = CHAPTERS.map(ch => {
            const count = allQ.filter(q => q.chapter === ch.id).length;
            const hasCheat = Boolean(cheats[ch.id]);
            const bestPct = prog[ch.id];
            return `
                <div class="chapter-row">
                    <div class="chapter-info">
                        <span class="chapter-num">${count} вопр.</span>
                        ${bestPct !== undefined ? `<span class="chapter-score-badge">Лучший: ${bestPct}%</span>` : ""}
                        <div class="chapter-title">${ch.title}</div>
                    </div>
                    <div class="chapter-actions">
                        ${hasCheat ? `<button class="btn-action btn-cheat" onclick="openCheat('${ch.id}')">📖 Шпаргалка</button>` : ""}
                        <button class="btn-action btn-test" onclick="startQuiz('${ch.id}')">📝 Тест</button>
                    </div>
                </div>
            `;
        }).join("");
    }

    function openCheat(chapterId) {
        const html = (window.FIQH_DATA.cheatsheets && window.FIQH_DATA.cheatsheets[chapterId]) || "<p>Конспект для этой главы готовится.</p>";
        document.getElementById("cheat-body").innerHTML = html;
        document.getElementById("cheat-modal").style.display = "flex";
    }

    function openCurrentCheat() {
        if (currentChapter) openCheat(currentChapter);
    }

    function closeCheat() {
        document.getElementById("cheat-modal").style.display = "none";
    }

    function shuffleArray(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
    }

    function startQuiz(chapterId) {
        const allQ = window.FIQH_DATA.questions || [];
        const filtered = allQ.filter(q => q.chapter === chapterId);
        if (!filtered.length) {
            alert("Вопросы для этой главы пока не загружены.");
            return;
        }
        currentChapter = chapterId;
        isFinalExam = false;
        currentQuestions = shuffleArray(filtered);
        currentIndex = 0;
        score = 0;

        document.getElementById("in-quiz-cheat-btn").style.display = window.FIQH_DATA.cheatsheets[chapterId] ? "inline-flex" : "none";
        document.getElementById("menu-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "none";
        document.getElementById("quiz-screen").style.display = "block";
        renderQuestion();
    }

    function startFinalExam() {
        const allQ = window.FIQH_DATA.questions || [];
        if (!allQ.length) return;
        currentChapter = null;
        isFinalExam = true;
        currentQuestions = shuffleArray(allQ).slice(0, 40);
        currentIndex = 0;
        score = 0;

        document.getElementById("in-quiz-cheat-btn").style.display = "none";
        document.getElementById("menu-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "none";
        document.getElementById("quiz-screen").style.display = "block";
        renderQuestion();
    }

    function restartCurrentQuiz() {
        if (isFinalExam) startFinalExam();
        else if (currentChapter) startQuiz(currentChapter);
    }

    function buildBalancedPairs(basePairs) {
        const correctItem = basePairs.find(p => p.isCorrect) || basePairs[0];
        const wrongItems = shuffleArray(basePairs.filter(p => p !== correctItem));
        const len = basePairs.length;
        const targetSlot = (slotCounter + Math.floor(Math.random() * len)) % len;
        slotCounter++;

        const result = [];
        let wIdx = 0;
        for (let i = 0; i < len; i++) {
            if (i === targetSlot) {
                result.push(correctItem);
            } else {
                result.push(wrongItems[wIdx++]);
            }
        }
        return result;
    }

    function renderQuestion() {
        const q = currentQuestions[currentIndex];
        document.getElementById("progress-text").textContent = `Вопрос ${currentIndex + 1} из ${currentQuestions.length}`;
        document.getElementById("progress-fill").style.width = `${(currentIndex / currentQuestions.length) * 100}%`;
        document.getElementById("score-live").textContent = `Верно: ${score}`;
        document.getElementById("q-topic").textContent = isFinalExam ? `${q.chapter} • ${q.topic}` : q.topic;
        document.getElementById("q-text").textContent = q.question;

        const expBox = document.getElementById("q-explanation");
        expBox.style.display = "none";
        document.getElementById("next-btn").style.display = "none";

        const basePairs = q._baseOptions || q.options.map((text, idx) => ({
            text: text,
            isCorrect: idx === (typeof q.correct === "number" ? q.correct : 0)
        }));
        currentPairs = buildBalancedPairs(basePairs);

        const optsEl = document.getElementById("q-options");
        optsEl.innerHTML = "";
        currentPairs.forEach((pair, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.textContent = pair.text;
            btn.onclick = () => selectAnswer(idx, btn);
            optsEl.appendChild(btn);
        });
    }

    function selectAnswer(idx, btn) {
        const q = currentQuestions[currentIndex];
        const allBtns = document.querySelectorAll("#q-options .option-btn");
        allBtns.forEach(b => b.disabled = true);

        const chosen = currentPairs[idx];
        if (chosen && chosen.isCorrect) {
            btn.classList.add("correct");
            score++;
        } else {
            btn.classList.add("wrong");
            currentPairs.forEach((p, i) => {
                if (p.isCorrect && allBtns[i]) {
                    allBtns[i].classList.add("correct");
                }
            });
        }

        document.getElementById("score-live").textContent = `Верно: ${score}`;
        document.getElementById("q-exp-text").textContent = q.explanation;
        document.getElementById("q-source").textContent = q.source ? ("Источник: " + q.source) : "";
        document.getElementById("q-explanation").style.display = "block";

        const nextBtn = document.getElementById("next-btn");
        nextBtn.style.display = "inline-flex";
        nextBtn.textContent = (currentIndex === currentQuestions.length - 1) ? "Завершить тест" : "Следующий вопрос";
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            renderQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        document.getElementById("progress-fill").style.width = "100%";
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "block";

        const pct = Math.round((score / currentQuestions.length) * 100);
        if (!isFinalExam && currentChapter) {
            saveChapterProgress(currentChapter, pct);
        } else if (isFinalExam) {
            saveChapterProgress("FINAL_EXAM", pct);
        }

        document.getElementById("res-title").textContent = isFinalExam ? "Итоговый зачёт завершён!" : "Глава пройдена!";
        document.getElementById("res-percent").textContent = pct + "%";
        document.getElementById("res-details").textContent = `Правильных ответов: ${score} из ${currentQuestions.length}`;

        let msg = "Рекомендуем открыть конспект-шпаргалку по этой теме и пройти тест повторно.";
        if (pct === 100) msg = "МашаАллах! Безупречный результат, материал усвоен полностью.";
        else if (pct >= 80) msg = "Отличный результат! Вы уверенно владеете основными положениями.";
        else if (pct >= 60) msg = "Хороший уровень, но стоит повторить отдельные детали в шпаргалке.";
        document.getElementById("res-msg").textContent = msg;
    }

    function returnToMenu() {
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "none";
        document.getElementById("menu-screen").style.display = "block";
        renderMenu();
    }

    window.addEventListener("DOMContentLoaded", initApp);
</script>
</body>
</html>
