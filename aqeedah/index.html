<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Акыда: Основы вероубеждения</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    document.write('<script src="../auth.js?v=' + Date.now() + '"><\/script>');
  </script>
  <script>
    if (typeof protectCoursePage === "function") {
      protectCoursePage("aqeedah", "Акыда: Основы вероубеждения");
    }
  </script>
  <style>
    :root {
      --bg: #f4efe6;
      --card: #ffffff;
      --text: #1b2e24;
      --muted: #4b6658;
      --accent: #15603e;
      --accent-light: #e6f2ec;
      --border: #cfe0d6;
      --gold: #b8860b;
      --gold-bg: #fdf8eb;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --success: #15803d;
      --success-bg: #f0fdf4;
    }
    body.dark {
      --bg: #121a16;
      --card: #1b2621;
      --text: #e6efe9;
      --muted: #9bb3a6;
      --accent: #2ea36b;
      --accent-light: #1e352a;
      --border: #2c3e35;
      --gold: #eab308;
      --gold-bg: #2b2514;
      --danger: #f87171;
      --danger-bg: #331b1b;
      --success: #4ade80;
      --success-bg: #163020;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container { max-width: 720px; margin: 0 auto; }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
    }
    .btn-nav {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .hero {
      background: linear-gradient(135deg, #135437, #1c734c);
      color: #fff;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 6px 20px rgba(19, 84, 55, 0.18);
    }
    .hero h1 { margin: 0 0 8px 0; font-size: 1.45rem; }
    .hero p { margin: 0 0 14px 0; opacity: 0.92; font-size: 0.95rem; }
    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.16);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .exam-card {
      background: var(--card);
      border: 1.5px solid var(--gold);
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      margin-bottom: 18px;
    }
    .exam-card h2 { margin: 0 0 6px 0; font-size: 1.15rem; color: var(--text); }
    .exam-card p { margin: 0 0 14px 0; font-size: 0.9rem; color: var(--muted); }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .chapter-list { display: flex; flex-direction: column; gap: 12px; }
    .chapter-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .chapter-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }
    .chapter-title { font-weight: 700; font-size: 1.02rem; }
    .chapter-meta { font-size: 0.84rem; color: var(--muted); margin-top: 4px; }
    .score-pill {
      background: var(--accent-light);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 12px;
      white-space: nowrap;
    }
    .chapter-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-outline {
      background: var(--accent-light);
      color: var(--accent);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-solid {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .cheat-content h3 { margin-top: 0; color: var(--accent); font-size: 1.15rem; }
    .cheat-content ul, .cheat-content ol { padding-left: 20px; }
    .cheat-content li { margin-bottom: 8px; }
    .q-progress {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 600;
    }
    .q-text { font-size: 1.08rem; font-weight: 700; margin-bottom: 16px; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option-btn {
      text-align: left;
      background: var(--bg);
      color: var(--text);
      border: 1.5px solid var(--border);
      padding: 13px 15px;
      border-radius: 12px;
      font-size: 0.96rem;
      cursor: pointer;
      transition: 0.15s;
    }
    .option-btn.correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: var(--success);
      font-weight: 600;
    }
    .option-btn.wrong {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }
    .explanation {
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      background: var(--gold-bg);
      border: 1px solid var(--gold);
      font-size: 0.92rem;
    }
    .footer-tag {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 24px;
      padding-bottom: 12px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <button class="btn-nav" onclick="goBackToMenu()">← Все курсы</button>
      <button class="btn-nav" onclick="toggleTheme()">🌓 Тема</button>
    </div>

    <div id="homeView">
      <div class="hero">
        <h1>Акыда: Основы вероубеждения</h1>
        <p>Разбор хадиса Джибрииля и шести столпов Имана по Корану и достоверной Сунне</p>
        <div class="badge" id="statsBadge">Загрузка материалов...</div>
      </div>

      <div class="exam-card">
        <h2>🎓 Итоговый зачёт по курсу</h2>
        <p>40 случайных вопросов из всех 10 разделов для проверки усвоения вероубеждения</p>
        <button class="btn-primary" id="startExamBtn" onclick="startExam()">Начать итоговый зачёт (40 вопросов)</button>
      </div>

      <div class="chapter-list" id="chapterList"></div>
    </div>

    <div id="cheatView" class="hidden">
      <div class="panel">
        <div id="cheatBody" class="cheat-content"></div>
        <div style="margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap;">
          <button class="btn-primary" id="cheatStartTestBtn" style="flex: 1;">Пройти тест по этой главе →</button>
          <button class="btn-nav" onclick="showHome()" style="justify-content: center;">К списку глав</button>
        </div>
      </div>
    </div>

    <div id="quizView" class="hidden">
      <div class="panel">
        <div class="q-progress">
          <span id="quizChapterLabel">Глава</span>
          <span id="quizCounter">1 / 15</span>
        </div>
        <div class="q-text" id="questionText"></div>
        <div class="options" id="optionsContainer"></div>
        <div id="explanationBox" class="explanation hidden"></div>
        <div style="margin-top: 16px; display: flex; gap: 10px;">
          <button class="btn-outline" id="inlineCheatBtn" onclick="openInlineCheat()">📖 Шпаргалка</button>
          <button class="btn-primary hidden" id="nextBtn" onclick="nextQuestion()" style="flex: 1;">Следующий вопрос →</button>
        </div>
      </div>
      <div style="text-align: center;">
        <button class="btn-nav" onclick="showHome()">← Завершить и выйти в меню глав</button>
      </div>
    </div>

    <div id="resultView" class="hidden">
      <div class="panel" style="text-align: center;">
        <div style="font-size: 46px; margin-bottom: 8px;" id="resultEmoji">🏆</div>
        <h2 style="margin: 0 0 8px 0;" id="resultTitle">Тест завершён!</h2>
        <p style="font-size: 1.1rem; font-weight: 700; color: var(--accent);" id="resultScore"></p>
        <p style="color: var(--muted); font-size: 0.94rem;" id="resultComment"></p>
        <button class="btn-primary" onclick="showHome()" style="margin-top: 12px;">Вернуться к списку глав</button>
      </div>
    </div>

    <div class="footer-tag">@sira_exam_bot</div>
  </div>

  <script>
    const CHAPTER_TITLES = [
      "1. Хадис Джибрииля: Ислам, Иман и Ихсан",
      "2. Вера в Аллаха: Единственность в Господстве и Поклонении",
      "3. Вера в Аллаха: Прекрасные Имена и Высочайшие Атрибуты",
      "4. Вера в Ангелов (аль-Маляика)",
      "5. Вера в Ниспосланные Писания (аль-Кутуб)",
      "6. Вера в Пророков и Посланников (ар-Русуль)",
      "7. Последний день: Смерть, Барзах и Признаки Часа",
      "8. Последний день: Воскрешение, Расчёт, Рай и Ад",
      "9. Вера в Предопределение (аль-Кадар)",
      "10. Сохранение Имана и дела, нарушающие Единобожие"
    ];

    window.AQEEDAH_CHAPTERS = CHAPTER_TITLES.map((title, idx) => ({
      id: idx + 1,
      title: title,
      cheatsheet: "",
      questions: []
    }));

    window.AQEEDAH_DATA = { cheatsheets: {}, questions: [] };

    function resolveChapterIndex(rawId, rawTitle) {
      if (typeof rawId === "number" && rawId >= 1 && rawId <= 10) {
        return rawId - 1;
      }
      if (typeof rawId === "string" && /^\d+$/.test(rawId.trim())) {
        const n = parseInt(rawId.trim(), 10);
        if (n >= 1 && n <= 10) return n - 1;
      }
      const titleStr = String(rawTitle || "").toLowerCase();
      const numMatch = titleStr.match(/^(\d+)\./);
      if (numMatch) {
        const n = parseInt(numMatch[1], 10);
        if (n >= 1 && n <= 10) return n - 1;
      }
      const keywords = [
        ["джибриил", "ихсан"],
        ["господств", "поклонен", "рубубия", "улюхия"],
        ["имена", "атрибут", "сыфат"],
        ["ангел", "маляика"],
        ["писани", "кутуб"],
        ["пророк", "посланник", "русуль"],
        ["смерт", "барзах", "признак"],
        ["воскрешен", "расчёт", "рай и ад"],
        ["предопределен", "кадар"],
        ["сохранен", "нарушающ", "единобож"]
      ];
      for (let i = 0; i < keywords.length; i++) {
        if (keywords[i].some(kw => titleStr.includes(kw))) return i;
      }
      return -1;
    }

    function normalizeQuestions(list, chapterTitle) {
      if (!Array.isArray(list)) return [];
      return list.map(item => ({
        chapter: chapterTitle,
        q: item.q || item.question || "",
        options: item.options || item.answers || [],
        correct: typeof item.correct === "number" ? item.correct : (typeof item.answer === "number" ? item.answer : 0),
        explanation: item.explanation || item.note || ""
      })).filter(item => item.q && item.options.length > 0);
    }

    window.registerAqeedahChapter = function() {
      const args = Array.from(arguments);
      let rawId = null;
      let rawTitle = "";
      let cheatHtml = "";
      let rawQuestions = [];

      if (args.length === 1 && typeof args[0] === "object" && args[0] !== null) {
        const obj = args[0];
        rawId = obj.id || obj.chapter || obj.num || null;
        rawTitle = obj.title || obj.name || "";
        cheatHtml = obj.cheatsheet || obj.cheat || obj.summary || "";
        rawQuestions = obj.questions || [];
      } else if (args.length >= 4) {
        rawId = args[0];
        rawTitle = typeof args[1] === "string" ? args[1] : "";
        cheatHtml = typeof args[2] === "string" ? args[2] : "";
        rawQuestions = Array.isArray(args[3]) ? args[3] : [];
      } else if (args.length === 3) {
        if (typeof args[0] === "number") {
          rawId = args[0];
          if (typeof args[1] === "string") cheatHtml = args[1];
          if (Array.isArray(args[2])) rawQuestions = args[2];
        } else {
          rawTitle = typeof args[0] === "string" ? args[0] : "";
          if (typeof args[1] === "string" && Array.isArray(args[2])) {
            cheatHtml = args[1];
            rawQuestions = args[2];
          } else if (Array.isArray(args[1]) && typeof args[2] === "string") {
            rawQuestions = args[1];
            cheatHtml = args[2];
          }
        }
      }

      const idx = resolveChapterIndex(rawId, rawTitle);
      if (idx >= 0 && idx < window.AQEEDAH_CHAPTERS.length) {
        const ch = window.AQEEDAH_CHAPTERS[idx];
        if (typeof cheatHtml === "string" && cheatHtml.trim()) {
          ch.cheatsheet = cheatHtml;
        }
        const normQ = normalizeQuestions(rawQuestions, ch.title);
        if (normQ.length > 0) {
          ch.questions = normQ;
        }
      }
    };
  </script>

  <script>
    const v = Date.now();
    ["aqeedah_part1.js", "aqeedah_part2.js", "aqeedah_part3a.js", "aqeedah_part3b.js"].forEach(file => {
      document.write('<script src="' + file + '?v=' + v + '"><\/script>');
    });
  </script>

  <script>
    function syncLegacyDataIfNeeded() {
      if (window.AQEEDAH_DATA && window.AQEEDAH_DATA.cheatsheets) {
        Object.entries(window.AQEEDAH_DATA.cheatsheets).forEach(([k, val]) => {
          const idx = resolveChapterIndex(null, k);
          if (idx >= 0 && !window.AQEEDAH_CHAPTERS[idx].cheatsheet && typeof val === "string") {
            window.AQEEDAH_CHAPTERS[idx].cheatsheet = val;
          }
        });
      }
      if (window.AQEEDAH_DATA && Array.isArray(window.AQEEDAH_DATA.questions)) {
        window.AQEEDAH_DATA.questions.forEach(q => {
          const idx = resolveChapterIndex(null, q.chapter || "");
          if (idx >= 0) {
            const ch = window.AQEEDAH_CHAPTERS[idx];
            if (!ch.questions.some(existing => existing.q === q.q)) {
              ch.questions.push(...normalizeQuestions([q], ch.title));
            }
          }
        });
      }
    }

    let progress = JSON.parse(localStorage.getItem("aqeedah_progress_v1") || "{}");
    let currentQuiz = [];
    let currentIdx = 0;
    let score = 0;
    let activeChapterIdx = null;

    function toggleTheme() {
      document.body.classList.toggle("dark");
      localStorage.setItem("madrasah_theme", document.body.classList.contains("dark") ? "dark" : "light");
    }
    if (localStorage.getItem("madrasah_theme") === "dark") {
      document.body.classList.add("dark");
    }

    function goBackToMenu() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id") || localStorage.getItem("madrasah_manual_id");
      window.location.href = id ? "../index.html?id=" + encodeURIComponent(id) : "../index.html";
    }

    function hideAllViews() {
      ["homeView", "cheatView", "quizView", "resultView"].forEach(id => {
        document.getElementById(id).classList.add("hidden");
      });
    }

    function showHome() {
      hideAllViews();
      document.getElementById("homeView").classList.remove("hidden");
      renderHome();
      window.scrollTo(0, 0);
    }

    function renderHome() {
      syncLegacyDataIfNeeded();
      const totalCheats = window.AQEEDAH_CHAPTERS.filter(c => c.cheatsheet && c.cheatsheet.trim().length > 0).length;
      const totalQuestions = window.AQEEDAH_CHAPTERS.reduce((sum, c) => sum + c.questions.length, 0);
      document.getElementById("statsBadge").textContent =
        `10 глав • ${totalCheats} шпаргалок • ${totalQuestions} вопросов`;

      const examBtn = document.getElementById("startExamBtn");
      examBtn.disabled = totalQuestions === 0;

      const list = document.getElementById("chapterList");
      list.innerHTML = "";

      window.AQEEDAH_CHAPTERS.forEach((ch, idx) => {
        const best = progress[ch.id];
        const card = document.createElement("div");
        card.className = "chapter-card";
        card.innerHTML = `
          <div class="chapter-header">
            <div>
              <div class="chapter-title">${ch.title}</div>
              <div class="chapter-meta">Вопросов: ${ch.questions.length} ${ch.cheatsheet ? "• Есть конспект" : ""}</div>
            </div>
            ${best !== undefined ? `<div class="score-pill">Лучший: ${best}%</div>` : ""}
          </div>
          <div class="chapter-actions">
            <button class="btn-outline" onclick="openCheat(${idx})" ${!ch.cheatsheet ? "disabled" : ""}>📖 Шпаргалка</button>
            <button class="btn-solid" onclick="startChapterQuiz(${idx})" ${ch.questions.length === 0 ? "disabled" : ""}>Пройти тест →</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function openCheat(idx) {
      const ch = window.AQEEDAH_CHAPTERS[idx];
      if (!ch || !ch.cheatsheet) return;
      activeChapterIdx = idx;
      hideAllViews();
      document.getElementById("cheatBody").innerHTML = ch.cheatsheet;
      const startBtn = document.getElementById("cheatStartTestBtn");
      startBtn.style.display = ch.questions.length > 0 ? "block" : "none";
      startBtn.onclick = () => startChapterQuiz(idx);
      document.getElementById("cheatView").classList.remove("hidden");
      window.scrollTo(0, 0);
    }

    function openInlineCheat() {
      if (activeChapterIdx === null) return;
      const ch = window.AQEEDAH_CHAPTERS[activeChapterIdx];
      if (!ch || !ch.cheatsheet) return;
      const box = document.getElementById("explanationBox");
      box.innerHTML = ch.cheatsheet;
      box.classList.remove("hidden");
    }

    function shuffle(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function startChapterQuiz(idx) {
      const ch = window.AQEEDAH_CHAPTERS[idx];
      if (!ch || ch.questions.length === 0) return;
      activeChapterIdx = idx;
      currentQuiz = shuffle(ch.questions);
      currentIdx = 0;
      score = 0;
      document.getElementById("quizChapterLabel").textContent = ch.title;
      document.getElementById("inlineCheatBtn").style.display = ch.cheatsheet ? "inline-flex" : "none";
      hideAllViews();
      document.getElementById("quizView").classList.remove("hidden");
      renderQuestion();
      window.scrollTo(0, 0);
    }

    function startExam() {
      const allQ = window.AQEEDAH_CHAPTERS.flatMap(c => c.questions);
      if (allQ.length === 0) return;
      activeChapterIdx = null;
      currentQuiz = shuffle(allQ).slice(0, 40);
      currentIdx = 0;
      score = 0;
      document.getElementById("quizChapterLabel").textContent = "🎓 Итоговый зачёт";
      document.getElementById("inlineCheatBtn").style.display = "none";
      hideAllViews();
      document.getElementById("quizView").classList.remove("hidden");
      renderQuestion();
      window.scrollTo(0, 0);
    }

    function renderQuestion() {
      const item = currentQuiz[currentIdx];
      document.getElementById("quizCounter").textContent = `${currentIdx + 1} / ${currentQuiz.length}`;
      document.getElementById("questionText").textContent = item.q;
      const expBox = document.getElementById("explanationBox");
      expBox.classList.add("hidden");
      expBox.innerHTML = "";
      document.getElementById("nextBtn").classList.add("hidden");

      const container = document.getElementById("optionsContainer");
      container.innerHTML = "";

      item.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = opt;
        btn.onclick = () => selectAnswer(i, btn);
        container.appendChild(btn);
      });
    }

    function selectAnswer(chosenIdx, btnEl) {
      const item = currentQuiz[currentIdx];
      const buttons = document.querySelectorAll(".option-btn");
      buttons.forEach(b => b.disabled = true);

      if (chosenIdx === item.correct) {
        score++;
        btnEl.classList.add("correct");
      } else {
        btnEl.classList.add("wrong");
        if (buttons[item.correct]) {
          buttons[item.correct].classList.add("correct");
        }
      }

      if (item.explanation) {
        const expBox = document.getElementById("explanationBox");
        expBox.innerHTML = `<strong>Пояснение:</strong> ${item.explanation}`;
        expBox.classList.remove("hidden");
      }

      const nextBtn = document.getElementById("nextBtn");
      nextBtn.textContent = currentIdx + 1 < currentQuiz.length ? "Следующий вопрос →" : "Показать результат →";
      nextBtn.classList.remove("hidden");
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < currentQuiz.length) {
        renderQuestion();
        window.scrollTo(0, 0);
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      const pct = Math.round((score / currentQuiz.length) * 100);
      if (activeChapterIdx !== null) {
        const chId = window.AQEEDAH_CHAPTERS[activeChapterIdx].id;
        if (progress[chId] === undefined || pct > progress[chId]) {
          progress[chId] = pct;
          localStorage.setItem("aqeedah_progress_v1", JSON.stringify(progress));
        }
      }

      hideAllViews();
      document.getElementById("resultEmoji").textContent = pct >= 80 ? "🏆" : (pct >= 60 ? "📘" : "📖");
      document.getElementById("resultTitle").textContent = pct >= 80 ? "Отличный результат!" : "Тест завершён";
      document.getElementById("resultScore").textContent = `Правильных ответов: ${score} из ${currentQuiz.length} (${pct}%)`;
      document.getElementById("resultComment").textContent =
        pct >= 80
          ? "Ма шаа Аллах! Материал усвоен уверенно."
          : "Рекомендуем повторить конспект-шпаргалку и пройти тест ещё раз для закрепления.";
      document.getElementById("resultView").classList.remove("hidden");
      window.scrollTo(0, 0);
    }

    document.addEventListener("DOMContentLoaded", renderHome);
  </script>
</body>
</html>
