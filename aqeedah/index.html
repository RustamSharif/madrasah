<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Акыда: Основы вероубеждения</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (function() {
      const v = Math.floor(Date.now() / 60000);
      document.write('<script src="../auth.js?v=' + v + '"><\/script>');
    })();
  </script>
  <script>
    if (typeof protectCoursePage === "function") {
      protectCoursePage("aqeedah", "Акыда: Основы вероубеждения");
    }
  </script>
  <style>
    :root {
      --bg: #f4efe6;
      --card: #ffffff;
      --primary: #15603e;
      --primary-dark: #0f472d;
      --accent: #c59b27;
      --text: #1b2e24;
      --muted: #556b5f;
      --border: #d5e2da;
      --soft: #eef5f0;
      --danger: #b93829;
      --danger-bg: #fdecea;
      --success: #1b7a48;
      --success-bg: #e7f6ee;
    }
    body.dark {
      --bg: #111915;
      --card: #19241e;
      --primary: #258a5b;
      --primary-dark: #1a6642;
      --accent: #d8af3b;
      --text: #e6efe9;
      --muted: #9eb3a7;
      --border: #2a3b32;
      --soft: #202e27;
      --danger: #e06c5e;
      --danger-bg: #361e1b;
      --success: #4cc384;
      --success-bg: #193326;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 16px 14px 40px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    .container { max-width: 720px; margin: 0 auto; }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
    }
    .nav-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .hero {
      background: linear-gradient(135deg, #15603e 0%, #0d452c 100%);
      color: #fff;
      border-radius: 20px;
      padding: 22px 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(15, 71, 45, 0.18);
    }
    .hero h1 { margin: 0 0 8px; font-size: 1.45rem; line-height: 1.25; }
    .hero p { margin: 0 0 14px; font-size: 0.95rem; opacity: 0.92; }
    .stats-pill {
      display: inline-block;
      background: rgba(255,255,255,0.16);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .chapter-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .chapter-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .chapter-title { font-weight: 700; font-size: 1.03rem; color: var(--text); }
    .chapter-sub { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
    .badge-score {
      background: var(--soft);
      color: var(--primary);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      border: none;
      border-radius: 11px;
      padding: 10px 14px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary { background: var(--primary); color: #fff; flex: 1; min-width: 140px; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-outline {
      background: var(--soft);
      color: var(--text);
      border: 1px solid var(--border);
      flex: 1;
      min-width: 130px;
    }
    .exam-box {
      background: var(--card);
      border: 2px solid var(--accent);
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      margin-top: 18px;
    }
    .exam-box h3 { margin: 0 0 6px; font-size: 1.15rem; }
    .exam-box p { margin: 0 0 14px; color: var(--muted); font-size: 0.92rem; }
    .hidden { display: none !important; }

    /* Quiz & Cheatsheet views */
    .quiz-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
    }
    .quiz-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.88rem;
      color: var(--muted);
      font-weight: 600;
    }
    .progress-bar {
      width: 100%;
      height: 7px;
      background: var(--soft);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.25s ease;
    }
    .q-text { font-size: 1.08rem; font-weight: 700; margin-bottom: 16px; }
    .opt-btn {
      width: 100%;
      text-align: left;
      background: var(--soft);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      font-size: 0.96rem;
      cursor: pointer;
      transition: 0.15s;
      line-height: 1.4;
    }
    .opt-btn.correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: var(--success);
      font-weight: 600;
    }
    .opt-btn.wrong {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }
    .explanation {
      background: var(--soft);
      border-left: 4px solid var(--primary);
      padding: 12px 14px;
      border-radius: 10px;
      margin-top: 12px;
      font-size: 0.92rem;
    }
    .cheat-content h3 { margin-top: 0; color: var(--primary); }
    .cheat-content ul, .cheat-content ol { padding-left: 20px; }
    .cheat-content li { margin-bottom: 8px; }
    .footer {
      text-align: center;
      margin-top: 26px;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <button class="nav-btn" onclick="goHome()">← Все курсы</button>
      <button class="nav-btn" onclick="toggleTheme()">🌓 Тема</button>
    </div>

    <div id="menuView">
      <div class="hero">
        <h1>Акыда: Основы вероубеждения</h1>
        <p>Разбор хадиса Джибрииля и шести столпов Имана по Корану и достоверной Сунне</p>
        <div class="stats-pill" id="statsPill">10 глав • Загрузка материалов...</div>
      </div>

      <div id="chaptersList"></div>

      <div class="exam-box">
        <h3>🎓 Итоговый зачёт по курсу</h3>
        <p>40 случайных вопросов из всех 10 разделов для проверки усвоения вероубеждения</p>
        <button class="btn btn-primary" onclick="startFinalExam()">Начать итоговый зачёт (40 вопросов)</button>
      </div>
    </div>

    <div id="quizView" class="hidden">
      <div class="quiz-card">
        <div class="quiz-top">
          <span id="quizChapterLabel">Глава</span>
          <span id="quizCounter">1 / 15</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="q-text" id="questionText"></div>
        <div id="optionsContainer"></div>
        <div id="explanationBox" class="explanation hidden"></div>
        <div class="btn-row" style="margin-top: 16px;">
          <button class="btn btn-outline" id="inQuizCheatBtn" onclick="openCurrentCheat()">📖 Шпаргалка</button>
          <button class="btn btn-primary hidden" id="nextBtn" onclick="nextQuestion()">Следующий вопрос →</button>
        </div>
        <div style="margin-top: 10px;">
          <button class="nav-btn" style="width:100%; justify-content:center;" onclick="backToMenu()">← К списку глав</button>
        </div>
      </div>
    </div>

    <div id="resultView" class="hidden">
      <div class="quiz-card" style="text-align:center;">
        <div style="font-size: 46px; margin-bottom: 8px;" id="resEmoji">🎉</div>
        <h2 id="resTitle" style="margin: 0 0 8px;">Тест завершён!</h2>
        <p id="resScore" style="font-size: 1.15rem; font-weight: 700; color: var(--primary); margin: 0 0 8px;"></p>
        <p id="resComment" style="color: var(--muted); margin: 0 0 18px;"></p>
        <div class="btn-row">
          <button class="btn btn-outline" onclick="retryQuiz()">🔄 Пройти заново</button>
          <button class="btn btn-primary" onclick="backToMenu()">← К списку глав</button>
        </div>
      </div>
    </div>

    <div id="cheatView" class="hidden">
      <div class="quiz-card">
        <div class="cheat-content" id="cheatBody"></div>
        <div class="btn-row" style="margin-top: 18px;">
          <button class="btn btn-primary" id="cheatBackBtn" onclick="closeCheat()">Понятно, вернуться ←</button>
        </div>
      </div>
    </div>

    <div class="footer">@sira_exam_bot</div>
  </div>

  <script>
    const CHAPTER_META = [
      { id: 1, title: "Хадис Джибрииля: Ислам, Иман и Ихсан", keywords: ["джибриил", "ислам, иман", "ступен"] },
      { id: 2, title: "Вера в Аллаха: Господство и Поклонение", keywords: ["господств", "поклонен", "рубубия", "улюхия"] },
      { id: 3, title: "Вера в Аллаха: Имена и Атрибуты", keywords: ["имена", "атрибут", "сыфат"] },
      { id: 4, title: "Вера в Ангелов (аль-Маляика)", keywords: ["ангел", "маляика"] },
      { id: 5, title: "Вера в Ниспосланные Писания (аль-Кутуб)", keywords: ["писан", "кутуб", "коран"] },
      { id: 6, title: "Вера в Пророков и Посланников (ар-Русуль)", keywords: ["пророк", "посланник", "русуль"] },
      { id: 7, title: "Последний день: Смерть, Барзах и Признаки Часа", keywords: ["барзах", "признак", "могил"] },
      { id: 8, title: "Последний день: Воскрешение, Расчёт, Рай и Ад", keywords: ["воскрешен", "расчёт", "рай", "сырат"] },
      { id: 9, title: "Вера в Предопределение (аль-Кадар)", keywords: ["предопределен", "кадар"] },
      { id: 10, title: "Сохранение Имана и дела, нарушающие Единобожие", keywords: ["сохранен", "нарушающ", "единобож"] }
    ];

    window.AQEEDAH_DATA = window.AQEEDAH_DATA || {
      cheatsheets: {},
      questions: [],
      byId: {}
    };

    function ensureSlot(id) {
      if (!window.AQEEDAH_DATA.byId[id]) {
        window.AQEEDAH_DATA.byId[id] = { cheatsheet: "", questions: [] };
      }
      return window.AQEEDAH_DATA.byId[id];
    }

    window.registerAqeedahChapter = function(a, b, c, d) {
      let id = null, title = "", cheat = "", qs = [];
      if (typeof a === "number") {
        id = a;
        if (typeof b === "object" && b !== null && !Array.isArray(b)) {
          title = b.title || "";
          cheat = b.cheatsheet || b.cheat || b.content || "";
          qs = b.questions || [];
        } else {
          title = b || "";
          cheat = c || "";
          qs = Array.isArray(d) ? d : [];
        }
      } else if (typeof a === "object" && a !== null) {
        id = Number(a.id || a.chapter || a.num);
        title = a.title || "";
        cheat = a.cheatsheet || a.cheat || a.content || "";
        qs = a.questions || [];
      }
      if (id && id >= 1 && id <= 10) {
        const slot = ensureSlot(id);
        if (cheat) slot.cheatsheet = cheat;
        if (qs.length) slot.questions = qs;
      }
      if (title && cheat) window.AQEEDAH_DATA.cheatsheets[title] = cheat;
      if (Array.isArray(qs)) {
        qs.forEach(q => {
          if (!q.topic && title) q.topic = title;
          window.AQEEDAH_DATA.questions.push(q);
        });
      }
    };
  </script>

  <script>
    (function() {
      const v = Math.floor(Date.now() / 60000);
      ["aqeedah_part1.js", "aqeedah_part2.js", "aqeedah_part3a.js", "aqeedah_part3b.js"].forEach(f => {
        document.write('<script src="' + f + '?v=' + v + '"><\/script>');
      });
    })();
  </script>

  <script>
    let chaptersData = [];
    let currentQuiz = [];
    let currentIdx = 0;
    let score = 0;
    let activeChapterId = null;
    let lastViewBeforeCheat = "menuView";

    function normalizeData() {
      const rawCheats = window.AQEEDAH_DATA.cheatsheets || {};
      const rawQuestions = window.AQEEDAH_DATA.questions || [];

      chaptersData = CHAPTER_META.map(meta => {
        const slot = window.AQEEDAH_DATA.byId[meta.id] || { cheatsheet: "", questions: [] };
        let cheat = slot.cheatsheet || rawCheats[meta.title] || "";
        if (!cheat) {
          for (const [k, val] of Object.entries(rawCheats)) {
            const kl = k.toLowerCase();
            if (kl.startsWith(meta.id + ".") || meta.keywords.some(kw => kl.includes(kw))) {
              cheat = val;
              break;
            }
          }
        }

        let qs = Array.isArray(slot.questions) && slot.questions.length ? slot.questions : [];
        if (!qs.length) {
          qs = rawQuestions.filter(q => {
            if (Number(q.chapterId || q.chapter) === meta.id) return true;
            const t = String(q.topic || q.category || "").toLowerCase();
            return t === meta.title.toLowerCase() || t.startsWith(meta.id + ".") || meta.keywords.some(kw => t.includes(kw));
          });
        }

        return {
          id: meta.id,
          title: meta.title,
          cheatsheet: cheat,
          questions: qs
        };
      });
    }

    function getSavedScores() {
      try {
        return JSON.parse(localStorage.getItem("aqeedah_scores") || "{}");
      } catch (e) { return {}; }
    }

    function saveScore(chId, pct) {
      try {
        const s = getSavedScores();
        if (!s[chId] || pct > s[chId]) {
          s[chId] = pct;
          localStorage.setItem("aqeedah_scores", JSON.stringify(s));
        }
      } catch (e) {}
    }

    function renderMenu() {
      normalizeData();
      const list = document.getElementById("chaptersList");
      const scores = getSavedScores();
      let totalCheats = 0;
      let totalQs = 0;

      list.innerHTML = "";
      chaptersData.forEach(ch => {
        if (ch.cheatsheet) totalCheats++;
        totalQs += ch.questions.length;
        const best = scores[ch.id];

        const card = document.createElement("div");
        card.className = "chapter-card";
        card.innerHTML = `
          <div class="chapter-head">
            <div>
              <div class="chapter-title">${ch.id}. ${ch.title}</div>
              <div class="chapter-sub">${ch.questions.length} вопросов ${ch.cheatsheet ? "• есть конспект" : ""}</div>
            </div>
            ${best !== undefined ? `<div class="badge-score">Лучший: ${best}%</div>` : ""}
          </div>
          <div class="btn-row">
            ${ch.cheatsheet ? `<button class="btn btn-outline" onclick="openCheat(${ch.id}, 'menuView')">📖 Шпаргалка</button>` : ""}
            <button class="btn btn-primary" onclick="startChapter(${ch.id})">▶ Начать тест</button>
          </div>
        `;
        list.appendChild(card);
      });

      document.getElementById("statsPill").textContent =
        `10 глав • ${totalCheats} шпаргалок • ${totalQs} вопросов`;
    }

    function showOnly(viewId) {
      ["menuView", "quizView", "resultView", "cheatView"].forEach(id => {
        document.getElementById(id).classList.toggle("hidden", id !== viewId);
      });
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openCheat(chId, fromView) {
      const ch = chaptersData.find(c => c.id === chId);
      if (!ch || !ch.cheatsheet) return;
      lastViewBeforeCheat = fromView || "menuView";
      document.getElementById("cheatBody").innerHTML = ch.cheatsheet;
      showOnly("cheatView");
    }

    function openCurrentCheat() {
      if (activeChapterId) openCheat(activeChapterId, "quizView");
    }

    function closeCheat() {
      showOnly(lastViewBeforeCheat);
    }

    function startChapter(chId) {
      const ch = chaptersData.find(c => c.id === chId);
      if (!ch || !ch.questions.length) {
        alert("Вопросы этой главы загружаются. Пожалуйста, обновите страницу.");
        return;
      }
      activeChapterId = chId;
      currentQuiz = [...ch.questions];
      currentIdx = 0;
      score = 0;
      document.getElementById("quizChapterLabel").textContent = `Глава ${ch.id}`;
      document.getElementById("inQuizCheatBtn").classList.toggle("hidden", !ch.cheatsheet);
      showOnly("quizView");
      renderQuestion();
    }

    function startFinalExam() {
      const all = chaptersData.flatMap(c => c.questions);
      if (!all.length) {
        alert("База вопросов ещё не загружена. Обновите страницу.");
        return;
      }
      activeChapterId = null;
      const shuffled = [...all].sort(() => Math.random() - 0.5);
      currentQuiz = shuffled.slice(0, Math.min(40, shuffled.length));
      currentIdx = 0;
      score = 0;
      document.getElementById("quizChapterLabel").textContent = "Итоговый зачёт";
      document.getElementById("inQuizCheatBtn").classList.add("hidden");
      showOnly("quizView");
      renderQuestion();
    }

    function renderQuestion() {
      const q = currentQuiz[currentIdx];
      document.getElementById("quizCounter").textContent = `${currentIdx + 1} / ${currentQuiz.length}`;
      document.getElementById("progressFill").style.width = `${((currentIdx) / currentQuiz.length) * 100}%`;
      document.getElementById("questionText").textContent = q.q || q.question || "";

      const optsBox = document.getElementById("optionsContainer");
      optsBox.innerHTML = "";
      const expBox = document.getElementById("explanationBox");
      expBox.classList.add("hidden");
      expBox.innerHTML = "";
      document.getElementById("nextBtn").classList.add("hidden");

      const opts = q.options || q.answers || [];
      const correctIdx = typeof q.correct === "number" ? q.correct : (typeof q.answer === "number" ? q.answer : 0);

      opts.forEach((optText, idx) => {
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.textContent = optText;
        btn.onclick = () => selectOption(idx, correctIdx, q.explanation || q.note || "");
        optsBox.appendChild(btn);
      });
    }

    function selectOption(chosenIdx, correctIdx, explanation) {
      const btns = document.querySelectorAll("#optionsContainer .opt-btn");
      btns.forEach((b, idx) => {
        b.disabled = true;
        if (idx === correctIdx) b.classList.add("correct");
        else if (idx === chosenIdx) b.classList.add("wrong");
      });

      if (chosenIdx === correctIdx) score++;

      if (explanation) {
        const expBox = document.getElementById("explanationBox");
        expBox.innerHTML = `<strong>Пояснение:</strong> ${explanation}`;
        expBox.classList.remove("hidden");
      }

      const nextBtn = document.getElementById("nextBtn");
      nextBtn.textContent = currentIdx + 1 < currentQuiz.length ? "Следующий вопрос →" : "Завершить тест ✓";
      nextBtn.classList.remove("hidden");
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < currentQuiz.length) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      const pct = Math.round((score / currentQuiz.length) * 100);
      if (activeChapterId) saveScore(activeChapterId, pct);

      document.getElementById("resScore").textContent = `Правильных ответов: ${score} из ${currentQuiz.length} (${pct}%)`;
      if (pct >= 85) {
        document.getElementById("resEmoji").textContent = "🌟";
        document.getElementById("resTitle").textContent = "Ма шаа Аллах! Отличный результат!";
        document.getElementById("resComment").textContent = "Вы уверенно усвоили основы вероубеждения по этой теме.";
      } else if (pct >= 60) {
        document.getElementById("resEmoji").textContent = "📖";
        document.getElementById("resTitle").textContent = "Хороший результат!";
        document.getElementById("resComment").textContent = "Рекомендуем заглянуть в конспект-шпаргалку и закрепить сложные моменты.";
      } else {
        document.getElementById("resEmoji").textContent = "🤲";
        document.getElementById("resTitle").textContent = "Стоит повторить тему";
        document.getElementById("resComment").textContent = "Прочитайте конспект-шпаргалку перед повторным прохождением теста.";
      }
      showOnly("resultView");
    }

    function retryQuiz() {
      if (activeChapterId) startChapter(activeChapterId);
      else startFinalExam();
    }

    function backToMenu() {
      renderMenu();
      showOnly("menuView");
    }

    function goHome() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      window.location.href = id ? `../index.html?id=${encodeURIComponent(id)}` : "../index.html";
    }

    function toggleTheme() {
      document.body.classList.toggle("dark");
      try {
        localStorage.setItem("madrasah_theme", document.body.classList.contains("dark") ? "dark" : "light");
      } catch (e) {}
    }

    window.addEventListener("DOMContentLoaded", () => {
      try {
        if (localStorage.getItem("madrasah_theme") === "dark") {
          document.body.classList.add("dark");
        }
      } catch (e) {}
      renderMenu();
    });
  </script>
</body>
</html>
