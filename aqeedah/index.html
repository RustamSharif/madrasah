<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Акыда: Основы вероубеждения</title>
  <script>
    const cacheBust = Math.floor(Date.now() / 60000);
    document.write('<script src="../auth.js?v=' + cacheBust + '"><\/script>');
  </script>
  <script>
    if (typeof protectCoursePage === "function") {
      protectCoursePage("aqeedah", "Акыда: Основы вероубеждения");
    }
  </script>
  <style>
    :root {
      --bg: #f4efe6;
      --card: #ffffff;
      --primary: #15603e;
      --primary-hover: #0f492f;
      --accent: #b8892b;
      --text: #1b2e24;
      --muted: #526b5e;
      --border: #d5e2da;
      --soft: #eef5f0;
      --danger: #b42318;
      --danger-bg: #fef3f2;
      --success: #067647;
      --success-bg: #ecfdf3;
    }

    body.dark {
      --bg: #111915;
      --card: #19241e;
      --primary: #279663;
      --primary-hover: #1f7a50;
      --accent: #d4a74a;
      --text: #e6f0ea;
      --muted: #98b0a3;
      --border: #2a3b32;
      --soft: #1f2e26;
      --danger: #f97066;
      --danger-bg: #2c1616;
      --success: #47cd89;
      --success-bg: #132a1e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      transition: background 0.2s, color 0.2s;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
    }

    .nav-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn:hover {
      border-color: var(--primary);
    }

    .hero {
      background: linear-gradient(135deg, #15603e 0%, #0d422a 100%);
      color: #ffffff;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px rgba(21, 96, 62, 0.16);
    }

    .hero h1 {
      font-size: 1.45rem;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .hero p {
      font-size: 0.93rem;
      opacity: 0.92;
      line-height: 1.45;
      margin-bottom: 14px;
    }

    .stats-pill {
      display: inline-block;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
    }

    .chapters-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 18px;
    }

    .chapter-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.03);
    }

    .chapter-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }

    .chapter-num {
      display: inline-block;
      background: var(--soft);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.78rem;
      padding: 3px 9px;
      border-radius: 8px;
      margin-bottom: 6px;
    }

    .chapter-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .chapter-meta {
      font-size: 0.83rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .score-badge {
      background: var(--soft);
      color: var(--primary);
      border: 1px solid var(--border);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .chapter-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 11px;
      padding: 10px 15px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.15s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      flex: 1;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--soft);
      color: var(--primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--primary);
    }

    .final-exam-card {
      background: var(--card);
      border: 2px solid var(--accent);
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      margin-top: 8px;
      margin-bottom: 20px;
      box-shadow: 0 6px 20px rgba(184, 137, 43, 0.1);
    }

    .final-exam-card h2 {
      font-size: 1.15rem;
      margin-bottom: 6px;
    }

    .final-exam-card p {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* Screen views */
    .hidden {
      display: none !important;
    }

    .panel-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .cheat-content h3 {
      color: var(--primary);
      font-size: 1.15rem;
      margin-bottom: 12px;
      line-height: 1.35;
    }

    .cheat-content ul, .cheat-content ol {
      padding-left: 20px;
      margin-bottom: 10px;
      line-height: 1.55;
      font-size: 0.95rem;
    }

    .cheat-content li {
      margin-bottom: 8px;
    }

    .cheat-content p {
      line-height: 1.55;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .quiz-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 600;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--soft);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.25s;
    }

    .question-text {
      font-size: 1.08rem;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 16px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: var(--soft);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 13px 15px;
      font-size: 0.95rem;
      line-height: 1.4;
      cursor: pointer;
      transition: 0.15s;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
    }

    .option-btn.correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: var(--success);
      font-weight: 600;
    }

    .option-btn.wrong {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }

    .explanation-box {
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      background: var(--soft);
      border-left: 4px solid var(--primary);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .quiz-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .footer-note {
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 16px;
      padding-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <a href="../index.html" id="backToCatalogBtn" class="nav-btn">← Все курсы</a>
      <button class="nav-btn" onclick="toggleTheme()">🌓 Тема</button>
    </div>

    <!-- Главный экран курса -->
    <div id="homeView">
      <div class="hero">
        <h1>Акыда: Основы вероубеждения</h1>
        <p>Разбор хадиса Джибрииля и шести столпов Имана по Корану и достоверной Сунне</p>
        <div class="stats-pill" id="courseStats">10 глав • Загрузка...</div>
      </div>

      <div class="chapters-grid" id="chaptersList"></div>

      <!-- Итоговый тест перенесён вниз под список глав -->
      <div class="final-exam-card">
        <h2>🎓 Итоговый зачёт по курсу</h2>
        <p>40 случайных вопросов из всех 10 разделов для проверки усвоения вероубеждения</p>
        <button class="btn btn-primary" style="max-width: 340px; margin: 0 auto;" onclick="startFinalExam()">
          Начать итоговый зачёт (40 вопросов)
        </button>
      </div>
    </div>

    <!-- Экран шпаргалки -->
    <div id="cheatView" class="hidden">
      <div class="panel-card">
        <div class="cheat-content" id="cheatBody"></div>
        <div style="margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap;">
          <button class="btn btn-secondary" onclick="closeSubView()">← Назад</button>
          <button class="btn btn-primary" id="cheatStartQuizBtn">Пройти тест по этой главе →</button>
        </div>
      </div>
    </div>

    <!-- Экран тестирования -->
    <div id="quizView" class="hidden">
      <div class="panel-card">
        <div class="quiz-top">
          <span id="quizChapterLabel">Глава</span>
          <span id="quizCounter">1 / 15</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="quizProgressFill"></div>
        </div>
        <div class="question-text" id="questionText"></div>
        <div class="options-list" id="optionsList"></div>
        <div class="explanation-box hidden" id="explanationBox"></div>

        <div class="quiz-footer">
          <button class="btn btn-secondary" onclick="closeSubView()">✕ Выйти</button>
          <button class="btn btn-secondary hidden" id="inQuizCheatBtn" onclick="openCheatFromQuiz()">📖 Шпаргалка</button>
          <button class="btn btn-primary hidden" id="nextQuestionBtn" onclick="nextQuestion()">Далее →</button>
        </div>
      </div>
    </div>

    <!-- Экран результатов -->
    <div id="resultView" class="hidden">
      <div class="panel-card" style="text-align: center;">
        <div style="font-size: 2.6rem; margin-bottom: 10px;" id="resultEmoji">🏆</div>
        <h2 id="resultTitle" style="margin-bottom: 8px;">Результат теста</h2>
        <p id="resultSummary" style="color: var(--muted); margin-bottom: 18px; font-size: 1rem;"></p>
        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
          <button class="btn btn-secondary" onclick="showHome()">← К списку глав</button>
          <button class="btn btn-primary" style="max-width: 220px;" id="retryQuizBtn">Пройти заново</button>
        </div>
      </div>
    </div>

    <div class="footer-note">@sira_exam_bot</div>
  </div>

  <script>
    // Сохраняем ?id= при возврате в каталог
    (function preserveIdParam() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      if (id) {
        const backBtn = document.getElementById("backToCatalogBtn");
        if (backBtn) backBtn.href = "../index.html?id=" + encodeURIComponent(id);
      }
    })();

    // Тёмная тема
    if (localStorage.getItem("madrasah_theme") === "dark") {
      document.body.classList.add("dark");
    }
    function toggleTheme() {
      document.body.classList.toggle("dark");
      localStorage.setItem("madrasah_theme", document.body.classList.contains("dark") ? "dark" : "light");
    }

    // Эталонный список 10 глав
    const CHAPTERS = [
      {
        num: 1,
        title: "Хадис Джибрииля: Ислам, Иман и Ихсан",
        keywords: ["джибри", "ислам, иман", "ступени", "сущность имана"],
        cheatsheet: "",
        questions: []
      },
      {
        num: 2,
        title: "Вера в Аллаха: Единственность в Господстве и Поклонении",
        keywords: ["господств", "поклонен", "рубубия", "улюхия"],
        cheatsheet: "",
        questions: []
      },
      {
        num: 3,
        title: "Вера в Аллаха: Прекрасные Имена и Высочайшие Атрибуты",
        keywords: ["имена", "атрибут", "сыфат", "асма"],
        cheatsheet: "",
        questions: []
      },
      {
        num: 4,
        title: "Вера в Ангелов (аль-Маляика)",
        keywords: ["ангел", "маляика"],
        cheatsheet: "",
        questions: []
      },
      {
        num: 5,
        title: "Вера в Ниспосланные Писания (аль-Кутуб)",
        keywords: ["писан", "кутуб", "коран как"],
        cheatsheet: "",
        questions: []
      },
      {
        num: 6,
        title: "Вера в Пророков и Посланников (ар-Русуль)",
        keywords: ["пророк", "посланник", "русуль"],
        cheatsheet: "",
        questions: []
      },
      {
        num: 7,
        title: "Последний день: Смерть, Барзах и Признаки Часа",
        keywords: ["барзах", "признаки часа", "смерть"],
        cheatsheet: "",
        questions: []
      },
      {
        num: 8,
        title: "Последний день: Воскрешение, Расчёт, Рай и Ад",
        keywords: ["воскрешен", "расчёт", "рай и ад", "сырат"],
        cheatsheet: "",
        questions: []
      },
      {
        num: 9,
        title: "Вера в Предопределение (аль-Кадар)",
        keywords: ["предопределен", "кадар"],
        cheatsheet: "",
        questions: []
      },
      {
        num: 10,
        title: "Сохранение Имана и дела, нарушающие Единобожие",
        keywords: ["сохранение имана", "нарушающ", "навакыд", "колдовств"],
        cheatsheet: "",
        questions: []
      }
    ];

    window.AQEEDAH_DATA = { cheatsheets: {}, questions: [], chapters: [] };
    window.AQEEDAH_CHAPTERS = [];

    function normalizeQuestions(rawList, chapterTitle) {
      if (!Array.isArray(rawList)) return [];
      return rawList.map(item => {
        const qText = item.q || item.question || item.text || "";
        const opts = item.options || item.answers || item.choices || [];
        let ansIdx = 0;
        if (typeof item.answer === "number") ansIdx = item.answer;
        else if (typeof item.correct === "number") ansIdx = item.correct;
        else if (typeof item.correctIndex === "number") ansIdx = item.correctIndex;
        const exp = item.explanation || item.exp || item.comment || item.note || "";
        return {
          chapter: chapterTitle,
          q: qText,
          options: opts,
          answer: ansIdx,
          explanation: exp
        };
      }).filter(q => q.q && Array.isArray(q.options) && q.options.length > 0);
    }

    function findTargetChapter(numHint, titleHint) {
      // 1. Точное совпадение по номеру главы (1..10)
      if (numHint !== null && numHint !== undefined) {
        const parsed = parseInt(String(numHint).replace(/[^0-9]/g, ""), 10);
        if (!isNaN(parsed) && parsed >= 1 && parsed <= CHAPTERS.length) {
          return CHAPTERS[parsed - 1];
        }
      }
      // 2. Поиск по ключевым словам в заголовке
      if (titleHint) {
        const low = String(titleHint).toLowerCase();
        // Если в начале заголовка есть цифра "1.", "9.", "10."
        const leadNum = low.match(/^\s*(\d{1,2})\s*[.\-)]/);
        if (leadNum) {
          const idx = parseInt(leadNum[1], 10);
          if (idx >= 1 && idx <= CHAPTERS.length) return CHAPTERS[idx - 1];
        }
        for (const ch of CHAPTERS) {
          if (ch.keywords.some(kw => low.includes(kw))) {
            return ch;
          }
        }
      }
      // 3. Первая незаполненная глава по порядку
      return CHAPTERS.find(ch => ch.questions.length === 0) || null;
    }

    // Универсальная функция регистрации (поддерживает 2, 3, 4 аргумента и объекты)
    window.registerAqeedahChapter = function(a, b, c, d) {
      let numHint = null;
      let titleHint = "";
      let cheatHtml = "";
      let qList = [];

      if (a && typeof a === "object" && !Array.isArray(a)) {
        numHint = a.num ?? a.chapter ?? a.id ?? a.index ?? null;
        titleHint = a.title || a.name || "";
        cheatHtml = a.cheatsheet || a.cheat || a.summary || a.content || "";
        qList = a.questions || a.tests || a.quiz || [];
      } else if (arguments.length >= 4) {
        numHint = a;
        titleHint = b;
        cheatHtml = typeof c === "string" ? c : "";
        qList = Array.isArray(d) ? d : (Array.isArray(c) ? c : []);
      } else if (arguments.length === 3) {
        if (typeof a === "number" || /^\d+$/.test(String(a).trim())) {
          numHint = a;
          if (b && typeof b === "object") {
            titleHint = b.title || "";
            cheatHtml = b.cheatsheet || "";
            qList = c || b.questions || [];
          } else {
            titleHint = String(b || "");
            if (Array.isArray(c)) {
              qList = c;
            } else {
              cheatHtml = String(c || "");
            }
          }
        } else {
          titleHint = String(a || "");
          if (typeof b === "string" && Array.isArray(c)) {
            cheatHtml = b;
            qList = c;
          } else if (Array.isArray(b)) {
            qList = b;
            cheatHtml = typeof c === "string" ? c : "";
          }
        }
      } else if (arguments.length === 2) {
        if (typeof a === "number" && b && typeof b === "object") {
          numHint = a;
          titleHint = b.title || "";
          cheatHtml = b.cheatsheet || b.cheat || "";
          qList = b.questions || [];
        } else {
          titleHint = String(a || "");
          if (Array.isArray(b)) qList = b;
          else cheatHtml = String(b || "");
        }
      }

      const target = findTargetChapter(numHint, titleHint);
      if (!target) return;

      if (typeof cheatHtml === "string" && cheatHtml.trim().length > 0) {
        target.cheatsheet = cheatHtml;
      }
      const normalized = normalizeQuestions(qList, target.title);
      if (normalized.length > 0) {
        target.questions = normalized;
      }
    };
  </script>

  <!-- Подключаем все 4 файла базы знаний с автосбросом кэша -->
  <script>
    const dataVer = "v4_" + Math.floor(Date.now() / 60000);
    ["aqeedah_part1.js", "aqeedah_part2.js", "aqeedah_part3a.js", "aqeedah_part3b.js"].forEach(file => {
      document.write('<script src="' + file + '?' + dataVer + '"><\/script>');
    });
  </script>

  <script>
    // Собираем данные, если какие-то файлы записали их в AQEEDAH_DATA или AQEEDAH_CHAPTERS
    (function harvestFallbackData() {
      if (Array.isArray(window.AQEEDAH_CHAPTERS)) {
        window.AQEEDAH_CHAPTERS.forEach(item => window.registerAqeedahChapter(item));
      }
      if (window.AQEEDAH_DATA) {
        if (Array.isArray(window.AQEEDAH_DATA.chapters)) {
          window.AQEEDAH_DATA.chapters.forEach(item => window.registerAqeedahChapter(item));
        }
        if (window.AQEEDAH_DATA.cheatsheets) {
          Object.entries(window.AQEEDAH_DATA.cheatsheets).forEach(([key, html]) => {
            const target = findTargetChapter(null, key);
            if (target && !target.cheatsheet && typeof html === "string") {
              target.cheatsheet = html;
            }
          });
        }
        if (Array.isArray(window.AQEEDAH_DATA.questions)) {
          window.AQEEDAH_DATA.questions.forEach(q => {
            const target = findTargetChapter(q.chapterNum || null, q.chapter || q.topic || "");
            if (target && target.questions.length < 15) {
              const norm = normalizeQuestions([q], target.title);
              if (norm.length) target.questions.push(norm[0]);
            }
          });
        }
      }
    })();

    const STORAGE_KEY = "madrasah_aqeedah_scores_v1";
    let savedScores = {};
    try {
      savedScores = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    } catch (e) {}

    let activeChapterIdx = null;
    let currentQuizQuestions = [];
    let currentQuizTitle = "";
    let currentQuestionIdx = 0;
    let correctCount = 0;
    let returnAfterCheat = "home"; // "home" | "quiz"

    function renderHome() {
      const listEl = document.getElementById("chaptersList");
      listEl.innerHTML = "";

      let totalCheats = 0;
      let totalQuestions = 0;

      CHAPTERS.forEach((ch, idx) => {
        const hasCheat = Boolean(ch.cheatsheet && ch.cheatsheet.trim());
        const qCount = ch.questions.length;
        if (hasCheat) totalCheats++;
        totalQuestions += qCount;

        const best = savedScores[ch.num];
        const badgeHtml = best !== undefined
          ? `<span class="score-badge">Лучший: ${best}/${qCount}</span>`
          : "";

        const card = document.createElement("div");
        card.className = "chapter-card";
        card.innerHTML = `
          <div class="chapter-header">
            <div>
              <div class="chapter-num">Глава ${ch.num}</div>
              <div class="chapter-title">${ch.title}</div>
              <div class="chapter-meta">${qCount} вопросов${hasCheat ? " • Конспект-шпаргалка" : ""}</div>
            </div>
            ${badgeHtml}
          </div>
          <div class="chapter-actions">
            ${hasCheat ? `<button class="btn btn-secondary" onclick="openCheat(${idx}, 'home')">📖 Шпаргалка</button>` : ""}
            <button class="btn btn-primary" onclick="startChapterQuiz(${idx})" ${qCount === 0 ? "disabled style='opacity:0.5'" : ""}>
              Начать тест →
            </button>
          </div>
        `;
        listEl.appendChild(card);
      });

      document.getElementById("courseStats").textContent =
        `10 глав • ${totalCheats} шпаргалок • ${totalQuestions} вопросов`;
    }

    function hideAllViews() {
      ["homeView", "cheatView", "quizView", "resultView"].forEach(id => {
        document.getElementById(id).classList.add("hidden");
      });
    }

    function showHome() {
      hideAllViews();
      renderHome();
      document.getElementById("homeView").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openCheat(idx, source) {
      const ch = CHAPTERS[idx];
      if (!ch || !ch.cheatsheet) return;
      activeChapterIdx = idx;
      returnAfterCheat = source || "home";

      document.getElementById("cheatBody").innerHTML = ch.cheatsheet;
      const startBtn = document.getElementById("cheatStartQuizBtn");
      if (returnAfterCheat === "quiz" || ch.questions.length === 0) {
        startBtn.classList.add("hidden");
      } else {
        startBtn.classList.remove("hidden");
        startBtn.onclick = () => startChapterQuiz(idx);
      }

      hideAllViews();
      document.getElementById("cheatView").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openCheatFromQuiz() {
      if (activeChapterIdx !== null) {
        openCheat(activeChapterIdx, "quiz");
      }
    }

    function closeSubView() {
      if (returnAfterCheat === "quiz") {
        returnAfterCheat = "home";
        hideAllViews();
        document.getElementById("quizView").classList.remove("hidden");
      } else {
        showHome();
      }
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function startChapterQuiz(idx) {
      const ch = CHAPTERS[idx];
      if (!ch || ch.questions.length === 0) return;
      activeChapterIdx = idx;
      currentQuizTitle = `Глава ${ch.num}. ${ch.title}`;
      currentQuizQuestions = shuffle(ch.questions);
      currentQuestionIdx = 0;
      correctCount = 0;
      returnAfterCheat = "home";

      const inQuizCheat = document.getElementById("inQuizCheatBtn");
      if (ch.cheatsheet) inQuizCheat.classList.remove("hidden");
      else inQuizCheat.classList.add("hidden");

      hideAllViews();
      document.getElementById("quizView").classList.remove("hidden");
      renderQuestion();
    }

    function startFinalExam() {
      const all = CHAPTERS.flatMap(ch => ch.questions);
      if (all.length === 0) return;
      activeChapterIdx = null;
      currentQuizTitle = "🎓 Итоговый зачёт по Акыде";
      currentQuizQuestions = shuffle(all).slice(0, 40);
      currentQuestionIdx = 0;
      correctCount = 0;
      returnAfterCheat = "home";

      document.getElementById("inQuizCheatBtn").classList.add("hidden");
      hideAllViews();
      document.getElementById("quizView").classList.remove("hidden");
      renderQuestion();
    }

    function renderQuestion() {
      const total = currentQuizQuestions.length;
      const item = currentQuizQuestions[currentQuestionIdx];

      document.getElementById("quizChapterLabel").textContent = currentQuizTitle;
      document.getElementById("quizCounter").textContent = `${currentQuestionIdx + 1} / ${total}`;
      document.getElementById("quizProgressFill").style.width = `${((currentQuestionIdx) / total) * 100}%`;
      document.getElementById("questionText").textContent = item.q;

      const expBox = document.getElementById("explanationBox");
      expBox.classList.add("hidden");
      expBox.innerHTML = "";

      const nextBtn = document.getElementById("nextQuestionBtn");
      nextBtn.classList.add("hidden");
      nextBtn.textContent = currentQuestionIdx + 1 === total ? "Завершить тест ✓" : "Далее →";

      const optsEl = document.getElementById("optionsList");
      optsEl.innerHTML = "";

      item.options.forEach((optText, i) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = optText;
        btn.onclick = () => selectAnswer(i);
        optsEl.appendChild(btn);
      });
    }

    function selectAnswer(chosenIdx) {
      const item = currentQuizQuestions[currentQuestionIdx];
      const buttons = document.querySelectorAll("#optionsList .option-btn");
      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === item.answer) btn.classList.add("correct");
        else if (idx === chosenIdx) btn.classList.add("wrong");
      });

      if (chosenIdx === item.answer) {
        correctCount++;
      }

      if (item.explanation) {
        const expBox = document.getElementById("explanationBox");
        expBox.innerHTML = `<strong>Пояснение:</strong> ${item.explanation}`;
        expBox.classList.remove("hidden");
      }

      document.getElementById("quizProgressFill").style.width =
        `${((currentQuestionIdx + 1) / currentQuizQuestions.length) * 100}%`;
      document.getElementById("nextQuestionBtn").classList.remove("hidden");
    }

    function nextQuestion() {
      if (currentQuestionIdx + 1 < currentQuizQuestions.length) {
        currentQuestionIdx++;
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      const total = currentQuizQuestions.length;
      const pct = Math.round((correctCount / total) * 100);

      if (activeChapterIdx !== null) {
        const chNum = CHAPTERS[activeChapterIdx].num;
        if (savedScores[chNum] === undefined || correctCount > savedScores[chNum]) {
          savedScores[chNum] = correctCount;
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(savedScores));
          } catch (e) {}
        }
      }

      document.getElementById("resultEmoji").textContent = pct >= 80 ? "🏆" : (pct >= 60 ? "📘" : "📖");
      document.getElementById("resultTitle").textContent =
        pct >= 80 ? "Ма шаа Аллах! Отличный результат" : (pct >= 60 ? "Хороший результат" : "Стоит повторить шпаргалку");
      document.getElementById("resultSummary").textContent =
        `Правильных ответов: ${correctCount} из ${total} (${pct}%)`;

      const retryBtn = document.getElementById("retryQuizBtn");
      retryBtn.onclick = () => {
        if (activeChapterIdx !== null) startChapterQuiz(activeChapterIdx);
        else startFinalExam();
      };

      hideAllViews();
      document.getElementById("resultView").classList.remove("hidden");
    }

    // Инициализация главного экрана
    renderHome();
  </script>
</body>
</html>
