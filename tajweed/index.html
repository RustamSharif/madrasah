<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таджвид — Правила чтения Священного Корана</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        document.write('<script src="../auth.js?v=' + Date.now() + '"><\/script>');
    </script>
    <script>
        if (typeof protectCoursePage === "function") {
            protectCoursePage("tajweed", "Таджвид (Правила чтения Корана)");
        }
    </script>
    <style>
        :root {
            --primary: #1b5e20;
            --primary-dark: #124116;
            --primary-light: #e4ede5;
            --accent: #b89535;
            --bg-base: #b5b8b4;
            --card-bg: #d4d6d2;
            --item-bg: #e2e4e0;
            --text: #1a1d1a;
            --muted: #4a4f4a;
            --border: #9ea39d;
        }
        body.dark-theme {
            --bg-base: #141815;
            --card-bg: #1e2420;
            --item-bg: #272f29;
            --text: #e8ece9;
            --muted: #a3b0a6;
            --border: #3a453d;
            --primary-light: #1e3322;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 17px;
            line-height: 1.55;
            color: var(--text);
            margin: 0;
            padding: 18px 14px;
            background-color: var(--bg-base);
            transition: background-color 0.2s, color 0.2s;
        }
        .container { max-width: 820px; margin: 0 auto; }
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            gap: 10px;
        }
        .nav-btn {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .nav-btn:hover { border-color: var(--primary); }
        .header {
            background: linear-gradient(135deg, #124116, #1b5e20);
            color: #f4f6f4;
            padding: 24px 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16);
            border-bottom: 5px solid var(--accent);
        }
        .header h1 { margin: 0 0 8px 0; font-size: 1.6rem; line-height: 1.3; }
        .header p { margin: 0; font-size: 1rem; opacity: 0.92; }
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }
        .stat-pill {
            background: rgba(255, 255, 255, 0.14);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.22);
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.09);
            border: 1px solid var(--border);
            margin-bottom: 18px;
        }
        .chapter-list { display: flex; flex-direction: column; gap: 12px; }
        .chapter-row {
            background: var(--item-bg);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .chapter-info { flex: 1; min-width: 220px; }
        .chapter-num {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 2px 9px;
            border-radius: 7px;
            margin-bottom: 5px;
        }
        .chapter-score-badge {
            display: inline-block;
            background: rgba(27, 94, 32, 0.15);
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 2px 9px;
            border-radius: 7px;
            margin-left: 6px;
        }
        body.dark-theme .chapter-score-badge { color: #81c784; }
        .chapter-title { font-size: 1.08rem; font-weight: 700; margin: 0; }
        .chapter-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn {
            padding: 9px 14px;
            border-radius: 10px;
            border: none;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.1s, opacity 0.15s;
        }
        .btn:active { transform: translateY(1px); }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-cheat { background: #5c4b18; color: #fff; }
        .btn-cheat:hover { opacity: 0.9; }
        .btn-final {
            width: 100%;
            justify-content: center;
            padding: 15px;
            font-size: 1.05rem;
            background: #8c2323;
            color: #fff;
            margin-top: 8px;
        }
        .ar {
            font-family: "Traditional Arabic", "Amiri", "Scheherazade New", "Noto Naskh Arabic", serif;
            font-size: 1.45em;
            direction: rtl;
            unicode-bidi: isolate;
            padding: 0 4px;
            color: var(--primary-dark);
            font-weight: 700;
        }
        body.dark-theme .ar { color: #a5d6a7; }
        .quiz-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .progress-text { font-weight: 700; font-size: 0.95rem; color: var(--primary); }
        body.dark-theme .progress-text { color: #81c784; }
        .topic-badge {
            display: inline-block;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 6px;
        }
        .question-text { font-size: 1.15rem; font-weight: 700; margin-bottom: 18px; line-height: 1.55; }
        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .option-btn {
            padding: 13px 15px;
            font-size: 1rem;
            text-align: left;
            background: var(--item-bg);
            color: var(--text);
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            line-height: 1.45;
        }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); }
        .option-btn:disabled { cursor: default; }
        .option-btn.correct { background: #d4edda; border-color: #28a745; color: #155724; font-weight: 600; }
        .option-btn.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .explanation-box {
            display: none;
            margin-top: 18px;
            padding: 15px;
            background: var(--primary-light);
            border-left: 5px solid var(--primary);
            border-radius: 8px;
            font-size: 0.98rem;
            line-height: 1.6;
        }
        .source-tag { display: block; font-size: 0.85rem; color: var(--muted); margin-top: 8px; font-style: italic; }
        .quiz-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 10px; }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 1000;
            padding: 16px;
            overflow-y: auto;
            align-items: flex-start;
            justify-content: center;
        }
        .modal-card {
            background: var(--card-bg);
            color: var(--text);
            max-width: 720px;
            width: 100%;
            border-radius: 16px;
            padding: 22px;
            margin: 20px auto;
            border: 2px solid var(--accent);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 14px;
            gap: 10px;
        }
        .modal-body h3 { margin-top: 0; color: var(--primary); font-size: 1.15rem; }
        body.dark-theme .modal-body h3 { color: #81c784; }
        .modal-body ul, .modal-body ol { padding-left: 20px; }
        .modal-body li { margin-bottom: 9px; line-height: 1.6; }
        .result-box { text-align: center; padding: 10px 0; }
        .result-percent { font-size: 2.4rem; font-weight: 800; color: var(--primary); margin: 10px 0; }
        body.dark-theme .result-percent { color: #81c784; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <a href="../index.html" id="back-catalog-btn" class="nav-btn">← Все курсы</a>
        <button class="nav-btn" onclick="toggleTheme()" id="theme-btn">🌙 Тёмная тема</button>
    </div>

    <div class="header">
        <h1>Таджвид</h1>
        <p>Правила чтения Священного Корана (риуаят Хафс ан Асым)</p>
        <div class="stats-bar">
            <span class="stat-pill">📚 10 глав</span>
            <span class="stat-pill" id="total-q-pill">📝 150 вопросов</span>
            <span class="stat-pill">📖 10 шпаргалок</span>
        </div>
    </div>

    <!-- Главное меню глав -->
    <div id="menu-screen" class="card">
        <div class="chapter-list" id="chapter-list"></div>
        <button class="btn btn-final" onclick="startFinalExam()">🎓 Итоговый зачёт (40 случайных вопросов по всему курсу)</button>
    </div>

    <!-- Экран прохождения теста -->
    <div id="quiz-screen" class="card" style="display: none;">
        <div class="quiz-top">
            <span class="progress-text" id="progress-text">Вопрос 1 из 15</span>
            <div style="display:flex; gap:8px;">
                <button class="btn btn-cheat" id="in-quiz-cheat-btn" onclick="openCurrentCheat()">📖 Шпаргалка</button>
                <button class="nav-btn" onclick="returnToMenu()">✕ В меню</button>
            </div>
        </div>
        <div class="topic-badge" id="q-topic"></div>
        <div class="question-text" id="q-text"></div>
        <div class="options-list" id="q-options"></div>
        <div class="explanation-box" id="q-explanation">
            <div id="q-exp-text"></div>
            <span class="source-tag" id="q-source"></span>
        </div>
        <div class="quiz-footer">
            <span style="font-weight:600; font-size:0.95rem;" id="score-live">Правильно: 0</span>
            <button class="btn btn-primary" id="next-btn" style="display:none;" onclick="nextQuestion()">Следующий вопрос →</button>
        </div>
    </div>

    <!-- Экран результатов -->
    <div id="result-screen" class="card" style="display: none;">
        <div class="result-box">
            <h2 id="res-title">Тест завершён!</h2>
            <div class="result-percent" id="res-percent">0%</div>
            <p id="res-details" style="font-size:1.1rem; font-weight:600;"></p>
            <p id="res-msg" style="color:var(--muted); margin-bottom:20px;"></p>
            <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
                <button class="btn btn-primary" onclick="restartCurrentQuiz()">🔄 Пройти ещё раз</button>
                <button class="nav-btn" onclick="returnToMenu()">← К списку глав</button>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно шпаргалки -->
<div class="modal-overlay" id="cheat-modal" onclick="if(event.target===this) closeCheat()">
    <div class="modal-card">
        <div class="modal-header">
            <strong style="font-size:1.05rem;">📖 Конспект-шпаргалка</strong>
            <button class="nav-btn" onclick="closeCheat()">Закрыть ✕</button>
        </div>
        <div class="modal-body" id="cheat-body"></div>
    </div>
</div>

<script>
    window.TAJWEED_DATA = { cheatsheets: {}, questions: [] };
</script>
<script src="tajweed_part1.js"></script>
<script src="tajweed_part2.js"></script>
<script src="tajweed_part3a.js"></script>
<script src="tajweed_part3b.js"></script>
<script src="tajweed_part3c.js"></script>

<script>
    const CHAPTERS = [
        { id: "Введение", title: "1. Введение в таджвид, Истиаза и Басмаля" },
        { id: "Махрадж 1", title: "2. Махрадж (часть 1): Аль-Джауф, Аль-Хальк и корень языка" },
        { id: "Махрадж 2", title: "3. Махрадж (часть 2): Язык, губы и Аль-Хайшум" },
        { id: "Сыфаты", title: "4. Сыфаты (качества арабских букв)" },
        { id: "Нун сакина", title: "5. Правила Нун сакина и Танвина (Изхар, Идгам, Икляб, Ихфа)" },
        { id: "Мим сакина", title: "6. Правила Мим сакина и удвоенных Нун и Мим (Гунна)" },
        { id: "Мадд", title: "7. Правила Мадд (естественное и производные удлинения)" },
        { id: "Тафхим и Таркик", title: "8. Твёрдость и мягкость (правила букв Ра, Лям и Алиф)" },
        { id: "Виды Идгама", title: "9. Виды Идгама и Лям аль-Та'риф (Шамсия и Камария)" },
        { id: "Уакф и Хамза", title: "10. Правила остановки (Уакф), знаки в мусхафе и Хамзатуль-уасль" }
    ];

    let currentChapter = null;
    let isFinalExam = false;
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;

    function initApp() {
        const params = new URLSearchParams(window.location.search);
        if (params.get("id")) {
            document.getElementById("back-catalog-btn").href = "../index.html?id=" + encodeURIComponent(params.get("id"));
        }
        if (localStorage.getItem("tajweed_dark") === "1") {
            document.body.classList.add("dark-theme");
            document.getElementById("theme-btn").textContent = "☀️ Светлая тема";
        }
        const totalQ = (window.TAJWEED_DATA && window.TAJWEED_DATA.questions) ? window.TAJWEED_DATA.questions.length : 0;
        if (totalQ > 0) {
            document.getElementById("total-q-pill").textContent = `📝 ${totalQ} вопросов`;
        }
        renderMenu();
    }

    function toggleTheme() {
        document.body.classList.toggle("dark-theme");
        const isDark = document.body.classList.contains("dark-theme");
        localStorage.setItem("tajweed_dark", isDark ? "1" : "0");
        document.getElementById("theme-btn").textContent = isDark ? "☀️ Светлая тема" : "🌙 Тёмная тема";
    }

    function getSavedProgress() {
        try {
            return JSON.parse(localStorage.getItem("tajweed_progress") || "{}");
        } catch (e) { return {}; }
    }

    function saveChapterProgress(chapterId, pct) {
        const prog = getSavedProgress();
        if (!prog[chapterId] || pct > prog[chapterId]) {
            prog[chapterId] = pct;
            localStorage.setItem("tajweed_progress", JSON.stringify(prog));
        }
    }

    function renderMenu() {
        const list = document.getElementById("chapter-list");
        const prog = getSavedProgress();
        const allQ = window.TAJWEED_DATA.questions || [];
        const cheats = window.TAJWEED_DATA.cheatsheets || {};

        list.innerHTML = CHAPTERS.map(ch => {
            const count = allQ.filter(q => q.chapter === ch.id).length;
            const hasCheat = Boolean(cheats[ch.id]);
            const bestPct = prog[ch.id];
            return `
                <div class="chapter-row">
                    <div class="chapter-info">
                        <span class="chapter-num">${count} вопр.</span>
                        ${bestPct !== undefined ? `<span class="chapter-score-badge">Лучший: ${bestPct}%</span>` : ""}
                        <div class="chapter-title">${ch.title}</div>
                    </div>
                    <div class="chapter-actions">
                        ${hasCheat ? `<button class="btn btn-cheat" onclick="openCheat('${ch.id}')">📖 Шпаргалка</button>` : ""}
                        <button class="btn btn-primary" onclick="startQuiz('${ch.id}')">Тест →</button>
                    </div>
                </div>
            `;
        }).join("");
    }

    function openCheat(chapterId) {
        const html = (window.TAJWEED_DATA.cheatsheets && window.TAJWEED_DATA.cheatsheets[chapterId]) || "<p>Конспект для этой главы готовится.</p>";
        document.getElementById("cheat-body").innerHTML = html;
        document.getElementById("cheat-modal").style.display = "flex";
    }

    function openCurrentCheat() {
        if (currentChapter) openCheat(currentChapter);
    }

    function closeCheat() {
        document.getElementById("cheat-modal").style.display = "none";
    }

    function startQuiz(chapterId) {
        const allQ = window.TAJWEED_DATA.questions || [];
        const filtered = allQ.filter(q => q.chapter === chapterId);
        if (!filtered.length) {
            alert("Вопросы для этой главы пока не загружены.");
            return;
        }
        currentChapter = chapterId;
        isFinalExam = false;
        currentQuestions = [...filtered].sort(() => Math.random() - 0.5);
        currentIndex = 0;
        score = 0;

        document.getElementById("in-quiz-cheat-btn").style.display = window.TAJWEED_DATA.cheatsheets[chapterId] ? "inline-flex" : "none";
        document.getElementById("menu-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "none";
        document.getElementById("quiz-screen").style.display = "block";
        renderQuestion();
    }

    function startFinalExam() {
        const allQ = window.TAJWEED_DATA.questions || [];
        if (!allQ.length) return;
        currentChapter = null;
        isFinalExam = true;
        currentQuestions = [...allQ].sort(() => Math.random() - 0.5).slice(0, 40);
        currentIndex = 0;
        score = 0;

        document.getElementById("in-quiz-cheat-btn").style.display = "none";
        document.getElementById("menu-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "none";
        document.getElementById("quiz-screen").style.display = "block";
        renderQuestion();
    }

    function restartCurrentQuiz() {
        if (isFinalExam) startFinalExam();
        else if (currentChapter) startQuiz(currentChapter);
    }

    function renderQuestion() {
        const q = currentQuestions[currentIndex];
        document.getElementById("progress-text").textContent = `Вопрос ${currentIndex + 1} из ${currentQuestions.length}`;
        document.getElementById("score-live").textContent = `Правильно: ${score}`;
        document.getElementById("q-topic").textContent = isFinalExam ? `${q.chapter} • ${q.topic}` : q.topic;
        document.getElementById("q-text").innerHTML = q.question;

        const expBox = document.getElementById("q-explanation");
        expBox.style.display = "none";
        document.getElementById("next-btn").style.display = "none";

        const optsEl = document.getElementById("q-options");
        optsEl.innerHTML = "";
        q.options.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerHTML = opt;
            btn.onclick = () => selectAnswer(idx, btn);
            optsEl.appendChild(btn);
        });
    }

    function selectAnswer(idx, btn) {
        const q = currentQuestions[currentIndex];
        const allBtns = document.querySelectorAll("#q-options .option-btn");
        allBtns.forEach(b => b.disabled = true);

        if (idx === q.correct) {
            btn.classList.add("correct");
            score++;
        } else {
            btn.classList.add("wrong");
            if (allBtns[q.correct]) allBtns[q.correct].classList.add("correct");
        }

        document.getElementById("score-live").textContent = `Правильно: ${score}`;
        document.getElementById("q-exp-text").innerHTML = q.explanation;
        document.getElementById("q-source").textContent = "Раздел: " + q.source;
        document.getElementById("q-explanation").style.display = "block";

        const nextBtn = document.getElementById("next-btn");
        nextBtn.style.display = "inline-flex";
        nextBtn.textContent = (currentIndex === currentQuestions.length - 1) ? "Завершить тест 🏁" : "Следующий вопрос →";
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            renderQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "block";

        const pct = Math.round((score / currentQuestions.length) * 100);
        if (!isFinalExam && currentChapter) {
            saveChapterProgress(currentChapter, pct);
        } else if (isFinalExam) {
            saveChapterProgress("FINAL_EXAM", pct);
        }

        document.getElementById("res-title").textContent = isFinalExam ? "Итоговый зачёт завершён!" : "Глава пройдена!";
        document.getElementById("res-percent").textContent = pct + "%";
        document.getElementById("res-details").textContent = `Правильных ответов: ${score} из ${currentQuestions.length}`;

        let msg = "Рекомендуем открыть конспект-шпаргалку по этой теме и пройти тест повторно.";
        if (pct === 100) msg = "МашаАллах! Безупречный результат, правила усвоены полностью.";
        else if (pct >= 80) msg = "Отличный результат! Вы уверенно знаете правила таджвида по этой теме.";
        else if (pct >= 60) msg = "Хороший результат, но стоит повторить отдельные исключения и примеры в шпаргалке.";
        document.getElementById("res-msg").textContent = msg;
    }

    function returnToMenu() {
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "none";
        document.getElementById("menu-screen").style.display = "block";
        renderMenu();
    }

    window.addEventListener("DOMContentLoaded", initApp);
</script>
</body>
</html>
