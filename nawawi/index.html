<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>40 хадисов Ан-Науауи</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="../style.css">
  <script src="../auth.js"></script>
  <script>
    if (typeof protectCoursePage === "function") {
      protectCoursePage("nawawi", "40 хадисов Ан-Науауи");
    }
  </script>
  <style>
    :root {
      --arabic-size: 28px;
    }

    body {
      padding: 14px 14px 36px;
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 10px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      background: #E5ECE6;
      color: #1A281F;
      border: 1px solid #8FA695;
      border-radius: 20px;
      font-weight: 600;
      font-size: 13.5px;
      text-decoration: none;
      cursor: pointer;
    }

    .back-btn:hover {
      background: #D5E2D7;
    }

    .progress-pill {
      background: #E5ECE6;
      color: #1F523F;
      border: 1px solid #8FA695;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }

    .course-hero {
      background: linear-gradient(145deg, #1F523F 0%, #183E30 100%);
      color: #F4F7F4;
      border: 1px solid #48735E;
      border-radius: 16px;
      padding: 20px 18px;
      text-align: center;
      margin-bottom: 18px;
      box-shadow: 0 6px 18px rgba(14, 22, 17, 0.22);
    }

    .course-hero h1 {
      margin: 0 0 6px;
      font-size: 1.45rem;
      color: #FFFFFF;
    }

    .course-hero p {
      margin: 0 0 12px;
      font-size: 0.94rem;
      color: #D2E2D8;
    }

    .hero-controls {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hero-ctrl-btn {
      background: rgba(255, 255, 255, 0.14);
      color: #F4F7F4;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .hero-ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.24);
    }

    .layout-grid {
      display: grid;
      grid-template-columns: 290px 1fr;
      gap: 16px;
      align-items: start;
    }

    @media (max-width: 820px) {
      .layout-grid {
        grid-template-columns: 1fr;
      }
    }

    .panel-card {
      background: #E5ECE6;
      border: 1px solid #8FA695;
      border-radius: 16px;
      padding: 16px;
      color: #1A281F;
      box-shadow: 0 4px 12px rgba(14, 22, 17, 0.14);
    }

    .sidebar-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #1F523F;
      margin: 0 0 10px;
    }

    .chapter-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }

    .chapter-btn {
      background: #DCE5DD;
      border: 1px solid #9BB0A0;
      color: #1A281F;
      border-radius: 10px;
      padding: 8px 6px;
      font-size: 12.5px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .chapter-btn.active {
      background: #1F523F;
      border-color: #1F523F;
      color: #F4F7F4;
    }

    .chapter-btn small {
      font-size: 11px;
      opacity: 0.85;
    }

    .hadith-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 55vh;
      overflow-y: auto;
    }

    .hadith-item {
      padding: 9px 11px;
      border-radius: 10px;
      background: #DCE5DD;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      color: #1A281F;
    }

    .hadith-item:hover {
      border-color: #6B9474;
    }

    .hadith-item.selected {
      background: #CFE0D3;
      border-color: #1F523F;
      font-weight: 700;
      color: #14382B;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #A7B8AC;
      flex-shrink: 0;
    }

    .status-dot.learning { background: #B8862D; }
    .status-dot.learned { background: #2E7D44; }

    .hadith-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid #B7C7BB;
      margin-bottom: 14px;
    }

    .hadith-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #163326;
      margin: 0 0 4px;
    }

    .hadith-meta {
      font-size: 0.85rem;
      color: #465C4E;
    }

    .status-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .status-btn {
      background: #DCE5DD;
      border: 1px solid #9BB0A0;
      color: #1A281F;
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .status-btn.active {
      background: #1F523F;
      border-color: #1F523F;
      color: #FFFFFF;
    }

    .status-btn.learning.active {
      background: #9A6E22;
      border-color: #9A6E22;
    }

    .audio-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      background: #DCE5DD;
      border: 1px solid #9BB0A0;
      border-radius: 12px;
    }

    .bar-label {
      font-size: 13px;
      font-weight: 700;
      color: #1F523F;
    }

    .audio-bar audio {
      height: 36px;
      flex: 1;
      min-width: 190px;
      color-scheme: light;
      background: #F4F7F5;
      border-radius: 8px;
    }

    .ctrl-chip {
      background: #EEF3EF;
      border: 1px solid #9BB0A0;
      color: #1A281F;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .ctrl-chip.active {
      background: #1F523F;
      border-color: #1F523F;
      color: #FFFFFF;
    }

    .audio-status {
      width: 100%;
      font-size: 12.5px;
      color: #1A281F;
      display: none;
      margin-top: 4px;
      padding: 8px 10px;
      background: #CFE0D3;
      border: 1px solid #8FA695;
      border-radius: 8px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
      padding: 10px 12px;
      background: #DCE5DD;
      border: 1px solid #9BB0A0;
      border-radius: 12px;
      align-items: center;
    }

    .arabic-box {
      direction: rtl;
      text-align: right;
      font-family: "Traditional Arabic", "Scheherazade New", "Amiri", serif;
      font-size: var(--arabic-size);
      line-height: 2.15;
      padding: 18px;
      background: #F2F6F3;
      border: 1px solid #9BB0A0;
      border-radius: 12px;
      margin-bottom: 16px;
      color: #122118;
      user-select: none;
    }

    .word-token {
      display: inline-block;
      margin: 0 3px;
      padding: 0 5px;
      border-radius: 6px;
      transition: background-color 0.15s ease;
    }

    .word-token.masked {
      background-color: #B6C7BA;
      color: transparent;
      cursor: pointer;
    }

    .word-token.speaking {
      background-color: #C3E0C9;
      color: #0E3321;
      box-shadow: 0 0 0 1.5px #1F523F;
    }

    .word-token.masked.speaking {
      background-color: #8FC49E;
      color: transparent;
    }

    .section-block {
      margin-bottom: 16px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      gap: 8px;
    }

    .section-title {
      font-size: 12.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #1F523F;
    }

    .transcription-text {
      font-style: italic;
      color: #384C3F;
      background: #EEF3EF;
      border: 1px solid #9BB0A0;
      padding: 13px;
      border-radius: 10px;
      font-size: 0.94rem;
    }

    .translation-text {
      font-size: 1rem;
      line-height: 1.65;
      color: #1A281F;
      background: #EEF3EF;
      border: 1px solid #9BB0A0;
      padding: 14px;
      border-radius: 10px;
    }

    .hidden-content {
      filter: blur(6px);
      cursor: pointer;
      user-select: none;
    }

    .footer-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-top: 14px;
      border-top: 1px solid #B7C7BB;
    }

    .tasbih-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-primary-green {
      background: #1F523F;
      color: #FFFFFF;
      border: none;
      padding: 9px 16px;
      font-size: 13.5px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
    }

    .btn-primary-green:hover {
      background: #173E30;
    }

    .count-badge {
      font-size: 1.2rem;
      font-weight: 800;
      color: #1F523F;
      min-width: 30px;
      text-align: center;
    }

    .nav-pair {
      display: flex;
      gap: 8px;
    }

    .notice-box {
      padding: 14px;
      background: #E8DDD7;
      border: 1px solid #B39B90;
      color: #4A2B20;
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 0.92rem;
    }

    @media print {
      body { background: #ffffff !important; color: #000000 !important; }
      .top-nav, .course-hero, .sidebar, .audio-bar, .toolbar, .footer-actions, .status-buttons, .section-header button { display: none !important; }
      .layout-grid { display: block; }
      .panel-card { border: 1.5px solid #333; background: #fff !important; box-shadow: none; }
      .arabic-box, .transcription-text, .translation-text { border: 1px solid #999; background: #fff !important; color: #000 !important; filter: none !important; }
      .word-token.masked { background: transparent !important; color: #000 !important; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top-nav">
    <a href="../index.html" id="backToCatalog" class="back-btn">Назад</a>
    <span class="progress-pill" id="progressSummary">Выучено: 0 из 42</span>
  </div>

  <div class="course-hero">
    <h1>40 хадисов Ан-Науауи</h1>
    <p>Аудиочтение, пословное скрытие для заучивания, транскрипция и смысловой перевод</p>
    <div class="hero-controls">
      <button class="hero-ctrl-btn" onclick="changeFontSize(-2)" title="Уменьшить арабский шрифт">А−</button>
      <button class="hero-ctrl-btn" onclick="changeFontSize(2)" title="Увеличить арабский шрифт">А+</button>
      <button class="hero-ctrl-btn" onclick="window.print()" title="Распечатать текущий хадис">🖨️ Карточка</button>
    </div>
  </div>

  <div class="layout-grid">
    <aside class="panel-card">
      <h2 class="sidebar-title">Главы (по 10 хадисов)</h2>
      <div class="chapter-tabs" id="chapterTabs"></div>
      <ul class="hadith-list" id="hadithList"></ul>
    </aside>

    <main class="panel-card">
      <div id="missingDataWarning" class="notice-box" style="display:none;"></div>

      <div class="hadith-header">
        <div>
          <h2 class="hadith-title" id="hadithTitle">Загрузка...</h2>
          <div class="hadith-meta" id="hadithMeta"></div>
        </div>
        <div class="status-buttons">
          <button class="status-btn" data-status="none" onclick="setStatus('none')">Не начат</button>
          <button class="status-btn learning" data-status="learning" onclick="setStatus('learning')">Учу</button>
          <button class="status-btn learned" data-status="learned" onclick="setStatus('learned')">Выучен ✓</button>
        </div>
      </div>

      <div class="audio-bar">
        <span class="bar-label">🎧 Чтец:</span>
        <audio id="hadithAudio" controls preload="none"></audio>
        <button class="ctrl-chip speed-btn" data-rate="0.75" onclick="setPlaybackRate(0.75)">0.75x</button>
        <button class="ctrl-chip speed-btn active" data-rate="1" onclick="setPlaybackRate(1)">1x</button>
        <button class="ctrl-chip speed-btn" data-rate="1.25" onclick="setPlaybackRate(1.25)">1.25x</button>
        <button class="ctrl-chip" id="loopBtn" onclick="toggleLoop()">🔁 Повтор</button>
        <button class="ctrl-chip" id="ttsBtn" onclick="speakArabic()">🗣️ Диктор</button>
        <button class="ctrl-chip" onclick="stopSpeech()">⏹️</button>
        <div class="audio-status" id="audioStatus"></div>
      </div>

      <div class="toolbar">
        <span class="bar-label">Скрыть слова (араб.):</span>
        <button class="ctrl-chip mask-btn active" data-level="0" onclick="setMaskLevel(0)">Показать всё</button>
        <button class="ctrl-chip mask-btn" data-level="0.3" onclick="setMaskLevel(0.3)">Скрыть 30%</button>
        <button class="ctrl-chip mask-btn" data-level="0.6" onclick="setMaskLevel(0.6)">Скрыть 60%</button>
        <button class="ctrl-chip mask-btn" data-level="1" onclick="setMaskLevel(1)">Скрыть 100%</button>
      </div>

      <div class="arabic-box" id="arabicText"></div>

      <div class="section-block">
        <div class="section-header">
          <span class="section-title">Транскрипция (для правильного чтения)</span>
          <button class="ctrl-chip" onclick="toggleBlur('transcriptionText')">Показать / Скрыть</button>
        </div>
        <div class="transcription-text" id="transcriptionText" onclick="unblur('transcriptionText')"></div>
      </div>

      <div class="section-block">
        <div class="section-header">
          <span class="section-title">Смысловой перевод</span>
          <button class="ctrl-chip" onclick="toggleBlur('translationText')">Показать / Скрыть</button>
        </div>
        <div class="translation-text" id="translationText" onclick="unblur('translationText')"></div>
      </div>

      <div class="footer-actions">
        <div class="tasbih-box">
          <button class="btn-primary-green" onclick="incrementCount()">+1 Прочитал вслух</button>
          <span class="count-badge" id="repeatCount">0</span>
          <button class="ctrl-chip" onclick="resetCount()" title="Сбросить счётчик">↺</button>
        </div>
        <div class="nav-pair">
          <button class="ctrl-chip" onclick="prevHadith()">Предыдущий</button>
          <button class="ctrl-chip" onclick="nextHadith()">Следующий</button>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="chapter1.js"></script>
<script src="chapter2.js"></script>
<script src="chapter3.js"></script>
<script src="chapter4.js"></script>

    35: "35. Hadith 35 - Brotherhood - أُخُوَّةُ الإسلام , وحقوقُ المسلِ - Muslim #2564.mp3",
    36: "36. Hadith 36 - Easing & Screening A Muslim & Virtues Of Knowledge - قضاء حوائج المسلمين, وفضل طلب العلم - Muslim #2699.mp3",
    37: "37. Hadith 37 - Recording Of Hasanat & Sayyiat - عظيم لطف الله تعالى بعباده, وفضله عليهم - Al-Bukhari #6491 - Muslim #131.mp3",
    38: "38. Hadith 38 - The Friend Of Allah & Only Tawwasul - محبَّة الله تعالى لأوليائِه, وبَيانُ طريقِ الولاية - Al-Bukhari #6502.mp3",
    39: "39. Hadith 39 - Mistakes, Forgetfulness & Coercion - رفع الحرج في الإسلام - Ibn Majah #2036 - Al-Bayhaqi #11454.mp3",
    40: "40. Hadith 40 - Be In The Dunya (World) As A Stranger - اغتنام الأوقات قبل الوفاة - Al-Bukhari #6416.mp3",
    41: "41. Hadith 41 - Believer If One's Desire Is In Accordance With The Sharee'ah - اتباع النبي ﷺ - Al-Hujjah Of Al-Maqdisi 2-393.mp3",
    42: "42. Hadith 42 - O Son Of Adam If Your Sins Reached The Clouds - مغفرة الله - At-Tirmidhi #3540 - At-Tabarani, Al-Awsat #4305.mp3"
  };

  const chapters = [
    { id: 1, label: "Глава 1", range: "1–10", min: 1, max: 10 },
    { id: 2, label: "Глава 2", range: "11–20", min: 11, max: 20 },
    { id: 3, label: "Глава 3", range: "21–30", min: 21, max: 30 },
    { id: 4, label: "Глава 4", range: "31–42", min: 31, max: 42 }
  ];

  let currentChapter = 1;
  let currentIndex = 0;
  let maskLevel = 0;
  let arabicFontSize = 28;
  let playbackRate = 1.0;
  let isLooping = false;
  let isSpeakingLoop = false;
  let audioTimeout = null;
  let wordMap = [];
  let activeWordIdx = -1;
  let progress = JSON.parse(localStorage.getItem('nawawi_progress')) || {};

  function isMobileDevice() {
    return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent || "");
  }

  function showPcOnlyTtsNotice() {
    const status = document.getElementById('audioStatus');
    status.style.display = 'block';
    status.textContent = 'ℹ️ Функция «Диктор» (синтезатор речи с пословной подсветкой) работает только на ПК. На телефоне используйте основной аудиоплеер «🎧 Чтец» выше.';
  }

  function init() {
    const uid = typeof getCurrentUserId === 'function' ? getCurrentUserId() : '';
    const backBtn = document.getElementById('backToCatalog');
    if (backBtn && uid) {
      backBtn.href = `../index.html?uid=${encodeURIComponent(uid)}`;
    }

    if (hadiths.length === 0) {
      const warn = document.getElementById('missingDataWarning');
      warn.style.display = 'block';
      warn.textContent = 'Файлы глав (chapter1.js ... chapter4.js) пока не найдены в этой папке. Положите их рядом с index.html и обновите страницу.';
      return;
    }
    renderChapterTabs();
    renderSidebar();
    loadHadith(0);
    updateSummary();
  }

  function saveProgress() {
    localStorage.setItem('nawawi_progress', JSON.stringify(progress));
    updateSummary();
    renderChapterTabs();
    renderSidebar();
  }

  function getHadithState(id) {
    if (!progress[id]) {
      progress[id] = { status: 'none', count: 0 };
    }
    return progress[id];
  }

  function renderChapterTabs() {
    const container = document.getElementById('chapterTabs');
    container.innerHTML = '';
    chapters.forEach(ch => {
      const chItems = hadiths.filter(h => h.id >= ch.min && h.id <= ch.max);
      const learnedInCh = chItems.filter(h => getHadithState(h.id).status === 'learned').length;
      const btn = document.createElement('button');
      btn.className = `chapter-btn ${currentChapter === ch.id ? 'active' : ''}`;
      btn.innerHTML = `<strong>${ch.label} (${ch.range})</strong><small>Выучено: ${learnedInCh}/${chItems.length}</small>`;
      btn.onclick = () => {
        currentChapter = ch.id;
        renderChapterTabs();
        renderSidebar();
        const firstIdx = hadiths.findIndex(h => h.id >= ch.min && h.id <= ch.max);
        if (firstIdx !== -1) loadHadith(firstIdx);
      };
      container.appendChild(btn);
    });
  }

  function renderSidebar() {
    const list = document.getElementById('hadithList');
    list.innerHTML = '';
    const ch = chapters.find(c => c.id === currentChapter);
    hadiths.forEach((h, idx) => {
      if (h.id < ch.min || h.id > ch.max) return;
      const state = getHadithState(h.id);
      const li = document.createElement('li');
      li.className = `hadith-item ${idx === currentIndex ? 'selected' : ''}`;
      li.onclick = () => loadHadith(idx);

      const titleSpan = document.createElement('span');
      titleSpan.textContent = h.title;

      const dot = document.createElement('span');
      dot.className = `status-dot ${state.status}`;

      li.appendChild(titleSpan);
      li.appendChild(dot);
      list.appendChild(li);
    });
  }

  function highlightWord(index) {
    if (activeWordIdx === index) return;
    if (activeWordIdx >= 0 && wordMap[activeWordIdx]) {
      wordMap[activeWordIdx].span.classList.remove('speaking');
    }
    activeWordIdx = index;
    if (index >= 0 && wordMap[index]) {
      wordMap[index].span.classList.add('speaking');
    }
  }

  function clearHighlight() {
    highlightWord(-1);
  }

  function setPlaybackRate(rate) {
    playbackRate = rate;
    const audio = document.getElementById('hadithAudio');
    audio.playbackRate = rate;
    document.querySelectorAll('.speed-btn').forEach(btn => {
      btn.classList.toggle('active', parseFloat(btn.dataset.rate) === rate);
    });

    if (('speechSynthesis' in window && window.speechSynthesis.speaking) || isSpeakingLoop) {
      speakArabic();
    }
  }

  function toggleLoop() {
    isLooping = !isLooping;
    const audio = document.getElementById('hadithAudio');
    audio.loop = isLooping;
    document.getElementById('loopBtn').classList.toggle('active', isLooping);
  }

  function setupAudio(id) {
    stopSpeech();
    if (audioTimeout) clearTimeout(audioTimeout);

    const audio = document.getElementById('hadithAudio');
    const status = document.getElementById('audioStatus');
    const numStr = String(id).padStart(2, '0');
    const studioFile = studioAudioFiles[id];

    const sources = [];
    if (studioFile) {
      sources.push(`https://archive.org/download/40Hadith_Nawawi/${encodeURIComponent(studioFile)}`);
    }
    sources.push(`audio/${numStr}.mp3`);

    let srcIdx = 0;
    status.style.display = 'none';
    status.textContent = '';
    audio.pause();
    audio.loop = isLooping;

    function tryNextSource() {
      if (audioTimeout) clearTimeout(audioTimeout);
      if (srcIdx >= sources.length) {
        status.style.display = 'block';
        status.textContent = 'Онлайн-запись чтеца временно недоступна. Проверьте подключение к интернету.';
        return;
      }
      audio.src = sources[srcIdx];
      audio.playbackRate = playbackRate;
      srcIdx++;
    }

    audio.onloadedmetadata = () => {
      audio.playbackRate = playbackRate;
    };

    audio.onplaying = () => {
      if (audioTimeout) clearTimeout(audioTimeout);
      clearHighlight();
      audio.playbackRate = playbackRate;
      status.style.display = 'none';
    };

    audio.onwaiting = () => {
      if (audioTimeout) clearTimeout(audioTimeout);
      audioTimeout = setTimeout(() => {
        if (audio.readyState < 3) {
          tryNextSource();
          audio.play().catch(() => {});
        }
      }, 6000);
    };

    audio.onerror = () => {
      tryNextSource();
    };

    tryNextSource();
  }

  function getTtsRate() {
    if (playbackRate < 1) return 0.65;
    if (playbackRate > 1) return 1.35;
    return 1.0;
  }

  function findMaleArabicVoice() {
    if (!('speechSynthesis' in window)) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    const arVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('ar'));
    if (arVoices.length === 0) return null;

    const maleKeywords = ['maged', 'tarik', 'naayf', 'hamed', 'ahmad', 'majed', 'fahad', 'male', 'man'];
    const femaleKeywords = ['mariam', 'laila', 'zeina', 'hala', 'fatima', 'salma', 'female', 'sara', 'noura', 'lana'];

    const explicitMale = arVoices.find(v => maleKeywords.some(k => v.name.toLowerCase().includes(k)));
    if (explicitMale) return explicitMale;

    const nonFemale = arVoices.find(v => !femaleKeywords.some(k => v.name.toLowerCase().includes(k)));
    return nonFemale || arVoices[0];
  }

  function speakArabic() {
    const h = hadiths[currentIndex];
    if (!h) return;

    document.getElementById('hadithAudio').pause();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
    clearHighlight();

    const hasNativeTts = ('speechSynthesis' in window) && (typeof SpeechSynthesisUtterance !== 'undefined');
    if (isMobileDevice() || !hasNativeTts) {
      showPcOnlyTtsNotice();
      return;
    }

    document.getElementById('audioStatus').style.display = 'none';
    isSpeakingLoop = true;

    let speechParts = [];
    let cursor = 0;
    wordMap.forEach(item => {
      const spokenWord = item.rawWord.replace(/ﷺ/g, 'صلى الله عليه وسلم');
      item.ttsStart = cursor;
      item.ttsEnd = cursor + spokenWord.length;
      speechParts.push(spokenWord);
      cursor = item.ttsEnd + 1;
    });

    const fullSpeechText = speechParts.join(' ');
    const utter = new SpeechSynthesisUtterance(fullSpeechText);
    const maleVoice = findMaleArabicVoice();
    if (maleVoice) {
      utter.voice = maleVoice;
      utter.lang = maleVoice.lang || 'ar-SA';
    } else {
      utter.lang = 'ar-SA';
    }
    utter.rate = getTtsRate();
    utter.pitch = 0.9;

    utter.onboundary = (event) => {
      if (event.name === 'word' || typeof event.charIndex === 'number') {
        const idx = event.charIndex;
        for (let i = 0; i < wordMap.length; i++) {
          if (idx >= wordMap[i].ttsStart - 1 && idx <= wordMap[i].ttsEnd) {
            highlightWord(i);
            break;
          }
        }
      }
    };

    utter.onend = () => {
      clearHighlight();
      if (isLooping && isSpeakingLoop) {
        setTimeout(() => {
          if (isLooping && isSpeakingLoop) speakArabic();
        }, 700);
      } else {
        isSpeakingLoop = false;
      }
    };

    utter.onerror = () => {
      clearHighlight();
      isSpeakingLoop = false;
      showPcOnlyTtsNotice();
    };

    highlightWord(0);
    window.speechSynthesis.speak(utter);
  }

  function stopSpeech() {
    isSpeakingLoop = false;
    document.getElementById('hadithAudio').pause();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
    clearHighlight();
  }

  function loadHadith(index) {
    if (!hadiths[index]) return;
    currentIndex = index;
    const h = hadiths[index];

    const targetCh = chapters.find(c => h.id >= c.min && h.id <= c.max);
    if (targetCh && targetCh.id !== currentChapter) {
      currentChapter = targetCh.id;
      renderChapterTabs();
    }

    const state = getHadithState(h.id);
    document.getElementById('hadithTitle').textContent = h.title;
    document.getElementById('hadithMeta').textContent = h.source;
    document.getElementById('transcriptionText').textContent = h.transcription;
    document.getElementById('translationText').textContent = h.translation;
    document.getElementById('repeatCount').textContent = state.count;

    document.querySelectorAll('.status-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === state.status);
    });

    setupAudio(h.id);
    renderArabicText(h.arabic);
    renderSidebar();
  }

  function renderArabicText(text) {
    const container = document.getElementById('arabicText');
    container.innerHTML = '';
    wordMap = [];
    activeWordIdx = -1;

    const words = text.split(' ');
    words.forEach((word, idx) => {
      const span = document.createElement('span');
      span.textContent = word;
      span.className = 'word-token';

      if (maskLevel > 0) {
        const hash = ((idx * 17 + 7) % 10) / 10;
        if (maskLevel === 1 || hash < maskLevel) {
          span.classList.add('masked');
          span.onclick = () => span.classList.remove('masked');
        }
      }

      wordMap.push({
        span: span,
        rawWord: word,
        ttsStart: 0,
        ttsEnd: 0
      });

      container.appendChild(span);
    });
  }

  function setMaskLevel(level) {
    maskLevel = level;
    document.querySelectorAll('.mask-btn').forEach(btn => {
      btn.classList.toggle('active', parseFloat(btn.dataset.level) === level);
    });
    if (hadiths[currentIndex]) renderArabicText(hadiths[currentIndex].arabic);
  }

  function incrementCount() {
    const h = hadiths[currentIndex];
    if (!h) return;
    const state = getHadithState(h.id);
    state.count += 1;
    if (state.status === 'none') state.status = 'learning';
    document.getElementById('repeatCount').textContent = state.count;
    saveProgress();
    loadHadith(currentIndex);
  }

  function resetCount() {
    const h = hadiths[currentIndex];
    if (!h) return;
    const state = getHadithState(h.id);
    state.count = 0;
    document.getElementById('repeatCount').textContent = 0;
    saveProgress();
  }

  function setStatus(status) {
    const h = hadiths[currentIndex];
    if (!h) return;
    const state = getHadithState(h.id);
    state.status = status;
    saveProgress();
    loadHadith(currentIndex);
  }

  function updateSummary() {
    const learnedCount = hadiths.filter(h => getHadithState(h.id).status === 'learned').length;
    document.getElementById('progressSummary').textContent = `Выучено: ${learnedCount} из ${hadiths.length}`;
  }

  function toggleBlur(elementId) { document.getElementById(elementId).classList.toggle('hidden-content'); }
  function unblur(elementId) { document.getElementById(elementId).classList.remove('hidden-content'); }
  function prevHadith() { if (currentIndex > 0) loadHadith(currentIndex - 1); }
  function nextHadith() { if (currentIndex < hadiths.length - 1) loadHadith(currentIndex + 1); }

  function changeFontSize(delta) {
    arabicFontSize = Math.min(48, Math.max(20, arabicFontSize + delta));
    document.documentElement.style.setProperty('--arabic-size', arabicFontSize + 'px');
  }

  init();
</script>
</body>
</html>
