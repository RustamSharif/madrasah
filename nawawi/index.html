<html lang="ru">
<head>

    :root {
      --bg-color: #f4efe6;

      --card-bg: #eef5f0;
      --workspace-bg: #e7f2eb;
      --inner-block-bg: #f6faf7;
      --header-bg: #f8f5ee;
      --text-main: #1b2e24;
      --text-muted: #4b6658;
      --primary: #15603e;
      --primary-hover: #0e462d;
      --primary-light: #d2e7db;
      --accent: #b45309;
      --border: #bfd6c7;
      --header-border: #dcd3c1;
      --hidden-word-bg: #b8cfc1;
      --arabic-size: 30px;
    }

    body.dark-theme {
      --bg-color: #111827;
      --bg-pattern: none;
      --card-bg: #1f2937;
      --workspace-bg: #1f2937;
      --inner-block-bg: #111827;
      --header-bg: #1f2937;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #14b8a6;
      --primary-hover: #0d9488;
      --primary-light: #134e4a;
      --accent: #f59e0b;
      --border: #374151;
      --header-border: #374151;
      --hidden-word-bg: #4b5563;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      background-image: var(--bg-pattern);
      background-repeat: repeat;
      color: var(--text-main);
      line-height: 1.6;
      transition: background-color 0.2s, color 0.2s;
    }

    header {
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--header-border);
      padding: 14px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .brand h1 { font-size: 1.15rem; font-weight: 700; color: var(--primary); }

    .back-link {
      text-decoration: none;
      background: var(--primary);
      color: #ffffff;
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .back-link:hover { background: var(--primary-hover); }

    .progress-summary {
      font-size: 0.85rem;
      background: var(--primary-light);
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 600;
      border: 1px solid var(--border);
    }

    .controls-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    button {
      cursor: pointer;
      font-family: inherit;
      border: 1px solid var(--border);
      background: var(--inner-block-bg);
      color: var(--text-main);
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 500;
      transition: all 0.15s;
    }

    button:hover { border-color: var(--primary); background-color: var(--primary-light); }
    button.active { background-color: var(--primary); color: #ffffff; border-color: var(--primary); }

    .container {
      max-width: 1120px;
      margin: 24px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 24px;
    }

    @media (max-width: 820px) {
      .container { grid-template-columns: 1fr; }
    }

    .sidebar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      height: fit-content;
      box-shadow: 0 4px 14px rgba(21, 96, 62, 0.06);
    }

    .sidebar h2 { font-size: 1rem; margin-bottom: 10px; color: var(--primary); font-weight: 700; }

    .chapter-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 14px;
    }

    .chapter-btn {
      padding: 7px 6px;
      font-size: 0.8rem;
      text-align: center;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .chapter-btn small { font-size: 0.72rem; opacity: 0.85; }

    .hadith-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 60vh;
      overflow-y: auto;
    }

    .hadith-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      border: 1px solid transparent;
      background-color: rgba(255, 255, 255, 0.35);
    }

    body.dark-theme .hadith-item { background-color: transparent; }
    .hadith-item:hover { background-color: var(--inner-block-bg); border-color: var(--border); }
    .hadith-item.selected { background-color: var(--primary-light); color: var(--primary); font-weight: 600; border-color: var(--primary); }

    .status-dot { width: 10px; height: 10px; border-radius: 50%; background-color: var(--border); flex-shrink: 0; }
    .status-dot.learning { background-color: var(--accent); }
    .status-dot.learned { background-color: #15803d; }

    .workspace {
      background: var(--workspace-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(21, 96, 62, 0.08);
    }

    .hadith-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .hadith-title { font-size: 1.35rem; font-weight: 700; color: var(--text-main); }
    .hadith-meta { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

    .audio-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      margin-bottom: 14px;
      background-color: var(--inner-block-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .audio-bar audio {
      height: 34px;
      flex: 1;
      min-width: 190px;
    }

    .speed-group {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .speed-btn {
      padding: 5px 8px;
      font-size: 0.8rem;
    }

    .audio-status {
      width: 100%;
      font-size: 0.82rem;
      color: var(--accent);
      display: none;
      margin-top: 4px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
      padding: 12px;
      background-color: var(--inner-block-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      align-items: center;
    }

    .toolbar-label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-right: 4px; }

    .arabic-box {
      direction: rtl;
      text-align: right;
      font-family: "Traditional Arabic", "Scheherazade", "Amiri", "Geeza Pro", "Arabic Typesetting", serif;
      font-size: var(--arabic-size);
      line-height: 2.1;
      padding: 22px;
      background-color: var(--inner-block-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 20px;
      user-select: none;
    }

    .word-token {
      display: inline-block;
      margin: 0 3px;
      padding: 0 5px;
      border-radius: 6px;
      transition: background-color 0.14s ease, color 0.14s ease, box-shadow 0.14s ease;
    }

    .word-token.masked { background-color: var(--hidden-word-bg); color: transparent; cursor: pointer; }
    .word-token.masked:hover { opacity: 0.8; }

    /* Мягкая изумрудная подсветка только при чтении встроенным диктором */
    .word-token.speaking {
      background-color: #bce3cc;
      color: #0d3b24;
      box-shadow: 0 0 0 1.5px #15603e;
    }

    body.dark-theme .word-token.speaking {
      background-color: #115e59;
      color: #ecfdf5;
      box-shadow: 0 0 0 1.5px #2dd4bf;
    }

    .word-token.masked.speaking {
      background-color: #6ee7b7;
      color: transparent;
    }

    .section-block { margin-bottom: 20px; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .section-title { font-size: 0.88rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--primary); }

    .transcription-text {
      font-style: italic;
      color: var(--text-muted);
      background: var(--inner-block-bg);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .translation-text {
      font-size: 1.05rem;
      line-height: 1.7;
      background: var(--inner-block-bg);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 8px;
    }

    .hidden-content { filter: blur(6px); cursor: pointer; user-select: none; }

    .footer-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .tasbih-box { display: flex; align-items: center; gap: 12px; }
    .btn-tasbih { background-color: var(--primary); color: white; border: none; padding: 10px 18px; font-size: 1rem; font-weight: 600; border-radius: 8px; }
    .btn-tasbih:hover { background-color: var(--primary-hover); }
    .count-badge { font-size: 1.25rem; font-weight: 700; color: var(--primary); min-width: 36px; text-align: center; }

    .status-buttons { display: flex; gap: 8px; }
    .status-btn.learned.active { background-color: #15803d; border-color: #15803d; }
    .status-btn.learning.active { background-color: var(--accent); border-color: var(--accent); }

    .notice-box {
      padding: 16px;
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #92400e;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    @media print {
      body { background: #ffffff !important; color: #000000 !important; }
      header, .sidebar, .audio-bar, .toolbar, .footer-actions, .status-buttons, .section-header button { display: none !important; }
      .container { display: block; margin: 0; padding: 0; max-width: 100%; }
      .workspace { border: 2px solid #333; background: #fff !important; box-shadow: none; padding: 20px; }
      .arabic-box, .transcription-text, .translation-text { border: 1px solid #999; background: #fff !important; color: #000 !important; filter: none !important; }
      .word-token.masked { background: transparent !important; color: #000 !important; }
      .word-token.speaking { background: transparent !important; box-shadow: none !important; }
    }
  </style>
</head>

<header>
  <div class="brand">

</header>

<div class="container">
  <aside class="sidebar">

  </aside>

  <main class="workspace">
    <div id="missingDataWarning" class="notice-box" style="display:none;"></div>
    <div class="hadith-header">
      <div>
        <div class="hadith-title" id="hadithTitle">Загрузка...</div>
        <div class="hadith-meta" id="hadithMeta"></div>
      </div>
      <div class="status-buttons">
        <button class="status-btn" data-status="none" onclick="setStatus('none')">Не начат</button>
        <button class="status-btn learning" data-status="learning" onclick="setStatus('learning')">Учу</button>
        <button class="status-btn learned" data-status="learned" onclick="setStatus('learned')">Выучен ✓</button>
      </div>
    </div>

    <div class="audio-bar">
      <span class="toolbar-label">🎧 Чтец:</span>
      <audio id="hadithAudio" controls preload="none"></audio>
      <div class="speed-group" title="Скорость воспроизведения">
        <button class="speed-btn" data-rate="0.75" onclick="setPlaybackRate(0.75)">0.75x</button>
        <button class="speed-btn active" data-rate="1" onclick="setPlaybackRate(1)">1x</button>
        <button class="speed-btn" data-rate="1.25" onclick="setPlaybackRate(1.25)">1.25x</button>
      </div>
      <button id="loopBtn" onclick="toggleLoop()" title="Повторять хадис по кругу">🔁 Повтор</button>
      <button id="ttsBtn" onclick="speakArabic()" title="Озвучить диктором по словам с подсветкой">🗣️ Диктор</button>
      <button onclick="stopSpeech()" title="Остановить">⏹️</button>
      <div class="audio-status" id="audioStatus"></div>
    </div>

    <div class="toolbar">
      <span class="toolbar-label">Скрыть слова (араб.):</span>
      <button class="mask-btn active" data-level="0" onclick="setMaskLevel(0)">Показать всё</button>
      <button class="mask-btn" data-level="0.3" onclick="setMaskLevel(0.3)">Скрыть 30%</button>
      <button class="mask-btn" data-level="0.6" onclick="setMaskLevel(0.6)">Скрыть 60%</button>
      <button class="mask-btn" data-level="1" onclick="setMaskLevel(1)">Скрыть 100%</button>
    </div>

    <div class="arabic-box" id="arabicText"></div>

    <div class="section-block">
      <div class="section-header">
        <span class="section-title">Транскрипция (для правильного чтения)</span>
        <button onclick="toggleBlur('transcriptionText')">Показать / Скрыть</button>
      </div>
      <div class="transcription-text" id="transcriptionText" onclick="unblur('transcriptionText')"></div>
    </div>

    <div class="section-block">
      <div class="section-header">
        <span class="section-title">Смысловой перевод</span>
        <button onclick="toggleBlur('translationText')">Показать / Скрыть</button>
      </div>
      <div class="translation-text" id="translationText" onclick="unblur('translationText')"></div>
    </div>

    <div class="footer-actions">
      <div class="tasbih-box">
        <button class="btn-tasbih" onclick="incrementCount()">+1 Прочитал вслух</button>
        <span class="count-badge" id="repeatCount">0</span>
        <button onclick="resetCount()" title="Сбросить счётчик">↺</button>
      </div>
      <div>
        <button onclick="prevHadith()">← Предыдущий</button>
        <button onclick="nextHadith()">Следующий →</button>
      </div>
    </div>
  </main>
</div>

<script src="chapter1.js"></script>

<script src="chapter3.js"></script>

    32: "32. Hadith 32 - La Dharar Wala Dhiraar (No Causing Harm Nor Returning Harm) - Ibn Majah 2340 - Daraqutni 288 - Muwatta 2177.mp3",
    33: "33. Hadith 33 - Claimants & Counter-Claimants - مِن أسُسِ القضاء في الإسلام - Al-Bayhaqi #21200 - Ibn Abi 'Asim #40.mp3",
    34: "34. Hadith 34 - Changing Munkar With The Hand, The Tongue Or With The Heart - تغييرُ المنكَر, ومَراتبه - Muslim #49.mp3",
    35: "35. Hadith 35 - Brotherhood - أُخُوَّةُ الإسلام , وحقوقُ المسلِ - Muslim #2564.mp3",
    36: "36. Hadith 36 - Easing & Screening A Muslim & Virtues Of Knowledge - قضاء حوائج المسلمين, وفضل طلب العلم - Muslim #2699.mp3",
    37: "37. Hadith 37 - Recording Of Hasanat & Sayyiat - عظيم لطف الله تعالى بعباده, وفضله عليهم - Al-Bukhari #6491 - Muslim #131.mp3",
    38: "38. Hadith 38 - The Friend Of Allah & Only Tawwasul - محبَّة الله تعالى لأوليائِه, وبَيانُ طريقِ الولاية - Al-Bukhari #6502.mp3",
    39: "39. Hadith 39 - Mistakes, Forgetfulness & Coercion - رفع الحرج في الإسلام - Ibn Majah #2036 - Al-Bayhaqi #11454.mp3",
    40: "40. Hadith 40 - Be In The Dunya (World) As A Stranger - اغتنام الأوقات قبل الوفاة - Al-Bukhari #6416.mp3",
    41: "41. Hadith 41 - Believer If One's Desire Is In Accordance With The Sharee'ah - اتباع النبي ﷺ - Al-Hujjah Of Al-Maqdisi 2-393.mp3",
    42: "42. Hadith 42 - O Son Of Adam If Your Sins Reached The Clouds - مغفرة الله - At-Tirmidhi #3540 - At-Tabarani, Al-Awsat #4305.mp3"
  };

  const chapters = [
    { id: 1, label: "Глава 1", range: "1–10", min: 1, max: 10 },
    { id: 2, label: "Глава 2", range: "11–20", min: 11, max: 20 },
    { id: 3, label: "Глава 3", range: "21–30", min: 21, max: 30 },
    { id: 4, label: "Глава 4", range: "31–42", min: 31, max: 42 }
  ];

  let currentChapter = 1;
  let currentIndex = 0;
  let maskLevel = 0;
  let arabicFontSize = 30;
  let playbackRate = 1.0;
  let isLooping = false;
  let isSpeakingLoop = false;
  let audioTimeout = null;
  let wordMap = [];
  let activeWordIdx = -1;
  let fallbackTtsAudio = null;
  let progress = JSON.parse(localStorage.getItem('nawawi_progress')) || {};

  function init() {
    if (typeof getCurrentTelegramId === 'function') {
      const uid = getCurrentTelegramId();
      if (uid) {
        const backBtn = document.getElementById('backToCatalog');
        if (backBtn) backBtn.href = `../index.html?id=${uid}`;
      }
    }

    if (hadiths.length === 0) {
      const warn = document.getElementById('missingDataWarning');
      warn.style.display = 'block';
      warn.textContent = 'Файлы глав (chapter1.js ... chapter4.js) пока не найдены в этой папке. Положите их рядом с index.html и обновите страницу.';
      return;
    }
    renderChapterTabs();
    renderSidebar();
    loadHadith(0);
    updateSummary();
  }

  function saveProgress() {
    localStorage.setItem('nawawi_progress', JSON.stringify(progress));
    updateSummary();
    renderChapterTabs();
    renderSidebar();
  }

  function getHadithState(id) {
    if (!progress[id]) {
      progress[id] = { status: 'none', count: 0 };
    }
    return progress[id];
  }

  function renderChapterTabs() {
    const container = document.getElementById('chapterTabs');
    container.innerHTML = '';
    chapters.forEach(ch => {
      const chItems = hadiths.filter(h => h.id >= ch.min && h.id <= ch.max);
      const learnedInCh = chItems.filter(h => getHadithState(h.id).status === 'learned').length;
      const btn = document.createElement('button');
      btn.className = `chapter-btn ${currentChapter === ch.id ? 'active' : ''}`;
      btn.innerHTML = `<strong>${ch.label} (${ch.range})</strong><small>Выучено: ${learnedInCh}/${chItems.length}</small>`;
      btn.onclick = () => {
        currentChapter = ch.id;
        renderChapterTabs();
        renderSidebar();
        const firstIdx = hadiths.findIndex(h => h.id >= ch.min && h.id <= ch.max);
        if (firstIdx !== -1) loadHadith(firstIdx);
      };
      container.appendChild(btn);
    });
  }

  function renderSidebar() {
    const list = document.getElementById('hadithList');
    list.innerHTML = '';
    const ch = chapters.find(c => c.id === currentChapter);
    hadiths.forEach((h, idx) => {
      if (h.id < ch.min || h.id > ch.max) return;
      const state = getHadithState(h.id);
      const li = document.createElement('li');
      li.className = `hadith-item ${idx === currentIndex ? 'selected' : ''}`;
      li.onclick = () => loadHadith(idx);

      const titleSpan = document.createElement('span');
      titleSpan.textContent = h.title;

      const dot = document.createElement('span');
      dot.className = `status-dot ${state.status}`;

      li.appendChild(titleSpan);
      li.appendChild(dot);
      list.appendChild(li);
    });
  }

  function highlightWord(index) {
    if (activeWordIdx === index) return;
    if (activeWordIdx >= 0 && wordMap[activeWordIdx]) {
      wordMap[activeWordIdx].span.classList.remove('speaking');
    }
    activeWordIdx = index;
    if (index >= 0 && wordMap[index]) {
      wordMap[index].span.classList.add('speaking');
    }
  }

  function clearHighlight() {
    highlightWord(-1);
  }

  function setPlaybackRate(rate) {
    playbackRate = rate;
    const audio = document.getElementById('hadithAudio');
    audio.playbackRate = rate;
    if (fallbackTtsAudio) {
      fallbackTtsAudio.playbackRate = rate;
    }
    document.querySelectorAll('.speed-btn').forEach(btn => {
      btn.classList.toggle('active', parseFloat(btn.dataset.rate) === rate);
    });

    if (('speechSynthesis' in window && window.speechSynthesis.speaking) || isSpeakingLoop) {
      speakArabic();
    }
  }

  function toggleLoop() {
    isLooping = !isLooping;
    const audio = document.getElementById('hadithAudio');
    audio.loop = isLooping;
    document.getElementById('loopBtn').classList.toggle('active', isLooping);
  }

  function setupAudio(id) {
    stopSpeech();
    if (audioTimeout) clearTimeout(audioTimeout);

    const audio = document.getElementById('hadithAudio');
    const status = document.getElementById('audioStatus');
    const numStr = String(id).padStart(2, '0');
    const studioFile = studioAudioFiles[id];

    const sources = [];
    if (studioFile) {
      sources.push(`https://archive.org/download/40Hadith_Nawawi/${encodeURIComponent(studioFile)}`);
    }
    sources.push(`audio/${numStr}.mp3`);

    let srcIdx = 0;
    status.style.display = 'none';
    status.textContent = '';
    audio.pause();
    audio.loop = isLooping;

    function tryNextSource() {
      if (audioTimeout) clearTimeout(audioTimeout);
      if (srcIdx >= sources.length) {
        status.style.display = 'block';
        status.textContent = 'Онлайн-запись сейчас недоступна — используйте кнопку «🗣️ Диктор».';
        return;
      }
      audio.src = sources[srcIdx];
      audio.playbackRate = playbackRate;
      srcIdx++;
    }

    audio.onloadedmetadata = () => {
      audio.playbackRate = playbackRate;
    };

    // При чтении с основного аудиоресурса подсветку слов не включаем
    audio.onplaying = () => {
      if (audioTimeout) clearTimeout(audioTimeout);
      clearHighlight();
      audio.playbackRate = playbackRate;
      status.style.display = 'none';
    };

    audio.onwaiting = () => {
      if (audioTimeout) clearTimeout(audioTimeout);
      audioTimeout = setTimeout(() => {
        if (audio.readyState < 3) {
          tryNextSource();
          audio.play().catch(() => {});
        }
      }, 6000);
    };

    audio.onerror = () => {
      tryNextSource();
    };

    tryNextSource();
  }

  function getTtsRate() {
    if (playbackRate < 1) return 0.65;
    if (playbackRate > 1) return 1.35;
    return 1.0;
  }

  // Резервный онлайн-диктор для Android Telegram WebView, где отсутствует window.speechSynthesis
  function speakWithOnlineFallback() {
    const status = document.getElementById('audioStatus');
    if (wordMap.length === 0) return;

    // Разбиваем слова хадиса на короткие фразы до 150 символов
    const chunks = [];
    let currentWords = [];
    let currentLen = 0;

    wordMap.forEach((item, idx) => {
      const clean = item.rawWord.replace(/ﷺ/g, 'صلى الله عليه وسلم');
      if (currentLen + clean.length > 150 && currentWords.length > 0) {
        chunks.push({ words: currentWords, text: currentWords.map(w => w.clean).join(' ') });
        currentWords = [];
        currentLen = 0;
      }
      currentWords.push({ idx: idx, clean: clean, weight: item.cumWeight });
      currentLen += clean.length + 1;
    });
    if (currentWords.length > 0) {
      chunks.push({ words: currentWords, text: currentWords.map(w => w.clean).join(' ') });
    }

    let chunkIdx = 0;
    isSpeakingLoop = true;

    function playNextChunk() {
      if (!isSpeakingLoop) {
        clearHighlight();
        return;
      }
      if (chunkIdx >= chunks.length) {
        clearHighlight();
        if (isLooping && isSpeakingLoop) {
          chunkIdx = 0;
          setTimeout(playNextChunk, 600);
        } else {
          isSpeakingLoop = false;
        }
        return;
      }

      const chunk = chunks[chunkIdx];
      const url = `https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=ar&dt=t&q=${encodeURIComponent(chunk.text)}`;

      if (fallbackTtsAudio) {
        fallbackTtsAudio.pause();
      }
      fallbackTtsAudio = new Audio(url);
      fallbackTtsAudio.playbackRate = playbackRate;

      fallbackTtsAudio.ontimeupdate = () => {
        if (!fallbackTtsAudio || !fallbackTtsAudio.duration || fallbackTtsAudio.paused) return;
        const ratio = Math.min(0.999, Math.max(0, fallbackTtsAudio.currentTime / fallbackTtsAudio.duration));
        const wordPos = Math.floor(ratio * chunk.words.length);
        if (chunk.words[wordPos]) {
          highlightWord(chunk.words[wordPos].idx);
        }
      };

      fallbackTtsAudio.onended = () => {
        chunkIdx++;
        playNextChunk();
      };

      fallbackTtsAudio.onerror = () => {
        isSpeakingLoop = false;
        clearHighlight();
        status.style.display = 'block';
        status.textContent = 'Встроенный диктор заблокирован окном Telegram. Нажмите «⋮» сверху справа → «Открыть в браузере» (Chrome), либо используйте основной плеер выше.';
      };

      if (chunk.words[0]) highlightWord(chunk.words[0].idx);
      fallbackTtsAudio.play().catch(() => {
        isSpeakingLoop = false;
        clearHighlight();
        status.style.display = 'block';
        status.textContent = 'Нажмите «⋮» сверху справа → «Открыть в браузере» (Chrome) для работы встроенного диктора, либо используйте основной плеер выше.';
      });
    }

    playNextChunk();
  }

  function speakArabic() {
    const h = hadiths[currentIndex];
    if (!h) return;

    document.getElementById('hadithAudio').pause();
    if (fallbackTtsAudio) {
      fallbackTtsAudio.pause();
      fallbackTtsAudio = null;
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
    clearHighlight();
    document.getElementById('audioStatus').style.display = 'none';

    const hasNativeTts = ('speechSynthesis' in window) && (typeof SpeechSynthesisUtterance !== 'undefined');
    if (!hasNativeTts) {
      speakWithOnlineFallback();
      return;
    }

    isSpeakingLoop = true;
    let speechParts = [];
    let cursor = 0;
    wordMap.forEach(item => {
      const spokenWord = item.rawWord.replace(/ﷺ/g, 'صلى الله عليه وسلم');
      item.ttsStart = cursor;
      item.ttsEnd = cursor + spokenWord.length;
      speechParts.push(spokenWord);
      cursor = item.ttsEnd + 1;
    });

    const fullSpeechText = speechParts.join(' ');
    const utter = new SpeechSynthesisUtterance(fullSpeechText);
    utter.lang = 'ar-SA';
    utter.rate = getTtsRate();

    let boundaryFired = false;
    utter.onboundary = (event) => {
      boundaryFired = true;
      if (event.name === 'word' || typeof event.charIndex === 'number') {
        const idx = event.charIndex;
        for (let i = 0; i < wordMap.length; i++) {
          if (idx >= wordMap[i].ttsStart - 1 && idx <= wordMap[i].ttsEnd) {
            highlightWord(i);
            break;
          }
        }
      }
    };

    utter.onend = () => {
      clearHighlight();
      if (isLooping && isSpeakingLoop) {
        setTimeout(() => {
          if (isLooping && isSpeakingLoop) speakArabic();
        }, 700);
      } else {
        isSpeakingLoop = false;
      }
    };

    utter.onerror = () => {
      clearHighlight();
      isSpeakingLoop = false;
      // Если нативный движок Android выдал ошибку (нет голосового пакета), запускаем резервный диктор
      speakWithOnlineFallback();
    };

    highlightWord(0);
    window.speechSynthesis.speak(utter);
  }

  function stopSpeech() {
    isSpeakingLoop = false;
    document.getElementById('hadithAudio').pause();
    if (fallbackTtsAudio) {
      fallbackTtsAudio.pause();
      fallbackTtsAudio = null;
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
    clearHighlight();
  }

  function loadHadith(index) {
    if (!hadiths[index]) return;
    currentIndex = index;
    const h = hadiths[index];

    const targetCh = chapters.find(c => h.id >= c.min && h.id <= c.max);
    if (targetCh && targetCh.id !== currentChapter) {
      currentChapter = targetCh.id;
      renderChapterTabs();
    }

    const state = getHadithState(h.id);
    document.getElementById('hadithTitle').textContent = h.title;
    document.getElementById('hadithMeta').textContent = h.source;
    document.getElementById('transcriptionText').textContent = h.transcription;
    document.getElementById('translationText').textContent = h.translation;
    document.getElementById('repeatCount').textContent = state.count;

    document.querySelectorAll('.status-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === state.status);
    });

    setupAudio(h.id);
    renderArabicText(h.arabic);
    renderSidebar();
  }

  function renderArabicText(text) {
    const container = document.getElementById('arabicText');
    container.innerHTML = '';
    wordMap = [];
    activeWordIdx = -1;

    const words = text.split(' ');
    let cumWeight = 0;

    words.forEach((word, idx) => {
      const span = document.createElement('span');
      span.textContent = word;
      span.className = 'word-token';

      if (maskLevel > 0) {
        const hash = ((idx * 17 + 7) % 10) / 10;
        if (maskLevel === 1 || hash < maskLevel) {
          span.classList.add('masked');
          span.onclick = () => span.classList.remove('masked');
        }
      }

      const baseLen = word.replace(/[ً-ٰٟ]/g, '').length || 1;
      const pauseBonus = /[،.؟!:«»]/.test(word) ? 3.5 : 1.0;
      cumWeight += baseLen + pauseBonus;

      wordMap.push({
        span: span,
        rawWord: word,
        cumWeight: cumWeight,
        ttsStart: 0,
        ttsEnd: 0
      });

      container.appendChild(span);
    });
  }

  function setMaskLevel(level) {
    maskLevel = level;
    document.querySelectorAll('.mask-btn').forEach(btn => {
      btn.classList.toggle('active', parseFloat(btn.dataset.level) === level);
    });
    if (hadiths[currentIndex]) renderArabicText(hadiths[currentIndex].arabic);
  }

  function incrementCount() {
    const h = hadiths[currentIndex];
    if (!h) return;
    const state = getHadithState(h.id);
    state.count += 1;
    if (state.status === 'none') state.status = 'learning';
    document.getElementById('repeatCount').textContent = state.count;
    saveProgress();
    loadHadith(currentIndex);
  }

  function resetCount() {
    const h = hadiths[currentIndex];
    if (!h) return;
    const state = getHadithState(h.id);
    state.count = 0;
    document.getElementById('repeatCount').textContent = 0;
    saveProgress();
  }

  function setStatus(status) {
    const h = hadiths[currentIndex];
    if (!h) return;
    const state = getHadithState(h.id);
    state.status = status;
    saveProgress();
    loadHadith(currentIndex);
  }

  function updateSummary() {
    const learnedCount = hadiths.filter(h => getHadithState(h.id).status === 'learned').length;
    document.getElementById('progressSummary').textContent = `Выучено: ${learnedCount} из ${hadiths.length}`;
  }

  function printChapterCards() {
    const ch = chapters.find(c => c.id === currentChapter);
    const items = hadiths.filter(h => h.id >= ch.min && h.id <= ch.max);
    const win = window.open('', '_blank');
    if (!win) {
      alert('Разрешите всплывающие окна в браузере для формирования карточек.');
      return;
    }
    const cardsHtml = items.map(h => `
      <div class="card">
        <div class="card-head"><strong>${h.title}</strong> <span>(${h.source})</span></div>
        <div class="arabic">${h.arabic}</div>
        <div class="transcr">${h.transcription}</div>
        <div class="transl">${h.translation}</div>
      </div>
    `).join('');

    win.document.write(`<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
      <title>${ch.label} (${ch.range}) — Карточки для заучивания</title>
      <style>
        body { font-family: Arial, sans-serif; color: #111; margin: 16px; }
        h1 { font-size: 18px; margin-bottom: 14px; text-align: center; }
        .card { border: 1.5px solid #333; border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; break-inside: avoid; }
        .card-head { font-size: 13px; border-bottom: 1px solid #ccc; padding-bottom: 4px; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .arabic { direction: rtl; text-align: right; font-family: "Traditional Arabic", "Amiri", serif; font-size: 22px; line-height: 1.8; margin-bottom: 6px; }
        .transcr { font-style: italic; font-size: 12px; color: #444; margin-bottom: 6px; }
        .transl { font-size: 13px; line-height: 1.45; }
        @media print { .no-print { display: none; } }
      </style></head><body>
      <div class="no-print" style="margin-bottom:12px;text-align:right;">
        <button onclick="window.print()" style="padding:8px 16px;font-size:14px;cursor:pointer;">🖨️ Печать / Сохранить как PDF</button>
      </div>
      <h1>40 хадисов Ан-Науауи — ${ch.label} (хадисы ${ch.range})</h1>
      ${cardsHtml}
      </body></html>`);
    win.document.close();
  }

  function toggleBlur(elementId) { document.getElementById(elementId).classList.toggle('hidden-content'); }
  function unblur(elementId) { document.getElementById(elementId).classList.remove('hidden-content'); }
  function prevHadith() { if (currentIndex > 0) loadHadith(currentIndex - 1); }
  function nextHadith() { if (currentIndex < hadiths.length - 1) loadHadith(currentIndex + 1); }

  function changeFontSize(delta) {
    arabicFontSize = Math.min(48, Math.max(20, arabicFontSize + delta));
    document.documentElement.style.setProperty('--arabic-size', arabicFontSize + 'px');
  }

  function toggleTheme() {
    document.body.classList.toggle('dark-theme');
    const isDark = document.body.classList.contains('dark-theme');
    document.getElementById('themeBtn').textContent = isDark ? '☀️ Светлая тема' : '🌙 Тёмная тема';
  }

  function exportProgress() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(progress, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", "nawawi_progress.json");
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  function importProgress(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        progress = JSON.parse(e.target.result);
        saveProgress();
        loadHadith(currentIndex);
        alert("Прогресс успешно загружен!");
      } catch (err) {
        alert("Ошибка при чтении файла.");
      }
    };
    reader.readAsText(file);
  }

  init();
</script>
</body>
