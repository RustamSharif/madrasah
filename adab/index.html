<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адаб и Ахляк — Исламская этика и нравственность</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        (function() {
            var s = document.createElement('script');
            s.src = '../auth.js?v=' + Date.now();
            s.async = false;
            s.onload = function() {
                if (typeof protectCoursePage === 'function') {
                    protectCoursePage('adab', 'Адаб и Ахляк');
                }
            };
            document.head.appendChild(s);
        })();
    </script>
    <style>
        :root {
            --bg-color: #f4efe6;
            --card-bg: #ffffff;
            --text-main: #1b2e24;
            --text-muted: #4b6658;
            --accent: #15603e;
            --accent-hover: #0f472e;
            --accent-light: #eef5f0;
            --gold: #b89b5e;
            --border: #d5e2da;
            --btn-bg: #f7faf8;
            --btn-hover: #e8f1ec;
            --correct-bg: #d4edda;
            --correct-border: #28a745;
            --correct-text: #155724;
            --wrong-bg: #f8d7da;
            --wrong-border: #dc3545;
            --wrong-text: #721c24;
            --shadow: 0 6px 24px rgba(21, 96, 62, 0.08);
        }

        body.dark-theme {
            --bg-color: #121a16;
            --card-bg: #1b2621;
            --text-main: #e6efe9;
            --text-muted: #9bb3a6;
            --accent: #2ea870;
            --accent-hover: #248a5b;
            --accent-light: #22332b;
            --gold: #d4b87a;
            --border: #2e4037;
            --btn-bg: #23302a;
            --btn-hover: #2c3d35;
            --correct-bg: #1c3d29;
            --correct-border: #2ea870;
            --correct-text: #a3e4be;
            --wrong-bg: #422024;
            --wrong-border: #e05260;
            --wrong-text: #f5b7be;
            --shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            transition: background-color 0.25s, color 0.25s;
        }

        .container {
            background-color: var(--card-bg);
            padding: 22px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            max-width: 720px;
            width: 100%;
            margin-top: 8px;
            margin-bottom: 24px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .nav-btn {
            background: var(--accent-light);
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
        }

        .nav-btn:hover {
            background: var(--accent);
            color: #fff;
        }

        .header-title {
            text-align: center;
            margin-bottom: 18px;
        }

        .header-title h1 {
            margin: 0 0 6px 0;
            font-size: 1.5rem;
            color: var(--accent);
        }

        .header-title p {
            margin: 0;
            font-size: 0.92rem;
            color: var(--text-muted);
        }

        .stats-pill {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 12px;
            background: var(--accent-light);
            color: var(--accent);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid var(--border);
        }

        .chapter-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chapter-card {
            background: var(--btn-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: border-color 0.2s;
        }

        .chapter-card:hover {
            border-color: var(--accent);
        }

        .chapter-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .chapter-title {
            font-weight: 700;
            font-size: 1rem;
            line-height: 1.35;
            color: var(--text-main);
        }

        .chapter-badge {
            font-size: 0.78rem;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 12px;
            background: var(--accent-light);
            color: var(--accent);
            white-space: nowrap;
        }

        .chapter-badge.done {
            background: var(--correct-bg);
            color: var(--correct-text);
        }

        .chapter-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-action {
            flex: 1;
            min-width: 130px;
            padding: 10px 14px;
            border-radius: 9px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: all 0.15s;
            text-align: center;
        }

        .btn-quiz {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .btn-quiz:hover {
            background: var(--accent-hover);
        }

        .btn-cheat {
            background: var(--card-bg);
            color: var(--text-main);
        }

        .btn-cheat:hover {
            background: var(--btn-hover);
            border-color: var(--accent);
        }

        .exam-card {
            margin-top: 18px;
            padding: 16px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-light), var(--card-bg));
            border: 1.5px solid var(--gold);
            text-align: center;
        }

        .exam-card h3 {
            margin: 0 0 6px 0;
            color: var(--accent);
            font-size: 1.1rem;
        }

        .exam-card p {
            margin: 0 0 12px 0;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .btn-exam {
            background: var(--gold);
            color: #1b2e24;
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.15s;
        }

        .btn-exam:hover {
            opacity: 0.92;
        }

        /* Quiz Screen */
        .quiz-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .score-text {
            font-weight: 700;
            font-size: 0.92rem;
            color: var(--accent);
        }

        .topic-tag {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--gold);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.12rem;
            font-weight: 700;
            line-height: 1.45;
            margin-bottom: 18px;
            color: var(--text-main);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            padding: 13px 15px;
            font-size: 0.98rem;
            text-align: left;
            background-color: var(--btn-bg);
            color: var(--text-main);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            line-height: 1.4;
            transition: all 0.15s;
        }

        .option-btn:hover:not(:disabled) {
            background-color: var(--btn-hover);
            border-color: var(--accent);
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            font-weight: 700;
        }

        .option-btn.wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
        }

        .explanation-box {
            display: none;
            margin-top: 18px;
            padding: 15px;
            background-color: var(--accent-light);
            border-left: 5px solid var(--accent);
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.55;
        }

        .source-text {
            display: block;
            margin-top: 8px;
            font-size: 0.82rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .quiz-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .next-btn {
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: none;
            margin-left: auto;
        }

        .next-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Result Screen */
        .result-screen {
            display: none;
            text-align: center;
            padding: 16px 0;
        }

        .result-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .result-score {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .result-msg {
            font-size: 0.98rem;
            color: var(--text-muted);
            margin-bottom: 22px;
            line-height: 1.5;
        }

        /* Cheatsheet Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-box {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 680px;
            width: 100%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
        }

        .modal-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 1.05rem;
            color: var(--accent);
        }

        .modal-close {
            background: var(--btn-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .modal-body {
            padding: 18px;
            overflow-y: auto;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .modal-body h3 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1.1rem;
        }

        .modal-body ul, .modal-body ol {
            padding-left: 20px;
            margin: 8px 0;
        }

        .modal-body li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <a href="../index.html" id="back-catalog-btn" class="nav-btn">← Все курсы</a>
        <button class="nav-btn" onclick="toggleTheme()" id="theme-btn">🌙 Тёмная тема</button>
    </div>

    <!-- Главное меню курса -->
    <div id="menu-screen">
        <div class="header-title">
            <h1>🌿 Адаб и Ахляк</h1>
            <p>Исламская этика, культура общения и воспитание нравственности</p>
            <div class="stats-pill" id="total-stats">Загрузка базы знаний...</div>
        </div>

        <div class="chapter-list" id="chapter-list"></div>

        <div class="exam-card">
            <h3>🎓 Итоговый зачёт по курсу</h3>
            <p>40 случайных вопросов из всех 10 глав для комплексной самопроверки</p>
            <button class="btn-exam" onclick="startFinalExam()">Начать итоговый зачёт (40 вопросов)</button>
        </div>
    </div>

    <!-- Экран тестирования -->
    <div id="quiz-screen" style="display: none;">
        <div class="quiz-top">
            <button class="nav-btn" onclick="returnToMenu()">← К главам</button>
            <span class="score-text" id="progress-text">Вопрос 1 из 15 | Верно: 0</span>
            <button class="nav-btn" id="quiz-cheat-btn" onclick="openCurrentCheatsheet()">📖 Шпаргалка</button>
        </div>

        <div class="topic-tag" id="question-topic"></div>
        <div class="question-text" id="question-text"></div>
        <div class="options-list" id="options-list"></div>

        <div class="explanation-box" id="explanation-box">
            <span id="explanation-text"></span>
            <span class="source-text" id="source-text"></span>
        </div>

        <div class="quiz-footer">
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Следующий вопрос ➡</button>
        </div>
    </div>

    <!-- Экран результатов -->
    <div id="result-screen" class="result-screen">
        <div class="result-icon" id="result-icon">🏆</div>
        <h2 id="result-title">Глава пройдена!</h2>
        <div class="result-score" id="result-score"></div>
        <p class="result-msg" id="result-msg"></p>
        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
            <button class="btn-action btn-quiz" style="max-width: 220px;" onclick="retryCurrentQuiz()">🔄 Пройти заново</button>
            <button class="btn-action btn-cheat" style="max-width: 220px;" onclick="returnToMenu()">📋 К списку глав</button>
        </div>
    </div>
</div>

<!-- Модальное окно шпаргалки -->
<div class="modal-overlay" id="cheat-modal" onclick="closeModalOnBg(event)">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="modal-title">📖 Конспект-шпаргалка</h3>
            <button class="modal-close" onclick="closeCheatsheet()">✕ Закрыть</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
    </div>
</div>

<!-- Подключение 4 файлов базы знаний -->
<script>window.ADAB_DATA = window.ADAB_DATA || { cheatsheets: {}, questions: [] };</script>
<script src="adab_part1.js"></script>
<script src="adab_part2.js"></script>
<script src="adab_part3a.js"></script>
<script src="adab_part3b.js"></script>

<script>
    const CHAPTERS = [
        { num: 1, title: "Искренность (Ихляс) и работа над сердцем", keywords: ["искренност", "ихляс", "сердц"] },
        { num: 2, title: "Адаб по отношению к Аллаху и Корану", keywords: ["аллаху", "корану"] },
        { num: 3, title: "Адаб к Пророку ﷺ и обладателям знания", keywords: ["пророку", "знания", "учёным"] },
        { num: 4, title: "Благочестие к родителям и родственные связи", keywords: ["родителям", "родствен"] },
        { num: 5, title: "Адаб в семье: супруги и воспитание детей", keywords: ["семье", "супруг", "детей"] },
        { num: 6, title: "Адаб с соседями, гостями и друзьями", keywords: ["соседями", "гостями", "друзьями"] },
        { num: 7, title: "Культура речи и хранение языка", keywords: ["речи", "языка"] },
        { num: 8, title: "Этикет приветствия, собраний и общения", keywords: ["приветствия", "собраний"] },
        { num: 9, title: "Адаб еды, питья, сна и внешнего вида", keywords: ["еды", "питья", "сна"] },
        { num: 10, title: "Адаб мечети, дороги и общественных мест", keywords: ["мечети", "дороги"] }
    ];

    let mappedChapters = [];
    let currentQuizQuestions = [];
    let currentIndex = 0;
    let currentScore = 0;
    let activeChapterIndex = null;
    let isFinalExam = false;

    function preserveUrlParams() {
        const search = window.location.search;
        if (search) {
            const backBtn = document.getElementById('back-catalog-btn');
            if (backBtn) backBtn.href = '../index.html' + search;
        }
    }

    function initTheme() {
        const saved = localStorage.getItem('madrasah_theme');
        if (saved === 'dark') {
            document.body.classList.add('dark-theme');
            document.getElementById('theme-btn').textContent = '☀️ Светлая тема';
        }
    }

    function toggleTheme() {
        const isDark = document.body.classList.toggle('dark-theme');
        localStorage.setItem('madrasah_theme', isDark ? 'dark' : 'light');
        document.getElementById('theme-btn').textContent = isDark ? '☀️ Светлая тема' : '🌙 Тёмная тема';
    }

    function getProgress() {
        try {
            return JSON.parse(localStorage.getItem('adab_progress_v1') || '{}');
        } catch (e) {
            return {};
        }
    }

    function saveProgress(chapterNum, score, total) {
        const prog = getProgress();
        const pct = Math.round((score / total) * 100);
        if (!prog[chapterNum] || pct > prog[chapterNum].pct) {
            prog[chapterNum] = { score, total, pct };
            localStorage.setItem('adab_progress_v1', JSON.stringify(prog));
        }
    }

    function resolveData() {
        const data = window.ADAB_DATA || { cheatsheets: {}, questions: [] };
        const rawCheatKeys = Object.keys(data.cheatsheets || {});
        const rawQuestions = data.questions || [];

        const distinctQChapters = [];
        rawQuestions.forEach(q => {
            if (q.chapter && !distinctQChapters.includes(q.chapter)) {
                distinctQChapters.push(q.chapter);
            }
        });

        mappedChapters = CHAPTERS.map((ch, idx) => {
            // 1. Поиск шпаргалки
            let cheatHtml = data.cheatsheets[ch.title] || null;
            if (!cheatHtml) {
                const matchedKey = rawCheatKeys.find(k => {
                    const low = k.toLowerCase();
                    return ch.keywords.some(kw => low.includes(kw));
                });
                if (matchedKey) cheatHtml = data.cheatsheets[matchedKey];
                else if (rawCheatKeys[idx]) cheatHtml = data.cheatsheets[rawCheatKeys[idx]];
            }

            // 2. Поиск вопросов
            let qs = rawQuestions.filter(q => q.chapter === ch.title);
            if (qs.length === 0) {
                qs = rawQuestions.filter(q => {
                    const low = (q.chapter || '').toLowerCase();
                    return ch.keywords.some(kw => low.includes(kw));
                });
            }
            if (qs.length === 0 && distinctQChapters[idx]) {
                qs = rawQuestions.filter(q => q.chapter === distinctQChapters[idx]);
            }

            return {
                ...ch,
                cheatsheet: cheatHtml,
                questions: qs
            };
        });

        const totalQ = rawQuestions.length;
        const totalC = mappedChapters.filter(c => c.cheatsheet).length;
        document.getElementById('total-stats').textContent = `10 глав • ${totalC} шпаргалок • ${totalQ} вопросов`;
    }

    function renderMenu() {
        const list = document.getElementById('chapter-list');
        list.innerHTML = '';
        const prog = getProgress();

        mappedChapters.forEach((ch, idx) => {
            const p = prog[ch.num];
            const badgeText = p ? `✓ ${p.pct}% (${p.score}/${p.total})` : `${ch.questions.length} вопросов`;
            const badgeClass = (p && p.pct >= 70) ? 'chapter-badge done' : 'chapter-badge';

            const card = document.createElement('div');
            card.className = 'chapter-card';
            card.innerHTML = `
                <div class="chapter-header">
                    <div class="chapter-title">${ch.num}. ${ch.title}</div>
                    <span class="${badgeClass}">${badgeText}</span>
                </div>
                <div class="chapter-actions">
                    ${ch.cheatsheet ? `<button class="btn-action btn-cheat" onclick="openCheatsheet(${idx})">📖 Шпаргалка</button>` : ''}
                    <button class="btn-action btn-quiz" onclick="startChapterQuiz(${idx})">📝 Пройти тест (${ch.questions.length})</button>
                </div>
            `;
            list.appendChild(card);
        });
    }

    function openCheatsheet(idx) {
        const ch = mappedChapters[idx];
        if (!ch || !ch.cheatsheet) return;
        document.getElementById('modal-title').textContent = `📖 Глава ${ch.num}. ${ch.title}`;
        document.getElementById('modal-body').innerHTML = ch.cheatsheet;
        document.getElementById('cheat-modal').style.display = 'flex';
    }

    function openCurrentCheatsheet() {
        if (activeChapterIndex !== null) {
            openCheatsheet(activeChapterIndex);
        }
    }

    function closeCheatsheet() {
        document.getElementById('cheat-modal').style.display = 'none';
    }

    function closeModalOnBg(e) {
        if (e.target.id === 'cheat-modal') closeCheatsheet();
    }

    function shuffleArray(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
    }

    function startChapterQuiz(idx) {
        const ch = mappedChapters[idx];
        if (!ch || ch.questions.length === 0) {
            alert('Вопросы для этой главы пока не загружены.');
            return;
        }
        isFinalExam = false;
        activeChapterIndex = idx;
        currentQuizQuestions = shuffleArray(ch.questions);
        currentIndex = 0;
        currentScore = 0;

        document.getElementById('quiz-cheat-btn').style.display = ch.cheatsheet ? 'inline-flex' : 'none';
        showScreen('quiz-screen');
        renderQuestion();
    }

    function startFinalExam() {
        const allQ = (window.ADAB_DATA && window.ADAB_DATA.questions) ? window.ADAB_DATA.questions : [];
        if (allQ.length === 0) {
            alert('База вопросов пока не загружена.');
            return;
        }
        isFinalExam = true;
        activeChapterIndex = null;
        currentQuizQuestions = shuffleArray(allQ).slice(0, 40);
        currentIndex = 0;
        currentScore = 0;

        document.getElementById('quiz-cheat-btn').style.display = 'none';
        showScreen('quiz-screen');
        renderQuestion();
    }

    function renderQuestion() {
        const q = currentQuizQuestions[currentIndex];
        const total = currentQuizQuestions.length;

        document.getElementById('progress-text').textContent = `Вопрос ${currentIndex + 1} из ${total} | Верно: ${currentScore}`;
        document.getElementById('question-topic').textContent = q.topic || q.chapter || 'Адаб и Ахляк';
        document.getElementById('question-text').innerHTML = q.question;

        const optionsBox = document.getElementById('options-list');
        optionsBox.innerHTML = '';

        document.getElementById('explanation-box').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';

        q.options.forEach((optText, optIdx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = optText;
            btn.onclick = () => selectOption(optIdx, btn);
            optionsBox.appendChild(btn);
        });
    }

    function selectOption(selectedIdx, clickedBtn) {
        const q = currentQuizQuestions[currentIndex];
        const buttons = document.querySelectorAll('#options-list .option-btn');
        buttons.forEach(b => b.disabled = true);

        if (selectedIdx === q.correct) {
            clickedBtn.classList.add('correct');
            currentScore++;
        } else {
            clickedBtn.classList.add('wrong');
            if (buttons[q.correct]) {
                buttons[q.correct].classList.add('correct');
            }
        }

        document.getElementById('progress-text').textContent = `Вопрос ${currentIndex + 1} из ${currentQuizQuestions.length} | Верно: ${currentScore}`;

        if (q.explanation) {
            document.getElementById('explanation-text').innerHTML = q.explanation;
            document.getElementById('source-text').textContent = q.source ? `Источник: ${q.source}` : '';
            document.getElementById('explanation-box').style.display = 'block';
        }

        const nextBtn = document.getElementById('next-btn');
        nextBtn.textContent = (currentIndex === currentQuizQuestions.length - 1) ? 'Завершить и посмотреть результат 🏁' : 'Следующий вопрос ➡';
        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuizQuestions.length) {
            renderQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        const total = currentQuizQuestions.length;
        const pct = Math.round((currentScore / total) * 100);

        if (!isFinalExam && activeChapterIndex !== null) {
            saveProgress(mappedChapters[activeChapterIndex].num, currentScore, total);
        }

        let icon = '📚';
        let msg = 'Рекомендуем ещё раз прочитать конспект-шпаргалку по этой теме и закрепить материал.';
        if (pct === 100) {
            icon = '🏆';
            msg = 'МашаАллах! Безупречный результат — тема усвоена на 100%.';
        } else if (pct >= 80) {
            icon = '🌟';
            msg = 'Отличный результат! Вы хорошо усвоили правила исламского адаба по этой главе.';
        } else if (pct >= 60) {
            icon = '👍';
            msg = 'Хороший результат, но стоит повторить несколько вопросов из шпаргалки.';
        }

        document.getElementById('result-icon').textContent = icon;
        document.getElementById('result-title').textContent = isFinalExam ? 'Итоговый зачёт завершён!' : `Глава ${mappedChapters[activeChapterIndex].num} завершена!`;
        document.getElementById('result-score').textContent = `Верных ответов: ${currentScore} из ${total} (${pct}%)`;
        document.getElementById('result-msg').textContent = msg;

        showScreen('result-screen');
    }

    function retryCurrentQuiz() {
        if (isFinalExam) {
            startFinalExam();
        } else if (activeChapterIndex !== null) {
            startChapterQuiz(activeChapterIndex);
        }
    }

    function returnToMenu() {
        renderMenu();
        showScreen('menu-screen');
    }

    function showScreen(id) {
        document.getElementById('menu-screen').style.display = (id === 'menu-screen') ? 'block' : 'none';
        document.getElementById('quiz-screen').style.display = (id === 'quiz-screen') ? 'block' : 'none';
        document.getElementById('result-screen').style.display = (id === 'result-screen') ? 'block' : 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('DOMContentLoaded', () => {
        preserveUrlParams();
        initTheme();
        resolveData();
        renderMenu();
    });
</script>

</body>
</html>
