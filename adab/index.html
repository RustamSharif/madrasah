<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Адаб и Ахляк — Исламская этика и нравственность</title>
  <script>
    document.write('<script src="../auth.js?v=' + Date.now() + '"><\/script>');
  </script>
  <script>
    if (typeof protectCoursePage === "function") {
      protectCoursePage("adab", "Адаб и Ахляк (Исламская этика)");
    }
  </script>
  <style>
    :root {
      --bg: #f4efe6;
      --card: #ffffff;
      --text: #1b2e24;
      --muted: #4b6658;
      --primary: #15603e;
      --primary-hover: #0f492f;
      --accent: #b89b5e;
      --border: #d5e2da;
      --soft: #eef5f0;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --success: #15803d;
      --success-bg: #f0fdf4;
    }
    body.dark {
      --bg: #111b16;
      --card: #192620;
      --text: #e6efe9;
      --muted: #9eb5a8;
      --primary: #2d8a5e;
      --primary-hover: #38a16f;
      --accent: #d4b675;
      --border: #2a3e34;
      --soft: #203129;
      --danger: #f87171;
      --danger-bg: #3b1818;
      --success: #4ade80;
      --success-bg: #163322;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.55;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .nav-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .nav-btn:hover { background: var(--soft); }
    .header-card {
      background: linear-gradient(135deg, #15603e, #0d3d27);
      color: #fff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }
    .header-card h1 {
      margin: 0 0 6px 0;
      font-size: 1.4rem;
    }
    .header-card p {
      margin: 0;
      font-size: 0.92rem;
      opacity: 0.92;
    }
    .stats-pill {
      display: inline-block;
      margin-top: 10px;
      background: rgba(255,255,255,0.15);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
    }
    .chapter-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .chapter-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .chapter-info {
      flex: 1;
      min-width: 220px;
    }
    .chapter-title {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 4px;
    }
    .chapter-meta {
      font-size: 0.83rem;
      color: var(--muted);
    }
    .chapter-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-soft {
      background: var(--soft);
      color: var(--primary);
      border: 1px solid var(--border);
    }
    .btn-soft:hover { opacity: 0.88; }
    .btn-exam {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      margin-top: 16px;
      background: linear-gradient(135deg, #b89b5e, #9a7e43);
      color: #fff;
      border-radius: 14px;
      font-weight: 700;
    }
    .quiz-box, .result-box {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .quiz-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      font-size: 0.88rem;
      color: var(--muted);
      font-weight: 600;
    }
    .question-text {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      text-align: left;
      background: var(--soft);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 15px;
      font-size: 0.96rem;
      cursor: pointer;
      transition: 0.15s;
    }
    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
    }
    .option-btn.correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: var(--success);
      font-weight: 700;
    }
    .option-btn.wrong {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }
    .explanation-box {
      display: none;
      margin-top: 16px;
      padding: 14px 16px;
      background: var(--soft);
      border-left: 4px solid var(--primary);
      border-radius: 10px;
      font-size: 0.94rem;
    }
    .source-tag {
      display: block;
      margin-top: 8px;
      font-size: 0.82rem;
      color: var(--muted);
      font-style: italic;
    }
    .quiz-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      gap: 10px;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      padding: 16px;
      overflow-y: auto;
      align-items: center;
      justify-content: center;
    }
    .modal-card {
      background: var(--card);
      color: var(--text);
      max-width: 700px;
      width: 100%;
      max-height: 86vh;
      overflow-y: auto;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .modal-header h2 {
      margin: 0;
      font-size: 1.05rem;
      color: var(--primary);
    }
    .cheat-body h3 {
      margin-top: 0;
      color: var(--primary);
      font-size: 1.1rem;
    }
    .cheat-body ul, .cheat-body ol {
      padding-left: 20px;
    }
    .cheat-body li {
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <a class="nav-btn" id="backHomeBtn" href="../index.html">← Все курсы</a>
    <button class="nav-btn" onclick="toggleDark()">🌓 Тема</button>
  </div>

  <div class="header-card">
    <h1>Адаб и Ахляк</h1>
    <p>Исламская этика, воспитание души и благой нрав по Корану, Сунне и трудам учёных</p>
    <div class="stats-pill" id="totalStats">Загрузка базы знаний...</div>
  </div>

  <div id="menuView">
    <div class="chapter-list" id="chapterList"></div>
    <button class="btn btn-exam" onclick="startFinalExam()">🎓 Итоговый зачёт (40 случайных вопросов)</button>
  </div>

  <div class="quiz-box" id="quizView">
    <div class="quiz-top">
      <span id="quizProgress">Вопрос 1 из 15</span>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-soft" id="inQuizCheatBtn" onclick="openCurrentCheatsheet()">📖 Шпаргалка</button>
        <button class="nav-btn" onclick="backToMenu()">✕ В меню</button>
      </div>
    </div>
    <div class="question-text" id="questionText"></div>
    <div class="options-list" id="optionsList"></div>
    <div class="explanation-box" id="explanationBox">
      <div id="explanationText"></div>
      <span class="source-tag" id="sourceText"></span>
    </div>
    <div class="quiz-footer">
      <span id="scoreBadge" style="font-weight:700;color:var(--primary);">Верно: 0</span>
      <button class="btn btn-primary" id="nextBtn" style="display:none;" onclick="nextQuestion()">Следующий вопрос ➡</button>
    </div>
  </div>

  <div class="result-box" id="resultView" style="text-align:center;">
    <h2 style="color:var(--primary);margin-top:0;">Тест завершён!</h2>
    <p id="resultSummary" style="font-size:1.1rem;font-weight:600;"></p>
    <p id="resultComment" style="color:var(--muted);"></p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;">
      <button class="btn btn-primary" onclick="retryQuiz()">🔄 Пройти заново</button>
      <button class="btn btn-soft" onclick="backToMenu()">К списку глав</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="cheatModal" onclick="if(event.target===this)closeCheatsheet()">
  <div class="modal-card">
    <div class="modal-header">
      <h2 id="modalTitle">📖 Конспект-шпаргалка</h2>
      <button class="nav-btn" onclick="closeCheatsheet()">✕ Закрыть</button>
    </div>
    <div class="cheat-body" id="modalBody"></div>
  </div>
</div>

<script>
  window.FIQH_DATA = { cheatsheets: {}, questions: [] };
</script>
<script src="adab_part1.js?v=2"></script>
<script src="adab_part2.js?v=2"></script>
<script src="adab_part3a.js?v=2"></script>
<script src="adab_part3b.js?v=2"></script>

<script>
  const CHAPTERS = [
    "Глава 1. Искренность (Ихляс) и работа над сердцем",
    "Глава 2. Адаб по отношению к Аллаху и Корану",
    "Глава 3. Адаб к Пророку ﷺ и обладателям знания",
    "Глава 4. Благочестие к родителям и родственные связи",
    "Глава 5. Адаб в семье: супруги и воспитание детей",
    "Глава 6. Адаб с соседями, гостями и друзьями",
    "Глава 7. Культура речи и хранение языка",
    "Глава 8. Этикет приветствия, собраний и общения",
    "Глава 9. Адаб еды, питья, сна и внешнего вида",
    "Глава 10. Адаб мечети, дороги и общественных мест"
  ];

  // Сохраняем ?id=... при возврате в каталог
  (function syncBackLink() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    if (id) {
      document.getElementById("backHomeBtn").href = "../index.html?id=" + encodeURIComponent(id);
    }
  })();

  if (localStorage.getItem("madrasah_theme") === "dark") {
    document.body.classList.add("dark");
  }

  function toggleDark() {
    document.body.classList.toggle("dark");
    localStorage.setItem("madrasah_theme", document.body.classList.contains("dark") ? "dark" : "light");
  }

  function getProgress() {
    try {
      return JSON.parse(localStorage.getItem("adab_progress_v1") || "{}");
    } catch (e) {
      return {};
    }
  }

  function saveProgress(chapter, pct) {
    const prog = getProgress();
    if (!prog[chapter] || pct > prog[chapter]) {
      prog[chapter] = pct;
      localStorage.setItem("adab_progress_v1", JSON.stringify(prog));
    }
  }

  function renderChapters() {
    const data = window.FIQH_DATA || { cheatsheets: {}, questions: [] };
    const listEl = document.getElementById("chapterList");
    const prog = getProgress();
    listEl.innerHTML = "";

    document.getElementById("totalStats").innerText =
      `10 глав • ${Object.keys(data.cheatsheets).length} шпаргалок • ${data.questions.length} вопросов`;

    CHAPTERS.forEach((ch) => {
      const qCount = data.questions.filter(q => q.chapter === ch).length;
      const hasCheat = Boolean(data.cheatsheets[ch]);
      const best = prog[ch] !== undefined ? ` • Лучший результат: ${prog[ch]}%` : "";

      const card = document.createElement("div");
      card.className = "chapter-card";
      card.innerHTML = `
        <div class="chapter-info">
          <div class="chapter-title">${ch}</div>
          <div class="chapter-meta">Вопросов: ${qCount}${best}</div>
        </div>
        <div class="chapter-actions">
          ${hasCheat ? `<button class="btn btn-soft" onclick="openCheatsheet('${ch.replace(/'/g, "\'")}')">📖 Шпаргалка</button>` : ""}
          <button class="btn btn-primary" onclick="startChapter('${ch.replace(/'/g, "\'")}')">Тест ➡</button>
        </div>
      `;
      listEl.appendChild(card);
    });
  }

  function openCheatsheet(chapter) {
    const data = window.FIQH_DATA || { cheatsheets: {} };
    const html = data.cheatsheets[chapter];
    if (!html) return;
    document.getElementById("modalTitle").innerText = "📖 " + chapter;
    document.getElementById("modalBody").innerHTML = html;
    document.getElementById("cheatModal").style.display = "flex";
  }

  function closeCheatsheet() {
    document.getElementById("cheatModal").style.display = "none";
  }

  let activeQuestions = [];
  let activeChapter = null;
  let qIndex = 0;
  let score = 0;

  function startChapter(chapter) {
    const all = (window.FIQH_DATA && window.FIQH_DATA.questions) || [];
    const filtered = all.filter(q => q.chapter === chapter);
    if (!filtered.length) {
      alert("Вопросы для этой главы загружаются. Обновите страницу.");
      return;
    }
    activeChapter = chapter;
    activeQuestions = [...filtered].sort(() => Math.random() - 0.5);
    qIndex = 0;
    score = 0;
    document.getElementById("inQuizCheatBtn").style.display =
      window.FIQH_DATA.cheatsheets[chapter] ? "inline-block" : "none";
    showQuizView();
    renderQuestion();
  }

  function startFinalExam() {
    const all = (window.FIQH_DATA && window.FIQH_DATA.questions) || [];
    if (!all.length) return;
    activeChapter = null;
    activeQuestions = [...all].sort(() => Math.random() - 0.5).slice(0, 40);
    qIndex = 0;
    score = 0;
    document.getElementById("inQuizCheatBtn").style.display = "none";
    showQuizView();
    renderQuestion();
  }

  function openCurrentCheatsheet() {
    if (activeChapter) openCheatsheet(activeChapter);
  }

  function showQuizView() {
    document.getElementById("menuView").style.display = "none";
    document.getElementById("resultView").style.display = "none";
    document.getElementById("quizView").style.display = "block";
  }

  function renderQuestion() {
    const q = activeQuestions[qIndex];
    document.getElementById("quizProgress").innerText =
      `Вопрос ${qIndex + 1} из ${activeQuestions.length}`;
    document.getElementById("scoreBadge").innerText = `Верно: ${score}`;
    document.getElementById("questionText").innerText = q.question;

    const optsEl = document.getElementById("optionsList");
    optsEl.innerHTML = "";
    document.getElementById("explanationBox").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";

    q.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = opt;
      btn.onclick = () => selectAnswer(idx, btn);
      optsEl.appendChild(btn);
    });
  }

  function selectAnswer(idx, btn) {
    const q = activeQuestions[qIndex];
    const buttons = document.querySelectorAll("#optionsList .option-btn");
    buttons.forEach(b => b.disabled = true);

    if (idx === q.correct) {
      btn.classList.add("correct");
      score++;
    } else {
      btn.classList.add("wrong");
      if (buttons[q.correct]) buttons[q.correct].classList.add("correct");
    }

    document.getElementById("scoreBadge").innerText = `Верно: ${score}`;
    document.getElementById("explanationText").innerText = q.explanation || "";
    document.getElementById("sourceText").innerText = q.source ? ("Источник: " + q.source) : "";
    document.getElementById("explanationBox").style.display = "block";

    const nextBtn = document.getElementById("nextBtn");
    nextBtn.style.display = "inline-block";
    nextBtn.innerText = qIndex === activeQuestions.length - 1 ? "Завершить 🏁" : "Следующий вопрос ➡";
  }

  function nextQuestion() {
    qIndex++;
    if (qIndex < activeQuestions.length) {
      renderQuestion();
    } else {
      finishQuiz();
    }
  }

  function finishQuiz() {
    document.getElementById("quizView").style.display = "none";
    document.getElementById("resultView").style.display = "block";
    const pct = Math.round((score / activeQuestions.length) * 100);
    if (activeChapter) {
      saveProgress(activeChapter, pct);
    }
    document.getElementById("resultSummary").innerText =
      `Ваш результат: ${score} из ${activeQuestions.length} (${pct}%)`;
    let comment = "Рекомендуем ещё раз прочитать конспект-шпаргалку и повторить тест.";
    if (pct === 100) comment = "МашаАллах! Безупречный результат!";
    else if (pct >= 80) comment = "Отличный уровень знаний! Пусть Аллах приумножит благое.";
    else if (pct >= 60) comment = "Хороший результат, но стоит закрепить сложные моменты по шпаргалке.";
    document.getElementById("resultComment").innerText = comment;
  }

  function retryQuiz() {
    if (activeChapter) startChapter(activeChapter);
    else startFinalExam();
  }

  function backToMenu() {
    document.getElementById("quizView").style.display = "none";
    document.getElementById("resultView").style.display = "none";
    document.getElementById("menuView").style.display = "block";
    renderChapters();
  }

  document.addEventListener("DOMContentLoaded", renderChapters);
</script>
</body>
</html>
