<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Библиотека тренажёров</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="auth.js"></script>
  <style>
    :root {
      --bg: #f4efe6;
      --card: #ffffff;
      --primary: #15603e;
      --primary-dark: #0e462d;
      --primary-light: #e7f2eb;
      --accent: #b89535;
      --text: #1b2e24;
      --muted: #52695c;
      --border: #cfe0d5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px 14px 40px;
    }
    .container { max-width: 720px; margin: 0 auto; }
    .header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #ffffff;
      padding: 24px 20px;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 18px;
      border-bottom: 4px solid var(--accent);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }
    .header h1 { font-size: 1.5rem; margin-bottom: 6px; }
    .header p { font-size: 0.95rem; opacity: 0.9; }
    .id-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .id-info { font-size: 0.92rem; color: var(--muted); }
    .id-value {
      font-family: monospace;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      padding: 3px 10px;
      border-radius: 6px;
    }
    .copy-btn {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }
    .copy-btn:hover { background: var(--primary-dark); }
    .courses-list { display: flex; flex-direction: column; gap: 14px; }
    .course-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      transition: transform 0.15s, border-color 0.15s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .course-card.unlocked:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .course-card.locked {
      background: #f8f7f4;
      border-color: #dcd7cc;
      opacity: 0.92;
    }
    .course-info h2 { font-size: 1.15rem; color: var(--text); margin-bottom: 4px; }
    .course-info p { font-size: 0.92rem; color: var(--muted); }
    .course-action { flex-shrink: 0; }
    .btn-open {
      display: inline-block;
      text-decoration: none;
      background: var(--primary);
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.92rem;
    }
    .btn-open:hover { background: var(--primary-dark); }
    .badge-locked {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #ebe7de;
      color: #6b6456;
      border: 1px solid #d5cfc2;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
    }
    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .footer-note a { color: var(--primary); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Учебные тренажёры</h1>
    <p>Интерактивные курсы для заучивания и проверки знаний</p>
  </div>

  <div class="id-card">
    <div class="id-info">Ваш персональный ID: <span class="id-value" id="userIdDisplay">Определение...</span></div>
    <button class="copy-btn" onclick="copyUserId()">📋 Скопировать ID</button>
  </div>

  <div class="courses-list" id="coursesList"></div>

  <div class="footer-note" id="adminFooter"></div>
</div>

<script>
  const COURSES = [
    {
      code: "sira",
      title: "Сира Пророка Мухаммада ﷺ",
      desc: "7 интерактивных модулей, 190 вопросов и шпаргалки по жизнеописанию Посланника Аллаха ﷺ.",
      url: "sira/index.html"
    },
    {
      code: "nawawi",
      title: "40 хадисов Ан-Науауи",
      desc: "4 главы с огласованным арабским текстом, транскрипцией, переводом, озвучкой и скрытием слов.",
      url: "nawawi/index.html"
    }
  ];

  const userId = (typeof getCurrentTelegramId === "function") ? getCurrentTelegramId() : "";
  document.getElementById("userIdDisplay").textContent = userId || "не определён";

  function copyUserId() {
    if (!userId) {
      alert("Откройте приложение через Telegram-бот, чтобы получить ваш ID.");
      return;
    }
    navigator.clipboard.writeText(String(userId)).then(() => {
      alert("ID скопирован: " + userId);
    }).catch(() => {
      prompt("Скопируйте ваш ID:", userId);
    });
  }

  function renderCourses() {
    const list = document.getElementById("coursesList");
    list.innerHTML = "";
    const contact = (typeof ADMIN_CONTACT !== "undefined") ? ADMIN_CONTACT : "";

    COURSES.forEach(course => {
      const allowed = (typeof hasAccess === "function") ? hasAccess(userId, course.code) : false;
      const card = document.createElement("div");
      card.className = "course-card " + (allowed ? "unlocked" : "locked");

      const targetUrl = userId ? `${course.url}?id=${encodeURIComponent(userId)}` : course.url;

      card.innerHTML = `
        <div class="course-info">
          <h2>${course.title}</h2>
          <p>${course.desc}</p>
        </div>
        <div class="course-action">
          ${allowed
            ? `<a href="${targetUrl}" class="btn-open">Открыть →</a>`
            : `<button class="badge-locked" onclick="requestAccess('${course.title}')" title="Доступ закрыт">🔒 Закрыто</button>`
          }
        </div>
      `;
      list.appendChild(card);
    });

    if (contact) {
      document.getElementById("adminFooter").innerHTML = `Для получения доступа отправьте ваш ID: <a href="https://t.me/${contact.replace('@', '')}" target="_blank">${contact}</a>`;
    }
  }

  function requestAccess(courseTitle) {
    const contact = (typeof ADMIN_CONTACT !== "undefined") ? ADMIN_CONTACT : "администратору";
    alert(`Курс «${courseTitle}» пока закрыт 🔒.\n\nСкопируйте ваш ID (${userId || "из бота"}) и отправьте ${contact} для открытия доступа.`);
  }

  renderCourses();
</script>
</body>
</html>
