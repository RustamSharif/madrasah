<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека исламских тренажёров</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        document.write('<script src="auth.js?v=' + Date.now() + '"><\/script>');
    </script>
    <style>
        :root {
            --primary: #1b5e20;
            --primary-dark: #124116;
            --primary-light: #e8f2e9;
            --accent: #b89535;
            --bg-base: #b5b8b4;
            --card-bg: #d4d6d2;
            --item-bg: #e2e4e0;
            --text: #1a1d1a;
            --muted: #4a4f4a;
            --border: #9ea39d;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 17px;
            line-height: 1.55;
            color: var(--text);
            margin: 0;
            padding: 18px 14px;
            background-color: var(--bg-base);
        }
        .container { max-width: 780px; margin: 0 auto; }
        .header {
            background: linear-gradient(135deg, #124116, #1b5e20);
            color: #f4f6f4;
            padding: 26px 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 18px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16);
            border-bottom: 5px solid var(--accent);
        }
        .header h1 { margin: 0 0 8px 0; font-size: 1.65rem; line-height: 1.3; }
        .header p { margin: 0; font-size: 0.98rem; opacity: 0.92; }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.09);
            border: 1px solid var(--border);
            margin-bottom: 18px;
        }
        .id-panel {
            background: var(--item-bg);
            border: 1px dashed var(--primary);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .id-label { font-size: 0.85rem; color: var(--muted); }
        .id-value { font-size: 1.15rem; font-weight: 800; color: var(--primary); letter-spacing: 0.5px; }
        .copy-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 9px 14px;
            border-radius: 9px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }
        .copy-btn:hover { background: var(--primary-dark); }
        .trial-banner {
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 18px;
            display: none;
        }
        .trial-banner.available {
            background: #fff8e1;
            border: 2px solid #d4af37;
            color: #4a3500;
        }
        .trial-banner.active {
            background: #e3f2fd;
            border: 2px solid #2196f3;
            color: #0d3c61;
        }
        .trial-banner.expired {
            background: #fbe9e7;
            border: 1px solid #e57373;
            color: #7f1d1d;
        }
        .trial-title { font-weight: 800; font-size: 1.05rem; margin-bottom: 4px; }
        .trial-desc { font-size: 0.92rem; margin-bottom: 12px; line-height: 1.45; }
        .trial-btn {
            background: #b89535;
            color: #fff;
            border: none;
            padding: 11px 18px;
            border-radius: 10px;
            font-size: 0.96rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }
        .trial-btn:hover { background: #9e7e28; }
        .courses-grid { display: flex; flex-direction: column; gap: 14px; }
        .course-card {
            background: var(--item-bg);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 16px 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            transition: transform 0.15s, border-color 0.15s;
        }
        .course-card.unlocked:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        .course-info { flex: 1; min-width: 230px; }
        .course-title { font-size: 1.12rem; font-weight: 700; margin: 0 0 5px 0; color: #143617; }
        .course-desc { font-size: 0.92rem; color: var(--muted); margin: 0; }
        .course-action {
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .course-action.open {
            background: var(--primary);
            color: #fff;
        }
        .course-action.open:hover { background: var(--primary-dark); }
        .course-action.locked {
            background: #cfd2ce;
            color: #555a55;
            border: 1px solid #aeb3ad;
            cursor: default;
        }
        .footer-note {
            text-align: center;
            font-size: 0.88rem;
            color: var(--muted);
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Библиотека тренажёров</h1>
        <p>Интерактивные курсы для изучения и повторения исламских наук</p>
    </div>

    <div class="card">
        <div class="id-panel">
            <div>
                <div class="id-label">Ваш персональный ID в системе:</div>
                <div class="id-value" id="user-id-display">Определяется...</div>
            </div>
            <button class="copy-btn" id="copy-id-btn" onclick="copyUserId()">📋 Скопировать ID</button>
        </div>

        <!-- Плашка пробного доступа на 24 часа -->
        <div class="trial-banner" id="trial-banner"></div>

        <div class="courses-grid" id="courses-grid"></div>

        <div class="footer-note" id="admin-note"></div>
    </div>
</div>

<script>
    const COURSES = [
        {
            code: "sira",
            title: "🕌 Сира Пророка Мухаммада ﷺ",
            desc: "Хронологический курс, тематические модули, шпаргалки и 190 тестовых вопросов.",
            url: "sira/index.html"
        },
        {
            code: "nawawi",
            title: "📖 40 хадисов имама Ан-Науауи",
            desc: "Огласованный арабский текст, транскрипция, перевод, аудиочтец и заучивание со скрытием слов.",
            url: "nawawi/index.html"
        },
        {
            code: "fiqh",
            title: "⚖️ Фикх аль-Ибада (Мухтасар аль-Кудури)",
            desc: "16 глав по ханафитскому мазхабу, конспекты-шпаргалки и 240 тестовых вопросов.",
            url: "fiqh/index.html"
        }
    ];

    let detectedUserId = null;

    function initCatalog() {
        detectedUserId = typeof getCurrentTelegramId === "function" ? getCurrentTelegramId() : null;
        const idDisplay = document.getElementById("user-id-display");
        const copyBtn = document.getElementById("copy-id-btn");

        if (detectedUserId) {
            idDisplay.textContent = detectedUserId;
        } else {
            idDisplay.textContent = "Откройте через Telegram-бот";
            copyBtn.style.display = "none";
        }

        const adminContact = typeof ADMIN_CONTACT !== "undefined" ? ADMIN_CONTACT : "@Rustam_abu_Aisha";
        document.getElementById("admin-note").innerHTML =
            `Для получения бессрочного доступа отправьте ваш ID администратору: <strong>${adminContact}</strong>`;

        renderTrialBanner();
        renderCourses();
    }

    function renderTrialBanner() {
        const banner = document.getElementById("trial-banner");
        if (typeof hasPermanentOrManualAccess !== "function" || typeof getTrialStatus !== "function") {
            return;
        }

        // Проверяем, есть ли уже постоянный доступ ко всем курсам
        const hasAllPermanent = COURSES.every(c => hasPermanentOrManualAccess(detectedUserId, c.code));
        if (hasAllPermanent) {
            banner.style.display = "none";
            return;
        }

        const trial = getTrialStatus(detectedUserId);
        banner.style.display = "block";

        if (trial.state === "available") {
            banner.className = "trial-banner available";
            banner.innerHTML = `
                <div class="trial-title">🎁 Бесплатный тест-драйв на 24 часа</div>
                <div class="trial-desc">Хотите сначала посмотреть все тренажёры изнутри? Активируйте полный пробный доступ на 1 сутки без ограничений.</div>
                <button class="trial-btn" onclick="activateTrial('${detectedUserId || ""}')">Попробовать бесплатно 24 часа →</button>
            `;
        } else if (trial.state === "active") {
            const leftStr = typeof formatRemainingTime === "function" ? formatRemainingTime(trial.remainingMs) : "менее 24 ч";
            banner.className = "trial-banner active";
            banner.innerHTML = `
                <div class="trial-title">⏳ Активен пробный доступ ко всем тренажёрам</div>
                <div class="trial-desc" style="margin-bottom:0;">Осталось времени: <strong>${leftStr}</strong>. Оцените курсы и при желании напишите администратору для открытия постоянного доступа.</div>
            `;
        } else {
            banner.className = "trial-banner expired";
            banner.innerHTML = `
                <div class="trial-title">⌛ Пробный период (24 часа) завершён</div>
                <div class="trial-desc" style="margin-bottom:0;">Чтобы продолжить обучение без ограничений, скопируйте свой ID выше и отправьте его администратору.</div>
            `;
        }
    }

    function renderCourses() {
        const grid = document.getElementById("courses-grid");
        grid.innerHTML = COURSES.map(course => {
            const unlocked = typeof hasAccess === "function" ? hasAccess(detectedUserId, course.code) : false;
            const linkUrl = detectedUserId ? `${course.url}?id=${encodeURIComponent(detectedUserId)}` : course.url;

            return `
                <div class="course-card ${unlocked ? "unlocked" : ""}">
                    <div class="course-info">
                        <div class="course-title">${course.title}</div>
                        <p class="course-desc">${course.desc}</p>
                    </div>
                    ${unlocked
                        ? `<a href="${linkUrl}" class="course-action open">Открыть →</a>`
                        : `<span class="course-action locked">🔒 Закрыто</span>`
                    }
                </div>
            `;
        }).join("");
    }

    function copyUserId() {
        if (!detectedUserId) return;
        navigator.clipboard.writeText(detectedUserId).then(() => {
            const btn = document.getElementById("copy-id-btn");
            const old = btn.textContent;
            btn.textContent = "Скопировано ✓";
            setTimeout(() => { btn.textContent = old; }, 2000);
        });
    }

    window.addEventListener("DOMContentLoaded", initCatalog);
</script>
</body>
</html>
