<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Медресе «Галия» — Интерактивные тренажёры</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // Динамический сброс кэша auth.js для мобильного Telegram
    document.write('<script src="auth.js?v=' + Date.now() + '"><\/script>');
  </script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 14px 14px 32px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      color: #1e293b;
      background-color: #f6f3eb;
      background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%230d6e4e' stroke-width='0.8' stroke-opacity='0.08'%3E%3Cpath d='M40 0L49.5 14.5L66.5 13.5L65.5 30.5L80 40L65.5 49.5L66.5 66.5L49.5 65.5L40 80L30.5 65.5L13.5 66.5L14.5 49.5L0 40L14.5 30.5L13.5 13.5L30.5 14.5Z'/%3E%3Ccircle cx='40' cy='40' r='14'/%3E%3Cpath d='M40 20L45 35L60 40L45 45L40 60L35 45L20 40L35 35Z'/%3E%3C/g%3E%3C/svg%3E");
    }
    .container {
      max-width: 540px;
      margin: 0 auto;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }
    .id-info {
      color: #334155;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .copy-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .copy-btn:active { transform: scale(0.97); }

    .hero-card {
      background: linear-gradient(135deg, #0d6e4e 0%, #09523a 100%);
      color: #ffffff;
      border-radius: 18px;
      padding: 20px 18px;
      text-align: center;
      box-shadow: 0 10px 24px rgba(13, 110, 78, 0.22);
      margin-bottom: 10px;
      position: relative;
      overflow: hidden;
    }
    .arabic-bismillah {
      font-family: "Traditional Arabic", "Amiri", "Scheherazade New", serif;
      font-size: 21px;
      color: #fde68a;
      margin-bottom: 4px;
      line-height: 1.4;
    }
    .arabic-salam {
      font-family: "Traditional Arabic", "Amiri", "Scheherazade New", serif;
      font-size: 23px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .hero-title {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .hero-subtitle {
      margin: 0;
      font-size: 13px;
      color: #d1fae5;
      line-height: 1.45;
    }

    /* Компактная плашка триала под зелёным баннером */
    .trial-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-radius: 12px;
      padding: 9px 12px;
      margin-bottom: 14px;
      font-size: 12px;
      line-height: 1.35;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }
    .trial-strip.available {
      background: #fffbeb;
      border: 1px solid #fde68a;
      color: #92400e;
    }
    .trial-strip.active {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
      font-weight: 600;
    }
    .trial-strip.expired {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }
    .trial-btn {
      background: #d97706;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .trial-btn:active { transform: scale(0.97); }

    /* Резервный вход в обычном браузере */
    .browser-login {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 14px;
      display: none;
    }
    .browser-login-title {
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .browser-login-row {
      display: flex;
      gap: 8px;
    }
    .browser-login input {
      flex: 1;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
      outline: none;
    }
    .browser-login button {
      background: #0d6e4e;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .courses-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .course-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 13px 14px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.04);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      cursor: pointer;
    }
    .course-card:active {
      transform: scale(0.985);
    }
    .course-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .course-body {
      flex: 1;
      min-width: 0;
    }
    .course-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 3px;
      line-height: 1.3;
    }
    .course-meta {
      font-size: 12px;
      color: #64748b;
      margin: 0;
      line-height: 1.35;
    }
    .course-arrow {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #f1f5f9;
      color: #0d6e4e;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .course-card.locked .course-arrow {
      background: #fef2f2;
      color: #dc2626;
    }
    .course-card.locked {
      opacity: 0.92;
    }

    /* Всплывающее уведомление */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      z-index: 10000;
      display: none;
      max-width: 90%;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Верхняя панель с ID -->
    <div class="top-bar">
      <div class="id-info">Ваш ID: <strong id="userIdDisplay">определяется...</strong></div>
      <button class="copy-btn" onclick="copyUserId()">📋 Скопировать ID</button>
    </div>

    <!-- Зелёный баннер приветствия -->
    <div class="hero-card">
      <div class="arabic-bismillah" dir="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
      <div class="arabic-salam" dir="rtl">السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ</div>
      <h1 class="hero-title">Интерактивная библиотека знаний</h1>
      <p class="hero-subtitle">Учебные конспекты-шпаргалки и проверочные тесты по основным исламским дисциплинам</p>
    </div>

    <!-- Компактная строка триал-доступа под зелёным баннером -->
    <div id="trialStrip" class="trial-strip available" style="display:none;"></div>

    <!-- Резервный вход в обычном браузере без Telegram -->
    <div id="browserLoginBox" class="browser-login">
      <div class="browser-login-title">🌐 Вход через браузер (без Telegram и VPN)</div>
      <div class="browser-login-row">
        <input type="text" id="manualUidInput" placeholder="Введите ваш ID доступа" />
        <button onclick="applyManualUid()">Войти</button>
      </div>
    </div>

    <!-- Список 6 курсов -->
    <div class="courses-list" id="coursesList"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const COURSES = [
      {
        code: "sira",
        num: "1",
        title: "Сира Пророка ﷺ",
        meta: "Жизнеописание Посланника Аллаха ﷺ • 7 глав • 105 вопросов",
        url: "sira/index.html",
        icon: "🕌",
        bg: "#ecfdf5"
      },
      {
        code: "nawawi",
        num: "2",
        title: "40 хадисов Ан-Науауи",
        meta: "Сборник имама Ан-Науауи • Карточки, разбор и тесты",
        url: "nawawi/index.html",
        icon: "📜",
        bg: "#eff6ff"
      },
      {
        code: "fiqh",
        num: "3",
        title: "Фикх аль-Ибада",
        meta: "По книге «Мухтасар аль-Кудури» • 16 глав • 240 вопросов",
        url: "fiqh/index.html",
        icon: "⚖️",
        bg: "#fefce8"
      },
      {
        code: "tajweed",
        num: "4",
        title: "Таджвид",
        meta: "Правила чтения Корана (Хафс ан Асым) • 10 глав • 150 вопросов",
        url: "tajweed/index.html",
        icon: "📖",
        bg: "#f0fdf4"
      },
      {
        code: "adab",
        num: "5",
        title: "Адаб и Ахляк",
        meta: "Исламская этика и нравственность • 10 глав • 150 вопросов",
        url: "adab/index.html",
        icon: "🌿",
        bg: "#f5f3ff"
      },
      {
        code: "aqeedah",
        num: "6",
        title: "Акыда",
        meta: "Основы вероубеждения (хадис Джибрииля) • 10 глав • 150 вопросов",
        url: "aqeedah/index.html",
        icon: "🧭",
        bg: "#fff7ed"
      }
    ];

    const ARROW_SVG = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>`;
    const LOCK_SVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`;

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { t.style.display = "none"; }, 2800);
    }

    function copyUserId() {
      const uid = window.MadrasahAuth ? window.MadrasahAuth.getUserId() : "guest";
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(uid).then(() => showToast("ID скопирован: " + uid));
      } else {
        showToast("Ваш ID: " + uid);
      }
    }

    function applyManualUid() {
      const val = document.getElementById("manualUidInput").value.trim();
      if (!val) {
        showToast("Введите ваш ID");
        return;
      }
      window.MadrasahAuth.setManualUserId(val);
      renderUI();
      showToast("ID применён: " + val);
    }

    function activateTrialClick() {
      if (!window.MadrasahAuth) return;
      window.MadrasahAuth.startTrial24h();
      renderUI();
      showToast("Пробный доступ на 24 часа активирован!");
    }

    function openCourse(course) {
      const uid = window.MadrasahAuth.getUserId();
      const allowed = window.MadrasahAuth.hasCourseAccess(course.code);
      if (allowed) {
        window.location.href = course.url + "?uid=" + encodeURIComponent(uid);
        return;
      }
      const trial = window.MadrasahAuth.getTrialState(uid);
      if (trial.status === "available") {
        if (confirm("Этот курс закрыт. Хотите включить бесплатный пробный доступ на 24 часа ко всем 6 курсам прямо сейчас?")) {
          activateTrialClick();
        }
      } else {
        showToast("Доступ закрыт. Отправьте ваш ID (" + uid + ") администратору.");
      }
    }

    function renderTrialStrip() {
      if (!window.MadrasahAuth) return;
      const uid = window.MadrasahAuth.getUserId();
      const strip = document.getElementById("trialStrip");

      // Если у пользователя постоянный доступ ко всем курсам — скрываем плашку
      if (window.MadrasahAuth.hasPermanentCourseAccess(uid, null)) {
        strip.style.display = "none";
        return;
      }

      const trial = window.MadrasahAuth.getTrialState(uid);
      strip.style.display = "flex";

      if (trial.status === "available") {
        strip.className = "trial-strip available";
        strip.innerHTML = `
          <span>🎁 <strong>Пробный доступ 24 ч:</strong> оцените все 6 курсов бесплатно</span>
          <button class="trial-btn" onclick="activateTrialClick()">Включить 24 ч →</button>
        `;
      } else if (trial.status === "active") {
        strip.className = "trial-strip active";
        strip.innerHTML = `
          <span>⏳ <strong>Пробный доступ активен</strong> • Осталось: ${window.MadrasahAuth.formatDuration(trial.remainingMs)}</span>
        `;
      } else {
        strip.className = "trial-strip expired";
        strip.innerHTML = `
          <span>⌛ Пробный период (24 ч) завершён. Для постоянного доступа отправьте ваш ID администратору.</span>
        `;
      }
    }

    function renderUI() {
      if (!window.MadrasahAuth) return;
      const uid = window.MadrasahAuth.getUserId();
      document.getElementById("userIdDisplay").textContent = uid;

      // Показываем форму ввода ID только если открыто в обычном браузере вне Telegram
      const browserBox = document.getElementById("browserLoginBox");
      if (!window.MadrasahAuth.isTelegramEnv()) {
        browserBox.style.display = "block";
      } else {
        browserBox.style.display = "none";
      }

      renderTrialStrip();

      const listEl = document.getElementById("coursesList");
      listEl.innerHTML = "";

      COURSES.forEach((course) => {
        const unlocked = window.MadrasahAuth.hasCourseAccess(course.code);
        const card = document.createElement("div");
        card.className = "course-card" + (unlocked ? "" : " locked");
        card.onclick = () => openCourse(course);

        card.innerHTML = `
          <div class="course-icon" style="background:${course.bg};">${course.icon}</div>
          <div class="course-body">
            <h3 class="course-title">${course.num}. ${course.title}</h3>
            <p class="course-meta">${course.meta}</p>
          </div>
          <div class="course-arrow">${unlocked ? ARROW_SVG : LOCK_SVG}</div>
        `;
        listEl.appendChild(card);
      });
    }

    window.onMadrasahAuthUpdate = renderUI;

    document.addEventListener("DOMContentLoaded", () => {
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }
      } catch (e) {}

      renderUI();
      setInterval(renderTrialStrip, 1000);
    });
  </script>
</body>
</html>
