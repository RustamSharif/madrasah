<!DOCTYPE html>

  <style>

    .top-nav {

      border: 1px solid #8FA695;

      text-decoration: none;
      cursor: pointer;
    }

    .header {
      background: linear-gradient(145deg, #1F523F 0%, #183E30 100%);
      color: #F4F7F4;
      padding: 22px 18px;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 20px;
      border: 1px solid #48735E;

    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 21px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.3;
    }

    .header p {
      margin: 0 0 14px;
      font-size: 13.5px;
      color: #D2E2D8;
      line-height: 1.45;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stat-pill {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.24);
      color: #F4F7F4;
      padding: 5px 12px;
      border-radius: 20px;

      font-weight: 600;
    }

    .group-title {
      margin: 18px 2px 10px;
      font-size: 12.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #D7E2D9;
    }

    .modules-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .module-card {
      background: #E5ECE6;
      border: 1px solid #8FA695;
      border-radius: 15px;
      padding: 16px;
      box-shadow: 0 3px 10px rgba(14, 22, 17, 0.16);
    }

    .module-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .module-badge {
      display: inline-block;
      background: #1F523F;
      color: #F4F7F4;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 20px;

    .module-badge.extra {
      background: #4E5D30;
    }

    .module-badge.final {
      background: #6E352C;
    }

    .best-score {
      font-size: 12px;
      font-weight: 700;
      color: #1F523F;
      background: #D2E0D5;

    }

    .module-title {
      margin: 0 0 5px;
      font-size: 16.5px;
      font-weight: 700;
      color: #16241B;
      line-height: 1.35;
    }

    .module-desc {
      margin: 0 0 14px;
      font-size: 13.5px;
      color: #435749;
      line-height: 1.45;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-cheat, .btn-test {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 700;

    }

    .btn-cheat {

    /* Панель шпаргалки и теста */
    .panel-card {

    .progress-wrap {

    .btn-primary {

    .btn-secondary {

      background: #DCE5DD;
      color: #1A281F;

      border-radius: 10px;

    .hidden { display: none !important; }

  <!-- Универсальные приёмники до загрузки модулей -->
  <script>
    window.SIRA_MODULES = window.SIRA_MODULES || {};
    window.SIRA_DATA = window.SIRA_DATA || {};
    window.SIRA_CHAPTERS = window.SIRA_CHAPTERS || {};
    window.registerSiraModule = function (key, data) {
      if (typeof key === "object" && key !== null) {
        const k = key.num || key.id || (Object.keys(window.SIRA_MODULES).length + 1);
        window.SIRA_MODULES[k] = key;
      } else {
        window.SIRA_MODULES[key] = data;
      }
    };
  </script>

  <!-- Подключение всех 7 модулей с принудительным сбросом кэша -->
  <script src="sira_m1.js?v=20261126"></script>
  <script src="sira_m2.js?v=20261126"></script>
  <script src="sira_m3.js?v=20261126"></script>
  <script src="sira_m4.js?v=20261126"></script>
  <script src="sira_m5.js?v=20261126"></script>
  <script src="sira_m6.js?v=20261126"></script>
  <script src="sira_m7.js?v=20261126"></script>

  <script>
    if (typeof protectCoursePage === "function") {
      protectCoursePage("sira");
    }

    const FALLBACK_META = {
      1: {
        section: "main",
        badge: "Часть 1",
        title: "Доисламский период и семья Пророка ﷺ",
        desc: "Родословная до 6-го колена, дяди и тёти, кормилицы, молочные братья и сёстры, Зам-зам и Год Слона."
      },
      2: {
        section: "main",
        badge: "Часть 2",
        title: "От рождения до начала пророчества",
        desc: "Детство в Бану Са'д, сиротство, встреча с Бахирой, Союз благородных, брак с Хадиджей, перестройка Каабы и пещера Хира."
      },
      3: {
        section: "main",
        badge: "Часть 3",
        title: "Мекканский период (13 лет пророчества)",
        desc: "Первые откровения, тайный и открытый призыв, Эфиопия, бойкот, Год скорби, Таиф, Исра и Мирадж, присяги при Акабе."
      },
      4: {
        section: "main",
        badge: "Часть 4",
        title: "Мединский период и кончина Пророка ﷺ",
        desc: "Хиджра, устройство общины, Бадр, Ухуд, Хандак, Худайбия, Хайбар, Открытие Мекки, Табук, Прощальный хадж и кончина ﷺ."
      },
      5: {
        section: "extra",
        badge: "Доп. тест 1",
        title: "Семья Пророка ﷺ: жёны, дети, внуки и домочадцы",
        desc: "Все 11 Матерей правоверных, 3 сына и 4 дочери, внуки аль-Хасан и аль-Хусайн, Ахль аль-Байт."
      },
      6: {
        section: "extra",
        badge: "Доп. тест 2",
        title: "Выдающиеся сподвижники и сподвижницы",
        desc: "10 обрадованных Раем, почётные титулы сахабов, писцы откровения, великие ансары и сподвижницы."
      },
      7: {
        section: "final",
        badge: "Итоговый экзамен",
        title: "Общий зачёт по всему курсу Сиры ﷺ",
        desc: "Сводная проверка знаний по всем хронологическим этапам, семье Пророка ﷺ и сподвижникам."
      }
    };

    function extractAllModules() {
      const rawMap = {};

      function absorb(source) {
        if (!source) return;
        if (Array.isArray(source)) {
          source.forEach((item, idx) => {
            if (item && typeof item === "object") {
              const num = parseInt(String(item.num || item.id || (idx + 1)).replace(/\D/g, ""), 10) || (idx + 1);
              rawMap[num] = item;
            }
          });
        } else if (typeof source === "object") {
          Object.keys(source).forEach((k) => {
            const item = source[k];
            if (item && typeof item === "object") {
              const num = parseInt(String(k).replace(/\D/g, ""), 10) ||
                          parseInt(String(item.num || item.id || "0").replace(/\D/g, ""), 10);
              if (num >= 1 && num <= 7) {
                rawMap[num] = item;
              }
            }
          });
        }
      }

      absorb(window.SIRA_MODULES);
      absorb(window.SIRA_DATA);
      absorb(window.SIRA_DATA && window.SIRA_DATA.modules);
      absorb(window.SIRA_DATA && window.SIRA_DATA.chapters);
      absorb(window.SIRA_CHAPTERS);
      absorb(window.SIRA_COURSE);

      const normalized = [];
      for (let num = 1; num <= 7; num++) {
        const fb = FALLBACK_META[num];
        const raw = rawMap[num] || {};
        const qs = Array.isArray(raw.questions) ? raw.questions :
                   Array.isArray(raw.quiz) ? raw.quiz : [];

        let badgeText = raw.badge || raw.label || "";
        if (!badgeText || badgeText === "undefined" || typeof badgeText === "number") {
          badgeText = fb.badge;
        }

        let descText = raw.desc || raw.description || raw.subtitle || "";
        if (!descText || descText === "undefined") {
          descText = fb.desc;
        }

        let titleText = raw.title || fb.title;
        let cheatText = raw.cheatsheet || raw.cheat || raw.ref || raw.summary || "";

        normalized.push({
          num: num,
          section: raw.section || fb.section,
          badge: badgeText,
          title: titleText,
          desc: descText,
          cheatsheet: cheatText,
          questions: qs
        });
      }
      return normalized;
    }

    let MODULES_LIST = [];
    let activeModule = null;
    let activeQuestions = [];
    let currentQIndex = 0;
    let currentScore = 0;
    let currentMistakes = [];
    let balanceSlot = 0;

    function prepareBalancedQuestions(rawQuestions) {
      const copy = rawQuestions.map((item) => {
        const qText = item.q || item.question || "";
        const origOpts = Array.isArray(item.opts) ? [...item.opts] :
                         Array.isArray(item.options) ? [...item.options] :
                         Array.isArray(item.a) ? [...item.a] : [];
        let origAns = typeof item.ans === "number" ? item.ans :
                      typeof item.correct === "number" ? item.correct :
                      typeof item.c === "number" ? item.c :
                      typeof item.answer === "number" ? item.answer : 0;
        if (origAns < 0 || origAns >= origOpts.length) origAns = 0;

        const correctStr = origOpts[origAns];
        const wrongArr = origOpts.filter((_, i) => i !== origAns);

        for (let i = wrongArr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [wrongArr[i], wrongArr[j]] = [wrongArr[j], wrongArr[i]];
        }

        const slot = (balanceSlot + Math.floor(Math.random() * origOpts.length)) % origOpts.length;
        balanceSlot++;

        const mixedOpts = [];
        let wPtr = 0;
        for (let i = 0; i < origOpts.length; i++) {
          if (i === slot) mixedOpts.push(correctStr);
          else mixedOpts.push(wrongArr[wPtr++]);
        }

        return {
          q: qText,
          opts: mixedOpts,
          ans: slot,
          exp: item.exp || item.explanation || ""
        };
      });

      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function renderModulesList() {
      const uid = typeof getCurrentUserId === "function" ? getCurrentUserId() : "guest";
      const backBtn = document.getElementById("backHomeBtn");
      if (backBtn) backBtn.href = "../index.html?uid=" + encodeURIComponent(uid);

      MODULES_LIST = extractAllModules();

      let totalQ = 0;
      let totalCh = 0;
      MODULES_LIST.forEach((m) => {
        totalQ += m.questions.length;
        if (m.cheatsheet) totalCh++;
      });

      document.getElementById("statModules").textContent = `📚 ${MODULES_LIST.length} модулей`;
      document.getElementById("statQuestions").textContent = `📝 ${totalQ} вопросов`;
      document.getElementById("statCheats").textContent = `📖 ${totalCh} шпаргалок`;

      const containers = {
        main: document.getElementById("groupMain"),
        extra: document.getElementById("groupExtra"),
        final: document.getElementById("groupFinal")
      };

      containers.main.innerHTML = "";
      containers.extra.innerHTML = "";
      containers.final.innerHTML = "";

      MODULES_LIST.forEach((m) => {
        const qCount = m.questions.length;
        const best = localStorage.getItem("sira_best_" + m.num);
        const bestHtml = best ? `<span class="best-score">Лучший: ${best}/${qCount}</span>` : "";
        const badgeCls = m.section === "extra" ? "extra" : (m.section === "final" ? "final" : "");

        const card = document.createElement("div");
        card.className = "module-card";
        card.innerHTML = `
          <div class="module-top">
            <span class="module-badge ${badgeCls}">${m.badge} • ${qCount} вопросов</span>
            ${bestHtml}
          </div>
          <div class="module-title">${m.title}</div>
          <div class="module-desc">${m.desc}</div>
          <div class="card-actions">
            <button class="btn-cheat" ${m.cheatsheet ? "" : "disabled"} onclick="openCheatsheet(${m.num})">📖 Шпаргалка</button>
            <button class="btn-test" ${qCount > 0 ? "" : "disabled"} onclick="startModuleQuiz(${m.num})">📝 Тест</button>
          </div>
        `;

        const target = containers[m.section] || containers.main;
        target.appendChild(card);
      });
    }

    function openCheatsheet(num) {
      const m = MODULES_LIST.find((x) => x.num === num);
      if (!m || !m.cheatsheet) return;
      activeModule = m;

      document.getElementById("cheatTitle").textContent = m.title;
      document.getElementById("cheatContent").innerHTML = m.cheatsheet;
      const toTestBtn = document.getElementById("cheatToTestBtn");
      toTestBtn.onclick = () => startModuleQuiz(num);
      toTestBtn.style.display = m.questions.length > 0 ? "inline-flex" : "none";

      document.getElementById("catalogView").classList.add("hidden");
      document.getElementById("quizView").classList.add("hidden");
      document.getElementById("cheatsheetView").classList.remove("hidden");
      window.scrollTo(0, 0);
    }

    function openCheatsheetFromQuiz() {
      if (activeModule && activeModule.cheatsheet) {
        openCheatsheet(activeModule.num);
      }
    }

    function startModuleQuiz(num, customQuestions = null) {
      const m = MODULES_LIST.find((x) => x.num === num);
      if (!m || m.questions.length === 0) return;
      activeModule = m;

      activeQuestions = customQuestions ? customQuestions : prepareBalancedQuestions(m.questions);
      currentQIndex = 0;
      currentScore = 0;
      currentMistakes = [];

      document.getElementById("quizModuleTitle").textContent = m.title;
      document.getElementById("catalogView").classList.add("hidden");
      document.getElementById("cheatsheetView").classList.add("hidden");
      document.getElementById("quizResult").classList.add("hidden");
      document.getElementById("quizActive").classList.remove("hidden");
      document.getElementById("quizView").classList.remove("hidden");

      renderCurrentQuestion();
      window.scrollTo(0, 0);
    }

    function renderCurrentQuestion() {
      const total = activeQuestions.length;
      const item = activeQuestions[currentQIndex];

      document.getElementById("qCounter").textContent = `Вопрос ${currentQIndex + 1} из ${total}`;
      document.getElementById("qScoreLive").textContent = `Верно: ${currentScore}`;
      document.getElementById("progressFill").style.width = `${(currentQIndex / total) * 100}%`;
      document.getElementById("qText").textContent = item.q;

      const optsEl = document.getElementById("optionsList");
      optsEl.innerHTML = "";

      item.opts.forEach((optText, idx) => {
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.textContent = optText;
        btn.onclick = () => selectOption(idx, btn);
        optsEl.appendChild(btn);
      });

      document.getElementById("expBox").classList.add("hidden");
      document.getElementById("nextBtn").classList.add("hidden");
    }

    function selectOption(chosenIdx, chosenBtn) {
      const item = activeQuestions[currentQIndex];
      const allBtns = document.querySelectorAll("#optionsList .opt-btn");
      allBtns.forEach((b) => (b.disabled = true));

      if (chosenIdx === item.ans) {
        chosenBtn.classList.add("correct");
        currentScore++;
        document.getElementById("qScoreLive").textContent = `Верно: ${currentScore}`;
      } else {
        chosenBtn.classList.add("wrong");
        if (allBtns[item.ans]) allBtns[item.ans].classList.add("correct");
        currentMistakes.push({
          q: item.q,
          opts: item.opts,
          ans: item.ans,
          exp: item.exp,
          userText: item.opts[chosenIdx]
        });
      }

      const expBox = document.getElementById("expBox");
      if (item.exp) {
        expBox.innerHTML = `<strong>Пояснение:</strong> ${item.exp}`;
        expBox.classList.remove("hidden");
      }

      const nextBtn = document.getElementById("nextBtn");
      nextBtn.textContent = currentQIndex + 1 < activeQuestions.length ? "Следующий вопрос" : "Завершить тест";
      nextBtn.classList.remove("hidden");
    }

    function nextQuestion() {
      currentQIndex++;
      if (currentQIndex < activeQuestions.length) {
        renderCurrentQuestion();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      document.getElementById("progressFill").style.width = "100%";
      document.getElementById("quizActive").classList.add("hidden");
      document.getElementById("quizResult").classList.remove("hidden");

      const total = activeQuestions.length;
      document.getElementById("finalScoreText").textContent = `${currentScore} / ${total}`;

      if (activeModule && total === activeModule.questions.length) {
        const prevBest = Number(localStorage.getItem("sira_best_" + activeModule.num) || "0");
        if (currentScore > prevBest) {
          localStorage.setItem("sira_best_" + activeModule.num, String(currentScore));
        }
      }

      const pct = Math.round((currentScore / total) * 100);
      let msg = "";
      if (pct === 100) msg = "Ма ша Аллах! Безупречный результат — 100%!";
      else if (pct >= 80) msg = "Отличный результат! Материал усвоен очень хорошо.";
      else if (pct >= 60) msg = "Хороший результат! Повторите шпаргалку, чтобы закрепить детали.";
      else msg = "Рекомендуется внимательно изучить шпаргалку и пройти тест ещё раз.";
      document.getElementById("finalCommentText").textContent = msg;

      const retryBtn = document.getElementById("retryMistakesBtn");
      const mistakesBox = document.getElementById("mistakesContainer");
      mistakesBox.innerHTML = "";

      if (currentMistakes.length > 0) {
        retryBtn.classList.remove("hidden");
        currentMistakes.forEach((m, idx) => {
          const div = document.createElement("div");
          div.className = "mistake-card";
          div.innerHTML = `
            <div style="font-weight:700;margin-bottom:4px;">${idx + 1}. ${m.q}</div>
            <div style="color:#6E2820;">❌ Ваш ответ: ${m.userText}</div>
            <div style="color:#1F523F;font-weight:700;">✅ Верно: ${m.opts[m.ans]}</div>
            ${m.exp ? `<div style="margin-top:5px;color:#3C5042;">${m.exp}</div>` : ""}
          `;
          mistakesBox.appendChild(div);
        });
      } else {
        retryBtn.classList.add("hidden");
      }
    }

    function restartCurrentQuiz() {
      if (activeModule) startModuleQuiz(activeModule.num);
    }

    function retryMistakes() {
      if (!activeModule || currentMistakes.length === 0) return;
      const retryList = prepareBalancedQuestions(currentMistakes);
      startModuleQuiz(activeModule.num, retryList);
    }

    function closeSubViews() {
      document.getElementById("cheatsheetView").classList.add("hidden");
      document.getElementById("quizView").classList.add("hidden");
      document.getElementById("catalogView").classList.remove("hidden");
      renderModulesList();
      window.scrollTo(0, 0);
    }

    document.addEventListener("DOMContentLoaded", renderModulesList);
  </script>
</body>
</html>
